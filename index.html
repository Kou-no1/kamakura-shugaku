.quiz-dialog { width: min(690px, calc(100% - 24px)); }
.quiz-dialog .modal-body { padding: clamp(18px, 4vw, 30px); }
.quiz-dialog .quiz-heading, .quiz-dialog .quiz-question {
  margin: 0 0 16px;
  line-height: 1.85;
}
.quiz-tone-easy { --quiz-accent: #346446; --quiz-tint: #e7f0e1; }
.quiz-tone-normal { --quiz-accent: #2a626b; --quiz-tint: #e2eef0; }
.quiz-tone-hard { --quiz-accent: #835229; --quiz-tint: #f6e9d7; }
.quiz-tone-expert { --quiz-accent: #71506b; --quiz-tint: #efe6ee; }
.quiz-levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.quiz-level {
  display: flex; flex-direction: column; gap: 8px;
  text-align: left; padding: 15px 16px; color: var(--ink);
  border: 1px solid var(--line); border-top: 4px solid var(--quiz-accent);
  border-radius: 14px; background: var(--white);
}
.quiz-level:hover { background: var(--quiz-tint); border-color: var(--quiz-accent); }
.quiz-level-head, .quiz-level-foot, .quiz-level-go, .quiz-meta, .quiz-meta b,
.quiz-score, .quiz-actions { display: flex; align-items: center; }
.quiz-level-head { gap: 10px; }
.quiz-level-head strong { font-size: 17px; color: var(--quiz-accent); }
.quiz-icon, .quiz-letter { display: grid; place-items: center; flex-shrink: 0; }
.quiz-icon { width: 34px; height: 34px; border-radius: 10px; color: var(--quiz-accent); background: var(--quiz-tint); }
.quiz-level-desc { line-height: 2.2; }
.quiz-level-foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); justify-content: space-between; gap: 8px; font-size: 12px; }
.quiz-level-go { gap: 3px; color: var(--quiz-accent); font-weight: 700; }
.quiz-level-go .icon { width: 13px; height: 13px; }
.quiz-meta { gap: 12px; flex-wrap: wrap; font-size: 13px; }
.quiz-meta b { gap: 5px; border-radius: 8px; padding: 3px 9px; background: var(--quiz-tint); color: var(--quiz-accent); line-height: 2.1; }
.quiz-meta b .icon { width: 15px; height: 15px; }
.quiz-counter { margin-inline-start: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.quiz-progress { width: 100%; height: 7px; margin: 12px 0 20px; border-radius: 12px; border: 0; overflow: hidden; color: var(--quiz-accent); background: var(--line); }
.quiz-progress::-webkit-progress-bar { background: var(--line); }
.quiz-progress::-webkit-progress-value { background: var(--quiz-accent); }
.quiz-progress::-moz-progress-bar { background: var(--quiz-accent); }
.quiz-dialog .quiz-question { font-size: clamp(18px, 3.3vw, 23px); line-height: 2.2; }
.quiz-choices { display: grid; gap: 9px; }
.quiz-choice {
  width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; text-align: left; background: var(--white);
  border: 1px solid #bfc9b9; border-radius: 11px;
  font-size: 15px; line-height: 2.1;
}
.quiz-choice:hover:enabled { background: var(--quiz-tint); border-color: var(--quiz-accent); }
.quiz-letter { font-size: 12px; font-weight: 700; width: 28px; height: 28px; background: #eef0e8; border-radius: 50%; }
.quiz-choice-text { flex: 1; overflow-wrap: anywhere; }
.quiz-choice:disabled { opacity: 1; cursor: default; }
.quiz-choice.is-correct { border: 2px solid #46704d; color: #244d32; background: #eaf4e6; }
.quiz-choice.is-picked { border: 2px dashed #9b6147; background: #fbefea; }
.quiz-choice-status { flex-shrink: 0; font-size: 11px; font-weight: 700; }
.quiz-feedback, .quiz-review-body { overflow-wrap: anywhere; }
.quiz-feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: #f0f3e9; scroll-margin: 16px; }
.quiz-feedback h4, .quiz-review-title { margin: 0; font-size: 17px; line-height: 2; }
.quiz-dialog .quiz-feedback p, .quiz-dialog .quiz-review-body p { font-size: 14px; margin: 6px 0; }
.quiz-solution { font-weight: bold; }
.quiz-source { display: inline-block; padding: 6px 0; font-size: 12px; line-height: 2.1; text-underline-offset: 3px; }
.quiz-actions { gap: 9px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
.quiz-actions .btn { min-height: 44px; white-space: normal; }
.quiz-score { gap: 12px; background: var(--quiz-tint); color: var(--quiz-accent); padding: 12px 18px; border-radius: 12px; }
.quiz-score .icon { width: 28px; height: 28px; }
.quiz-score strong { font-size: 34px; }
.quiz-review-title { margin: 24px 0 8px; }
.quiz-review-row { border-bottom: 1px solid var(--line); }
.quiz-review-row summary { padding: 12px 2px; cursor: pointer; font-size: 14px; font-weight: 650; line-height: 2.2; }
.quiz-review-row summary:focus-visible { outline: 3px solid #d6a13d; outline-offset: 2px; }
.quiz-review-mark { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #f6e3d4; color: #734225; font-size: 11px; margin-right: 4px; }
.quiz-review-mark.is-correct { background: #e3edde; color: #31553b; }
.quiz-review-body { padding: 4px 12px 14px; }
@media (max-width: 480px) {
  .quiz-levels { grid-template-columns: 1fr; gap: 9px; }
  .quiz-level { padding: 10px 14px; gap: 4px; }
  .quiz-level-foot { padding-top: 4px; }
  .quiz-choice { padding: 9px; gap: 8px; }
  .quiz-meta { gap: 7px; }
}
</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><noscript>このサイトをつかうには JavaScript をゆうこうにしてください。</noscript><script id="lesson-data" type="application/json">{"schema": "kamakura-quest/1", "id": "kamakura-demo-v1", "title": "鎌倉と江の島、発見の旅", "version": 2, "mission": {"start": "hachiman", "goal": "enosui", "checkpoints": ["daibutsu", "enoshima"], "startTime": "09:00", "endTime": "14:00", "budget": 500, "requireNote": false, "prompt": "歴史のひみつと海の自然を見つけよう。大仏と江ノ島駅を通って、水族館へ！", "ticketMinutes": 5, "allowanceMode": false, "allowance": 3000}, "places": [{"id": "hachiman", "name": "鶴岡八幡宮", "lat": 35.3261, "lng": 139.5565, "category": "history", "headline": "七つの発見で、境内探検を完成させよう", "story": "鶴岡八幡宮の境内には、池・橋・馬場・建物・木など、歴史を学ぶ手がかりがたくさんあります。見出しから一つずつ開き、読んだことや観察したことを確かめよう。七つすべてを学習すると進み具合が100％になり、見学終了スタンプを押せます。", "question": "頼朝がこの場所をまちづくりの中心に選んだ理由を、地図から考えよう。", "tip": "階段では横に広がらず、参拝している人の通り道を空けよう。", "source": "https://www.hachimangu.or.jp/matsuri/", "photos": [], "itemName": "まちづくりの巻物", "itemDescription": "武士の都の地形とまちづくりを考えた証。", "itemType": "scroll", "fee": null, "chapters": [{"id": "genji-pond", "title": "源氏池：三つの島にこめた願い", "location": "参道の東側・源氏池", "kind": "名前にこめられた意味", "body": "参道の東側にあるのが源氏池です。鶴岡八幡宮の案内では、三つの島の「三」を「産」に重ね、源氏の繁栄を願ったと説明されています。池や島の配置にも、当時の人々の思いが表れています。", "question": "池の島を数えてみよう。まちや庭の形に願いをこめるのは、どんな気持ちからだろう？", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}, {"id": "heike-pond", "title": "平家池：源氏池と比べてみよう", "location": "参道の西側・平家池", "kind": "伝えられている意味", "body": "参道の西側が平家池です。四つの島の「四」と「死」の音を重ね、平家の衰退を願ったという説明が伝わっています。源氏池と平家池を一緒に見て、源氏と平家が争った時代の人々の思いを考えてみよう。", "question": "二つの池は、参道をはさんでどのように向かい合っている？ 名前と島の数を比べてみよう。", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}, {"id": "taiko-bridge", "title": "太鼓橋：正面と横から形を見よう", "location": "三の鳥居の先・池の間", "kind": "形と位置の観察", "body": "太鼓橋は、池の間にかかる大きく反った橋です。正面から見ると、本宮へ続く参道とのつながりがわかります。横からは、橋がえがく曲線を観察できます。見学できる場所から、見る向きによる形の違いを比べよう。", "question": "太鼓橋とまっすぐな橋では、見え方や歩きやすさがどう違いそう？ 柵や通行の表示も確かめよう。", "source": "https://www.trip-kamakura.com/facility/detail.php?id=54"}, {"id": "yabusame", "title": "流鏑馬馬場：馬と弓の技を想像しよう", "location": "参道を横切る流鏑馬馬場", "kind": "武士の技と神事", "body": "流鏑馬は、走る馬に乗ったまま的に矢を射る神事です。境内には、その舞台となる長い馬場があります。馬の速さ、体のバランス、矢を射る動きを重ねて想像すると、武士に求められた技が見えてきます。", "question": "馬場の長さを地図で確かめよう。馬に乗った人や見物する人には、どんな場所が必要だろう？", "source": "https://www.hachimangu.or.jp/matsuri/"}, {"id": "pigeon-eight", "title": "本宮の楼門：「八」にかくれた鳩を探そう", "location": "大石段の上・本宮の楼門の額", "kind": "文字や飾りの観察", "body": "楼門の額にある「八幡宮」の「八」をよく見ると、二羽の鳩の形が見えてきます。鳩は、八幡さまのお使いとして大切にされてきました。文字や建物の飾りにも、神社と生き物のつながりが表れています。", "question": "二羽の鳩はどちらを向いている？ 文字として読むときと、絵として見るときの違いを話し合おう。", "source": "https://www.hachimangu.or.jp/pray/omamori.html"}, {"id": "sanetomo", "title": "大石段：実朝と公暁の事件を知ろう", "location": "本宮へ上がる大石段", "kind": "史料と伝承を分けて読む", "body": "1219年、鎌倉幕府の三代将軍・源実朝は、鶴岡八幡宮で公暁に襲われ、命を落としました。公暁は二代将軍・源頼家の子で、実朝のおいにあたります。鎌倉市の資料は、『吾妻鏡』に公暁が「石段の陰」から出てきたと記されていることを紹介しています。", "detail": "公暁が大イチョウに隠れていたという話も語られています。この話と、史料で確かめられる記述を分けて読み、どの資料に何が書かれているのかを比べよう。", "question": "実朝・頼家・公暁の関係を図にしてみよう。史料にあることと、後に伝えられた話をどう区別できる？", "source": "https://www.city.kamakura.kanagawa.jp/kouhou/kamakura/h30/t181215-7.html"}, {"id": "great-ginkgo", "title": "大イチョウ：倒れても続く命を見つけよう", "location": "大石段のそば・親銀杏と子銀杏", "kind": "今の姿と昔の写真を比べる", "body": "大イチョウは、2010年3月10日に強風で倒れました。今は、移された幹の「親銀杏」と、もとの根元から伸びたひこばえの「子銀杏」が育っています。昔の大きな木の写真と今の姿を比べ、木の命がどのようにつながっているか考えてみよう。", "question": "親銀杏と子銀杏を見分ける手がかりは？ 歴史を伝える場所を、これからどう守っていきたい？", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}]}, {"id": "komachi", "name": "小町通り", "lat": 35.322, "lng": 139.5534, "category": "town", "headline": "観光のまちと暮らし", "story": "鎌倉駅から鶴岡八幡宮へ向かう通りの一つです。観光に来る人、お店で働く人、近くに住んでいる人。同じ道でも、使う目的はそれぞれ違います。旅を楽しむことと、まちの暮らしを大切にすることを両立させよう。", "question": "お店の人や住民の人も気持ちよく過ごせるように、班でできることは？", "tip": "食べるときはお店の案内に従い、立ち止まる場所を選ぼう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "まちの思いやりメダル", "itemDescription": "観光する人と暮らす人の気持ちを考えた証。", "itemType": "medal", "fee": null}, {"id": "kamakura", "name": "鎌倉駅", "lat": 35.319, "lng": 139.5504, "category": "station", "headline": "江ノ電の冒険はここから", "story": "江ノ電は鎌倉と藤沢を結ぶ電車です。鶴岡八幡宮のすぐ前から乗れるわけではありません。まず鎌倉駅まで歩き、乗り場や行き先を確かめて乗車します。地図の「江ノ電に乗る」から駅を選んでみよう。", "question": "乗り間違えないために、乗る前に何を確かめる？", "tip": "ホームでは白線・黄色い線の内側で待ち、降りる人を先に通そう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "はじまりのきっぷ", "itemDescription": "乗る前に駅と行き先を確かめた証。", "itemType": "train", "fee": null}, {"id": "kencho", "name": "建長寺", "lat": 35.3316, "lng": 139.5557, "category": "history", "headline": "山に囲まれたお寺", "story": "北鎌倉から鶴岡八幡宮へ向かう途中にある禅のお寺です。建物だけでなく、参道の向きや山との位置関係も観察しよう。静けさを感じながら、同じ鎌倉にある神社との違いを探してみよう。", "question": "神社とお寺の建物や入り口には、どんな違いがある？", "tip": "境内では声の大きさを考え、撮影禁止の表示を確かめよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "静けさのしおり", "itemDescription": "神社とお寺の違いを見つけた証。", "itemType": "scroll", "fee": null}, {"id": "kita", "name": "北鎌倉駅", "lat": 35.337, "lng": 139.5453, "category": "station", "headline": "山側からの入り口", "story": "北鎌倉駅の周辺にはお寺が集まっています。ここはJRの駅で、江ノ電の駅ではありません。鎌倉駅との位置関係を見て、歩いて巡るときの順番を考えよう。", "question": "北鎌倉から出発すると、どんな見学の順番にできそう？", "tip": "踏切では止まり、遮断機が下り始めたら絶対に入らない。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "山の入り口のきっぷ", "itemDescription": "北鎌倉と鎌倉の位置関係を考えた証。", "itemType": "train", "fee": null}, {"id": "meigetsu", "name": "明月院", "lat": 35.3343, "lng": 139.5514, "category": "history", "headline": "季節とお寺をつなぐ", "story": "北鎌倉のお寺を巡るコースに含まれる見学場所です。建物や庭、植物の姿は季節によって変わります。写真を見比べながら、自分たちの修学旅行の季節には何を確かめたいか考えてみよう。", "question": "季節が違う写真を比べると、何が変わり、何が変わらない？", "tip": "植物に触れたり、花を摘んだりせずに観察しよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "季節の葉っぱ", "itemDescription": "季節と見学場所の変化を考えた証。", "itemType": "leaf", "fee": null}, {"id": "hokoku", "name": "報国寺", "lat": 35.3207, "lng": 139.5693, "category": "history", "headline": "東のエリアにも発見が", "story": "鎌倉の見学先は駅の西側だけにあるのではありません。報国寺は鶴岡八幡宮から東側のエリアにあります。行きたい場所が離れているとき、見学時間と移動時間の両方から班の計画を考えよう。", "question": "東のエリアに寄るなら、他の見学先や時間をどう調整する？", "tip": "このゲームの道は学習用。実際の道順は先生の案内や公式地図で確認しよう。", "source": "https://www.kanagawa-kankou.or.jp/courses/14", "photos": [], "itemName": "寄り道の巻物", "itemDescription": "時間と見学先の選び方を考えた証。", "itemType": "scroll", "fee": null}, {"id": "yuiga", "name": "由比ガ浜", "lat": 35.3086, "lng": 139.5429, "category": "nature", "headline": "海から見る鎌倉", "story": "鎌倉は南を海に、ほかの三方を山に囲まれています。浜辺から山の方を振り返ると、地図で見た地形が想像しやすくなります。歴史を調べるときも、土地の形が大切な手がかりになります。", "question": "海と山に囲まれることには、どんな便利さや不便さがある？", "tip": "海には入らず、決められた範囲で観察。海沿いでは避難先も確認しよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "海辺の貝がら", "itemDescription": "海と山に囲まれた地形を考えた証。", "itemType": "shell", "fee": null}, {"id": "daibutsu", "name": "鎌倉大仏（高徳院）", "lat": 35.3167, "lng": 139.5357, "category": "history", "headline": "800年近く前からの問い", "story": "高徳院の大仏は青銅製で、『吾妻鏡』には1252年に造立が始まったと記されています。像の高さは約11.3メートル。作者など、まだ明らかになっていないこともあります。歴史には「わかっていること」と「調べ続けていること」があるのです。", "question": "大きな青銅の仏像をつくるには、どんな人の力や材料が必要だっただろう？", "tip": "像や文化財を守るため、現地の見学ルールに従おう。", "source": "https://www.kotoku-in.jp/about.html", "photos": [], "itemName": "青銅のメダル", "itemDescription": "大仏をつくった人々の力を想像した証。", "itemType": "medal", "fee": null}, {"id": "hasedera", "name": "長谷寺", "lat": 35.3125, "lng": 139.533, "category": "history", "headline": "お寺から海を見よう", "story": "長谷寺には十一面観音像があり、境内には相模湾や街並みを見渡せる場所があります。山の中腹にあるお寺と、海辺のまち。高い場所から地形を眺めると、歩いてきた道も違って見えるかもしれません。", "question": "高い場所から見える景色と地図を比べて、同じ場所を探そう。", "tip": "階段があるので、班の歩く速さをそろえよう。", "source": "https://www.hasedera.jp/about/", "photos": [], "itemName": "見晴らしのしおり", "itemDescription": "高い場所の景色と地図をつなげた証。", "itemType": "scroll", "fee": null}, {"id": "hase", "name": "長谷駅", "lat": 35.3113, "lng": 139.5365, "category": "station", "headline": "歴史の見学と電車をつなぐ", "story": "大仏や長谷寺を見学する際の江ノ電の最寄り駅です。見学先から駅へ戻る時間、切符を買う時間、ホームで待つ時間も、班の計画に入れておこう。時刻表を調べ、何時の電車なら乗れるか自分たちで確かめます。", "question": "出発時刻に間に合うために、見学を何時に終える？", "tip": "電車の時刻と混雑は当日に確認。この画面の時間は練習用だよ。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "長谷のきっぷ", "itemDescription": "見学と駅への移動を計画した証。", "itemType": "train", "fee": null}, {"id": "gokuraku", "name": "極楽寺駅", "lat": 35.3094, "lng": 139.5282, "category": "station", "headline": "山から海へ", "story": "江ノ電の車窓から、山側と海側で景色がどう変わるか想像してみよう。駅のまわりには生活の道があります。鉄道が、観光と地域の暮らしの両方を支えていることにも目を向けよう。", "question": "観光客と住民が同じ電車を使うとき、どんな気配りができる？", "tip": "線路や私有地に入らず、安全な場所から観察しよう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "山あいのきっぷ", "itemDescription": "地域の暮らしと鉄道を考えた証。", "itemType": "train", "fee": null}, {"id": "inamura", "name": "稲村ヶ崎駅", "lat": 35.3044, "lng": 139.5231, "category": "station", "headline": "海辺を走る電車", "story": "沿線には海が近くなる区間があります。地図で海岸の形と線路の向きを比べてみよう。道や鉄道は、平らな土地や山の位置とどんな関係があるのだろう。", "question": "線路は、海岸や山を避けるようにどこを通っている？", "tip": "海沿いの学習では、津波の避難先を先生と事前に確認しよう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "岬の貝がら", "itemDescription": "線路と海岸の関係を調べた証。", "itemType": "shell", "fee": null}, {"id": "shichiri", "name": "七里ヶ浜駅", "lat": 35.3068, "lng": 139.5102, "category": "station", "headline": "相模湾に沿って", "story": "地図で現在の場所から江の島を探してみよう。同じ海沿いでも、砂浜や岬のようすは少しずつ違います。窓から見えそうなものを予想して、実際の旅行の観察メモにつなげよう。", "question": "海岸の形が変わると、人の暮らしや道はどう変わりそう？", "tip": "車内では大声を出さず、景色は座席や通路をゆずり合って楽しもう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "波のしおり", "itemDescription": "海岸の形とまちを比べた証。", "itemType": "scroll", "fee": null}, {"id": "kokomae", "name": "鎌倉高校前駅", "lat": 35.3067, "lng": 139.5008, "category": "station", "headline": "写真より先に、安全を", "story": "人気の場所には多くの人が集まります。写真を撮りたい気持ちと、通る人の安全を両立させるにはどうすればよいでしょう。修学旅行は、まちの一員として行動する練習でもあります。", "question": "人が多くて通れないとき、班でどう判断する？", "tip": "車道や線路に出て写真を撮らない。通行の妨げにならないようにしよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "安全のおまもり", "itemDescription": "混雑している場所での行動を考えた証。", "itemType": "medal", "fee": null}, {"id": "koshigoe", "name": "腰越駅", "lat": 35.3085, "lng": 139.4933, "category": "station", "headline": "ま function discoverHTML(){let spots=lesson.places.filter(p=>(filter==='all'||p.category===filter)&&(p.name+p.story).includes(query));return `<main class="section-panel"><div class="section-heading"><div><h2>鎌倉の発見ずかん</h2><p>見学前にも読めるよ。見つけた問いを、旅に持っていこう。</p></div><span class="tag">${lesson.places.length}か所の発見</span></div><div class="search-row"><input id="spot-search" type="text" placeholder="場所・気になる言葉でさがす" aria-label="場所を検索" value="${esc(query)}">${[['all','すべて'],...Object.entries(cat)].map(([v,label])=>`<button class="filter-btn ${filter===v?'active':''}" data-action="filter" data-value="${v}">${label}</button>`).join('')}</div><div id="spot-grid" class="spot-grid">${spotCards(spots)}</div></main>`;}

function journalHTML(){const m=lesson.mission;return `<main class="section-panel" id="journal"><div class="section-heading"><div><h2>${esc(state.team)}の旅のノート</h2><p>教材：${esc(lesson.title)} · 計算や予想は自分たちの記録です。</p></div><div class="modal-actions" style="margin-top:0">${button('journalExport',icon('download')+'記録を書き出す','small')}${button('print',icon('print')+'印刷・PDF','small')}<label class="btn small file-label">記録を読み込む<input type="file" accept=".json,application/json" id="journal-import"></label></div></div>${state.completed?'<div class="celebrate"><div class="big">✧</div><h3>見学ミッション、達成！</h3><p>集合時刻や予算にも合う計画かな？ 調べたことや、考えが変わったことを振り返ってみよう。</p></div>':''}<div class="modal-actions no-print" style="margin:0 0 15px">${button('schedule',icon('clock')+'班の予定表をつくる','small primary')}${button('collection','おみやげ図鑑','small')}${lesson.mission.allowanceMode?button('money','お金のノート','small'):''}</div><div class="journal-summary"><span>見学 <b>${Object.keys(state.visits).length}か所</b></span><span>移動の記録 <b>${state.legs.length}件</b></span><span>自分で合計した交通費 <b>${state.totalFare===''?'未計算':esc(state.totalFare)+'円'}</b></span><span>集合時刻 <b>${m.endTime}</b></span>${button('totals','計算を記録する','small subtle')}</div><h3 style="font-size:15px">移動の見通しと、学び直し</h3>${state.legs.length?state.legs.map((l,i)=>{const hints=reviewLeg(l,m.ticketMinutes);return `<article class="journal-entry"><span class="tag">${l.mode==='train'?'江ノ電':'徒歩'}</span> <small>${esc(l.depart)} → ${esc(l.arrive)} / 自分の計算 ${esc(l.duration)}分</small><h3>${esc(place(l.from).name)} → ${esc(place(l.to).name)}</h3>${l.mode==='train'?`<small>切符購入後 ${esc(l.ready)} / 選んだ電車 ${esc(l.board)}発 / 調べた運賃 ${esc(l.fare)}円</small>`:''}<p>${esc(l.evidence)}</p>${hints.length?`<div class="tip">見直すヒント：${hints.map(esc).join(' ／ ')}</div>`:''}${l.revisions.length?`<details><summary style="font-size:11px">前の考えを見る（${l.revisions.length}回見直し）</summary>${l.revisions.map(r=>`<p><small>${esc(r.depart)} → ${esc(r.arrive)} / ${esc(r.duration)}分</small><br>${esc(r.evidence)}</p>`).join('')}</details>`:''}${button('revise',icon('edit')+'調べ直して修正','small no-print','data-index="'+i+'"')}</article>`;}).join(''):'<div class="empty">まだ移動の記録がないよ。地図から行き先を選んでみよう。</div>'}<h3 style="font-size:15px;margin-top:28px">見学と発見のメモ</h3>${Object.entries(state.visits).map(([id,v])=>`<article class="journal-entry"><small>見学を終えた予定時刻 ${esc(v.time)}</small><h3>${esc(place(id).name)}</h3><p>${esc(state.notes[id]||'まだメモがありません。')}</p>${button('spot','メモを開く','small no-print','data-id="'+id+'"')}</article>`).join('')||'<p class="helper">見学を終えた場所がここに並びます。</p>'}<section class="reflection"><label for="reflection">はじめの予想と、調べてわかったことは、どう変わった？</label><textarea id="reflection" maxlength="10000" placeholder="時間の見積もり、時刻表、歴史の問い、班で相談したこと…">${esc(state.reflection)}</textarea><p class="print-only">${esc(state.reflection)}</p><p class="helper no-print">入力内容はこの端末に保存されます。提出するときは記録を書き出して先生に渡そう。</p></section><div class="no-print">${button('reset','この端末の旅をはじめ直す','small danger')}</div></main>`;}
function openModal(title,body,wide=false){closeModal();lastFocus=document.activeElement;const d=document.createElement('dialog');d.className=wide?'wide':'';d.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close" aria-label="閉じる">${icon('close')}</button></div><div class="modal-body">${body}</div>`;$('#modal-root').append(d);d.addEventListener('close',()=>{d.remove();lastFocus?.isConnected&&lastFocus.focus();});d.showModal();return d;}
function closeModal(){const d=$('#modal-root dialog');if(d){d.close();d.remove();}}
function spotModal(id){if(busy)return;const p=place(id),here=state.position===id,visited=!!state.visits[id];openModal(p.name,`<div class="modal-art ${p.category} ${p.chapters?.length&&!p.photos.length?'hidden':''}">${p.photos.length?`<img src="${p.photos[0]}" alt="${esc(p.name)}の見学写真">`:artSvg(p)}</div><span class="tag">${cat[p.category]}</span>${lesson.mission.checkpoints.includes(id)?' <span class="tag orange">必須チェックポイント</span>':''}<h3 style="margin-top:9px">${esc(p.headline||p.name)}</h3><p>${esc(p.story)}</p>${learningOverview(p)}${p.photos.length>1?`<div class="photo-grid">${p.photos.slice(1).map(photo=>`<img src="${photo}" alt="${esc(p.name)}の追加写真">`).join('')}</div>`:''}<div class="question"><small>考えてみよう</small><p>${esc(p.question)}</p></div><div class="tip">${esc(p.tip)}</div><p class="source">参考：<a href="${esc(p.source||'https://education.trip-kamakura.com/')}" target="_blank" rel="noopener">公式資料でくわしく調べる ↗</a></p>${here||visited?`<form data-form="visit" data-id="${id}"><label class="form-label" for="spot-note">見つけたこと・まだわからないこと${lesson.mission.requireNote?'（必須）':''}</label><textarea id="spot-note" name="note" maxlength="5000" ${lesson.mission.requireNote?'required':''} placeholder="地図や資料から考えたことを書こう">${esc(state.notes[id]||'')}</textarea>${here?`<label class="form-label" style="margin-top:13px">見学を終える予定時刻（自分たちで計算）<input name="finish" type="time" value="${esc(state.time)}" required></label>`:''}${here?paymentFields(p):''}<div class="modal-actions"><button class="btn primary" type="submit" ${!visited&&!KQ.chapterProgress(lesson,state,id).complete?'disabled aria-disabled="true"':''}>${icon('check')}${visited?'メモを保存する':'見学を終えてスタンプを押す'}</button>${here&&canTrain(id)?button('train',icon('train')+'江ノ電に乗る','small'):''}</div></form>`:`<div class="modal-actions">${button('move',icon('walk')+'ここへ歩いていく','primary','data-id="'+id+'"')}${button('addPlan',icon('plus')+'見学プランに追加','','data-id="'+id+'"')}</div><p class="helper">移動の前に、時間と根拠を自分たちで調べます。</p>`}<div class="modal-actions">${externalMapLinks(p)}</div>`);}
function externalMapLinks(p){return `<a class="btn small" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">${icon('map')}Googleマップ ↗</a><a class="btn small" href="https://earth.google.com/web/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">${icon('globe')}Google Earth ↗</a>`;}
function inquiryForm(to,mode='walk',editIndex=null){const from=editIndex===null?state.position:state.legs[editIndex].from;const old=editIndex===null?null:state.legs[editIndex],target=place(to),train=mode==='train';if(from===to)return;const route=shortestPath(lesson,from,to,mode);if(!route){toast('この場所への道が見つかりませんでした。');return;}
openModal(editIndex===null?'調べて、移動の見通しを立てよう':'調べ直して、考えを更新しよう',`<span class="tag">${train?'江ノ電':'徒歩'}</span><h3 style="margin-top:10px;font-size:21px">${esc(place(from).name)} → ${esc(target.name)}</h3><p class="helper">答えを自動で出すことはしません。地図・資料${train?'・時刻表':''}を調べて、班で相談して入力しよう。</p>${train?`<div class="tip"><b>先生が決めた条件：切符を買うのに ${lesson.mission.ticketMinutes}分かかります。</b><br>駅に着く → 切符を買う → ホームで待つ → 乗車、の順に考えよう。</div>`:''}<form data-form="leg" data-to="${to}" data-from="${from}" data-mode="${mode}" ${editIndex===null?'':'data-index="'+editIndex+'"'}><div class="form-grid" style="margin-top:18px"><label>${train?'駅に着く予定時刻':'出発の予定時刻'}<input name="depart" type="time" value="${esc(old?.depart||state.time)}" required></label>${train?`<label>切符を買い終える時刻<input name="ready" type="time" value="${esc(old?.ready||'')}" required></label><label>調べて選んだ電車の発車時刻<input name="board" type="time" value="${esc(old?.board||'')}" required></label><label>調べた運賃（子ども1人分・円）<input name="fare" type="number" min="0" max="10000" value="${esc(old?.fare??'')}" required></label>`:''}<label>到着の予定時刻<input name="arrive" type="time" value="${esc(old?.arrive||'')}" required></label><label>${train?'切符購入・待ち時間も含む全体の':'自分たちで計算した'}移動時間（分）<input name="duration" type="number" min="0" max="1440" value="${esc(old?.duration??'')}" placeholder="自分たちで計算しよう" required></label><label class="span2">どう調べた？ どう計算した？<textarea name="evidence" maxlength="3000" required placeholder="見た資料の名前・日付・時刻表の曜日・計算や予想の根拠を書こう">${esc(old?.evidence||'')}</textarea></label></div><div class="modal-actions">${button('hint','ヒントを1つ見る','small','data-level="1" data-mode="'+mode+'"')}<a class="btn small" href="${train?'https://www.enoden.co.jp/train/':'https://www.trip-kamakura.com/img_data/pdf/annaizu2025_zentai.pdf'}" target="_blank" rel="noopener">${icon('book')}${train?'江ノ電の公式時刻表・駅情報':'公式の観光案内図'} ↗</a>${train?'<a class="btn small" href="https://www.enoden.co.jp/train/fare/" target="_blank" rel="noopener">運賃を調べる ↗</a>':''}</div><div id="inquiry-hints"></div><div id="leg-review" role="status"></div><div class="modal-actions"><button class="btn" type="button" data-action="reviewLeg">見直すポイントを確かめる</button><button class="btn primary" type="submit">${editIndex===null?'この見通しを記録して移動する':'修正して保存する'}${icon('arrow')}</button></div><p class="helper">見直しのヒントが出ても、自分たちの考えとして記録できます。調べ直した内容は、旅のノートから何度でも修正できます。</p></form>`,true);
}
function readLeg(form){const f=new FormData(form);const leg={from:form.dataset.from,to:form.dataset.to,mode:form.dataset.mode,depart:f.get('depart'),arrive:f.get('arrive'),duration:Number(f.get('duration')),evidence:String(f.get('evidence')).trim(),revisions:[]};if(leg.mode==='train'){leg.ready=f.get('ready');leg.board=f.get('board');leg.fare=Number(f.get('fare'));}return leg;}
function showReview(form){if(!form.reportValidity())return;const leg=readLeg(form),notes=reviewLeg(leg,lesson.mission.ticketMinutes);$('#leg-review').innerHTML=`<div class="${notes.length?'tip':'notice'}" style="margin-top:14px">${notes.length?notes.map(n=>'<div>・'+esc(n)+'</div>').join(''):'入力した時刻同士に大きな食い違いは見つかりませんでした。資料の読み方や道の条件も、班で確かめよう。'}</div>`;}
function trainModal(){if(busy)return;if(!canTrain(state.position)){toast('江ノ電の駅まで歩いて移動しよう。');return;}const stations=lesson.places.filter(p=>p.id!==state.position&&canTrain(p.id)&&shortestPath(lesson,state.position,p.id,'train'));openModal('江ノ電で、次のエリアへ',`<div class="modal-art">${artSvg({category:'station'})}</div><h3>${esc(place(state.position).name)}から乗車する</h3><p>降りる駅を選んだら、切符の購入時間と時刻表を確かめよう。</p><div class="tip">切符を買う時間：<b>${lesson.mission.ticketMinutes}分</b>（先生が設定した学習条件）</div><div class="train-grid">${stations.map(p=>`<button class="train-stop" data-action="railDestination" data-id="${p.id}"><span><b>${esc(p.name)}</b><small>発車・到着・運賃を自分で調べる</small></span>${icon('arrow')}</button>`).join('')}</div><p class="helper">地図では一部の途中駅を省略しています。公式時刻表では、途中駅と行き先も確かめてください。</p>`);}
async function travel(leg){const route=shortestPath(lesson,leg.from,leg.to,leg.mode);if(!route)return;busy=true;currentRoute=route.ids;closeModal();tab='explore';render();let cancelled=false;const startPosition=state.position;const player=$('#player');if(leg.mode==='train'&&player)player.innerHTML=avatarMarkup(true);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{for(let i=1;i<route.ids.length;i++){const a=project(place(route.ids[i-1]).lat,place(route.ids[i-1]).lng),b=project(place(route.ids[i]).lat,place(route.ids[i]).lng);if(reduce){player?.setAttribute('transform',`translate(${b.x} ${b.y})`);continue;}await new Promise(resolve=>{const start=performance.now(),ms=leg.mode==='train'?450:600;function tick(now){const t=Math.min((now-start)/ms,1),q=t*t*(3-2*t);player?.setAttribute('transform',`translate(${a.x+(b.x-a.x)*q} ${a.y+(b.y-a.y)*q})`);if(t<1)requestAnimationFrame(tick);else resolve();}requestAnimationFrame(tick);});}
state.legs.push(leg);state.position=leg.to;state.time=leg.arrive;state.completed=false;persist();}catch{cancelled=true;state.position=startPosition;toast('移動をやり直してください。');}finally{busy=false;currentRoute=null;render();if(!cancelled)spotModal(leg.to);}}
function direction(dir){if(busy||tab!=='explore'||$('dialog'))return;const p=project(place(state.position).lat,place(state.position).lng),vector={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];const choices=lesson.edges.filter(e=>e.mode==='walk'&&(e.a===state.position||e.b===state.position)).map(e=>{const id=e.a===state.position?e.b:e.a,v=project(place(id).lat,place(id).lng),dx=v.x-p.x,dy=v.y-p.y;return{id,score:(dx*vector[0]+dy*vector[1])/Math.hypot(dx,dy)};}).filter(c=>c.score>.25).sort((a,b)=>b.score-a.score);if(choices.length)inquiryForm(choices[0].id);else toast('その方向に道はありません。地図の地点を選んでみよう。');}
function plannerModal(){openModal('わたしたちの見学プラン',`<h3>寄り道にも、理由をつけよう。</h3><p>必須ポイントのほかに、班で調べたい場所を追加できます。並び順は相談して決めよう。</p><div class="route-list">${state.plan.map((id,i)=>`<div><b>${i+1}</b><span>${esc(place(id).name)}</span><button class="icon-btn" data-action="planUp" data-index="${i}" aria-label="${esc(place(id).name)}を一つ前へ" ${i===0?'disabled':''}>↑</button><button class="icon-btn" data-action="planRemove" data-index="${i}" aria-label="${esc(place(id).name)}をプランから外す">×</button></div>`).join('')||'<p class="helper">まだ寄り道がありません。下から見学先を追加しよう。</p>'}</div><form data-form="addPlan"><label class="form-label">行きたい場所<select name="place">${lesson.places.filter(p=>!state.plan.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div class="modal-actions"><button class="btn primary" type="submit">${icon('plus')}見学プランに追加</button></div></form><p class="notice">順番に行く義務はありません。移動の見通しを立て直しながら、何度でもプランを変えられます。</p>`);}
function totalsModal(){openModal('班で計算したことを記録しよう',`<form data-form="totals"><div class="form-grid"><label>いまの予定時刻<input name="time" type="time" value="${state.time}" required></label><label>自分たちで合計した交通費（1人分・円）<input name="totalFare" type="number" min="0" max="100000" value="${esc(state.totalFare)}" placeholder="合計を自分たちで計算"></label><label class="span2">合計や時間の考え方<textarea name="fareReason" maxlength="3000" placeholder="切符の代金をどう合計したか、残り時間をどう考えたか…">${esc(state.fareReason||'')}</textarea></label></div><p class="tip">先生の条件：交通費の予算は1人 <b>${lesson.mission.budget}円</b>。集合時刻は <b>${lesson.mission.endTime}</b>。入場料はこの予算に含みません。</p><div class="modal-actions"><button class="btn primary" type="submit">計算を記録する</button></div></form>`);}
function teacherModal(view='settings',id=lesson.places[0].id){const m=lesson.mission,p=place(id)||lesson.places[0];openModal('先生の準備室',`<p class="helper">出発地・ゴール・問い・写真を準備し、教材HTMLまたは教材JSONを配布できます。ここでの編集はこの端末に保存されます。</p><div class="teacher-tabs">${[['settings','旅の条件'],['content','場所・写真・問い'],['share','教材を配布']].map(([key,label])=>`<button class="${view===key?'active':''}" data-action="teacherTab" data-view="${key}">${label}</button>`).join('')}</div>${view==='settings'?`<form data-form="teacherSettings"><div class="form-grid"><label class="span2">ミッションの名前<input type="text" name="title" value="${esc(lesson.title)}" maxlength="100" required></label><label>出発地点<select name="start">${placeOptions(m.start)}</select></label><label>ゴール<select name="goal">${placeOptions(m.goal)}</select></label><label>出発時刻<input name="startTime" type="time" value="${m.startTime}" required></label><label>集合時刻<input name="endTime" type="time" value="${m.endTime}" required></label><label>切符購入に必要な時間（分）<input name="ticketMinutes" type="number" min="0" max="60" value="${m.ticketMinutes}" required></label><label>1人あたりの交通費予算（円）<input name="budget" type="number" min="0" max="100000" value="${m.budget}" required></label><label class="span2" style="display:flex;gap:8px;align-items:center"><input style="width:auto" name="allowanceMode" type="checkbox" ${m.allowanceMode?'checked':''}>おこづかいモードを使う（各場所の料金は場所の編集で設定）</label><label>最初の持ち金（1人分・円）<input name="allowance" type="number" min="0" max="100000" value="${m.allowance}" required></label><label class="span2">児童に渡すミッション<textarea name="prompt" maxlength="2000" required>${esc(m.prompt)}</textarea></label><div class="span2"><div class="form-label">必須チェックポイント（順不同）</div><div class="check-grid" style="margin-top:8px">${lesson.places.map(p=>`<label><input name="checkpoints" type="checkbox" value="${p.id}" ${m.checkpoints.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</div></div><label class="span2" style="display:flex;gap:8px"><input style="width:auto" type="checkbox" name="requireNote" ${m.requireNote?'checked':''}>スタンプを押す前に、発見メモを必須にする</label></div><p class="notice">時間・運賃の答えは表示しません。設定の保存後、この端末の旅は新しい条件で最初から始まります。必要な児童記録は先に書き出してください。</p><div class="modal-actions"><button class="btn primary" type="submit">旅の条件を保存して、はじめ直す</button></div></form>`:view==='content'?`<label class="form-label">編集する場所<select id="teacher-place">${placeOptions(p.id)}</select></label><form data-form="teacherContent" data-id="${p.id}"><div class="form-grid" style="margin-top:18px"><label>場所の名前<input type="text" name="name" value="${esc(p.name)}" maxlength="80" required></label><label>見出し<input type="text" name="headline" value="${esc(p.headline||'')}" maxlength="100"></label><label class="span2">歴史・自然のエピソード<textarea name="story" maxlength="5000" required>${esc(p.story)}</textarea></label><label class="span2">児童が考える問い<textarea name="question" maxlength="1000" required>${esc(p.question)}</textarea></label><label class="span2">マナー・安全のひとこと<textarea name="tip" maxlength="1000" required>${esc(p.tip)}</textarea></label><label>学習用の拝観料・入館料（1人分・円）<input type="number" name="fee" min="0" max="100000" value="${p.fee??''}" placeholder="未設定は空欄／無料は0"></label><label>デジタルおみやげの名前<input type="text" name="itemName" maxlength="80" value="${esc(itemFor(p.id).name)}" required></label><label class="span2">おみやげに添える学びの説明<input type="text" name="itemDescription" maxlength="300" value="${esc(itemFor(p.id).description)}" required></label><label class="span2">参考資料のURL<input type="url" name="source" value="${esc(p.source)}" required></label></div><div class="modal-actions"><button type="submit" class="btn primary">文章と問いを保存</button></div></form>${p.chapters?.length?`<div class="notice">${button('teacherChapters','境内探検の項目を編集','small','data-place="'+p.id+'"')}<p class="helper">ふりがなを指定するときは<code data-no-ruby>漢字《かんじ》</code>の形で入力できます。</p></div>`:''}<h4 style="font-size:13px;margin:25px 0 8px">見学場所の写真（4枚まで）</h4><div class="photo-grid">${p.photos.map((src,i)=>`<div class="teacher-img"><img src="${src}" alt="${esc(p.name)}の写真${i+1}"><button data-action="photoRemove" data-id="${p.id}" data-index="${i}" aria-label="写真${i+1}を削除">×</button></div>`).join('')}</div><label class="btn small file-label">${icon('plus')}写真を追加<input id="photo-upload" data-id="${p.id}" type="file" accept="image/jpeg,image/png,image/webp" multiple ${p.photos.length>=4?'disabled':''}></label><p class="helper">写真は端末内で縮小して教材に含めます。文章は先に保存してください。ネット上へのアップロードは行いません。</p><details class="import-zone"><summary>新しい見学場所を追加</summary><p class="helper">追加した場所は、選んだ地点への徒歩の道でつながります。道は学習用の模式図です。</p><form data-form="addPlace"><div class="form-grid"><label>場所の名前<input type="text" name="name" maxlength="80" required></label><label>種類<select name="category">${Object.entries(cat).filter(([k])=>k!=='station').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>緯度<input type="number" name="lat" step="any" min="${KQ.bounds.south}" max="${KQ.bounds.north}" required></label><label>経度<input type="number" name="lng" step="any" min="${KQ.bounds.west}" max="${KQ.bounds.east}" required></label><label class="span2">徒歩でつなぐ場所<select name="connect">${placeOptions(p.id)}</select></label></div><div class="modal-actions"><button class="btn" type="submit">場所を追加する</button></div></form></details>`:`<h3>写真と問いを、班の冒険へ。</h3><p>教材HTMLを書き出すと、このアプリと先生の設定・写真が1つのファイルにまとまります。GitHub Pagesの <code>index.html</code> として公開できます。</p><div class="modal-actions">${button('lessonHTML',icon('download')+'配布用の教材HTML','primary')}${button('lessonJSON',icon('download')+'教材JSON','')}</div><div class="import-zone"><h4>別の教材を読み込む</h4><p class="helper">教材JSONを読み込むと条件が変わり、この端末の旅は新しく始まります。</p><label class="btn file-label">教材JSONを選ぶ<input id="lesson-import" type="file" accept=".json,application/json"></label></div><div class="notice">児童の回答や班名は教材に含めません。先生と児童の端末が自動で同期する機能はありません。児童は「旅のノート」から記録を書き出し、学校の提出方法で渡せます。</div><div class="teacher-foot">${button('journalExport','この端末の児童記録を書き出す','small')}${button('restoreLesson','標準教材に戻す','small danger')}</div>`}`,true);}
function placeOptions(selected){return lesson.places.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportHTML(){const data=JSON.stringify(lesson).replace(/</g,'\\u003c');let markup=SOURCE_TEMPLATE.replace(/<script id="lesson-data" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="lesson-data" type="application/json">'+data+'<'+ '/script>');markup=markup.replace(/<link\b[^>]*data-external-icon[^>]*>/g,'');download('kamakura-quest-lesson.html',markup,'text/html;charset=utf-8');toast('写真・先生の設定入りの教材HTMLを書き出しました。');}
function saveLesson(next,restart=false){lesson=validateLesson(next);persistLesson();stateKey='kq:journal:'+lesson.id+':'+hash(JSON.stringify(lesson));if(restart){state=newState();}else{state.lessonHash=hash(JSON.stringify(lesson));}normaliseExtras();normaliseLearning();persist();render();}
function helpModal(){openModal('探究の冒険の進め方',`<h3>調べる → 見通す → 動く → 学び直す</h3><p>① 地図の場所をタップして、エピソードと問いを読もう。<br>② 「ここへ歩いていく」で出発・到着予定時刻、移動時間と根拠を入力しよう。<br>③ 江ノ電の駅では「江ノ電」から降りる駅を選び、切符を買う時間と公式時刻表を調べよう。<br>④ 到着したら、問いへの考えや発見を記録してスタンプを押そう。<br>⑤ 旅のノートで最初の考えを調べ直し、修正してみよう。</p><div class="question"><small>答えを急がない</small><p>時間と交通費は自動で計算されません。段階的なヒントを使って、自分たちで確かめよう。</p></div><p>キャラクターは、場所を選ぶと道に沿って動きます。パソコンでは矢印キー、タブレットでは方向ボタンでも次の道を選べます。</p><p class="helper">「班の予定表」で、旅の記録から時刻入りのたたき台を作り、昼食・休憩も追加できます。Excelとスプレッドシート用CSVに書き出せます。見学するとデジタルおみやげが集まります。先生はおこづかいモードと各場所の学習用料金も設定できます。<br><br>地図と道は事前学習用です。実際の旅行では先生の指示・公式の道案内・運行情報に従ってください。実地図と外部資料には通信が必要です。端末の位置情報は使いません。</p><div class="modal-actions">${button('close','冒険マップにもどる','primary')}</div>`);}
function sourcesModal(){openModal('資料・出典',`<h3>本物の資料から、確かめよう。</h3><p>この教材のエピソードは、次の公式資料などをもとに児童向けに書き起こしています。写真は先生が追加したものを使用します。</p><ul style="font-size:12px;line-height:2.3"><li><a href="https://www.trip-kamakura.com/img_data/pdf/annaizu2025_zentai.pdf" target="_blank" rel="noopener">鎌倉市観光案内図（参考地図）</a></li><li><a href="https://education.trip-kamakura.com/" target="_blank" rel="noopener">鎌倉市観光協会「いざ、鎌倉」旅のしおり</a></li><li><a href="https://www.hachimangu.or.jp/matsuri/" target="_blank" rel="noopener">鶴岡八幡宮 公式</a></li><li><a href="https://www.kotoku-in.jp/about.html" target="_blank" rel="noopener">高徳院「鎌倉大仏と高徳院」</a></li><li><a href="https://www.hasedera.jp/about/" target="_blank" rel="noopener">長谷寺 公式</a></li><li><a href="https://www.enoden.co.jp/train/" target="_blank" rel="noopener">江ノ島電鉄 駅情報・時刻表</a></li><li><a href="https://www.enosui.com/" target="_blank" rel="noopener">新江ノ島水族館 公式</a></li><li><a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">実地図：国土地理院 地理院タイル</a></li></ul><p class="helper">デフォルメ地図は独自に作成した模式図です。参考PDFの画像は転載していません。Google Earthは外部サイトを別タブで開きます。3D地図の組み込み機能はありません。</p>`);}
const QUIZ_BANK = {"easy":[{"id":"easy-01","category":"地理","question":"日本地図で鎌倉市を探すよ。どの県を開けばいい？","choices":["神奈川県","静岡県","埼玉県","千葉県"],"answer":0,"explanation":"鎌倉市は神奈川県にあるよ。地図を広げたら、おとなりの横浜市や藤沢市も見つけてみよう。","sourceTitle":"鎌倉市「ちけい」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/sc/overview1.html"},{"id":"easy-02","category":"歴史","question":"鎌倉に幕府を開いた武士はだれ？","choices":["豊臣秀吉","源頼朝","織田信長","徳川家康"],"answer":1,"explanation":"源頼朝は、今からおよそ八百年前に鎌倉を武士の政治の中心にしたよ。","sourceTitle":"鎌倉市「れきし」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/sc/overview2.html"},{"id":"easy-03","category":"文化","question":"高徳院に着いたよ。鎌倉大仏を見上げると、どんな姿が見える？","choices":["お堂の中で横になっている","岩の壁にほってある","屋外で座っている","塔の上に立っている"],"answer":2,"explanation":"大仏は空の下に座っているよ。はじめは大きなお堂におおわれていたんだ。","sourceTitle":"高徳院「鎌倉大仏と高徳院」","sourceUrl":"https://www.kotoku-in.jp/about.html"},{"id":"easy-04","category":"自然","question":"長谷寺の山の斜面で、梅雨のころに色とりどりに咲く花は？","choices":["ツバキ","コスモス","ヒマワリ","アジサイ"],"answer":3,"explanation":"散策路の両側に、いろいろな種類のアジサイが育っているよ。山の上からは海も見えるんだ。","sourceTitle":"長谷寺「長谷寺のご紹介」","sourceUrl":"https://www.hasedera.jp/about/"},{"id":"easy-05","category":"地理","question":"鎌倉のまちの中心から海へ歩くよ。主にどの方角へ向かう？","choices":["北","東","南","西"],"answer":2,"explanation":"鎌倉の南側に海岸が続いているよ。北が上の地図なら、海はまちの下のほうに見つかるね。","sourceTitle":"鎌倉市「ちけい」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/sc/overview1.html"},{"id":"easy-06","category":"文化","question":"鶴岡八幡宮の行事「流鏑馬」で、乗り手が的をねらうとき、何に乗っている？","choices":["牛車","山車","小舟","馬"],"answer":3,"explanation":"走る馬の背から弓で矢を放つよ。乗り手は、馬を走らせながら、次々と現れる的をねらうんだ。","sourceTitle":"鎌倉市観光協会「流鏑馬」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?id=237"},{"id":"easy-07","category":"自然","question":"鎌倉の海の近くで見かける「湘南しらす」。しらすは、どの生き物の子ども？","choices":["イワシの仲間","タコの仲間","カニの仲間","エビの仲間"],"answer":0,"explanation":"小さなしらすも大きくなるよ。湘南しらすには、カタクチイワシやマイワシなどの子どもがいるんだ。","sourceTitle":"神奈川県「しらす船曳網漁業」","sourceUrl":"https://www.pref.kanagawa.jp/docs/jx3/cnt/f537650/p610231.html"},{"id":"easy-08","category":"歴史","question":"鎌倉幕府を開いた源頼朝と夫婦だったのはだれ？","choices":["卑弥呼","紫式部","清少納言","北条政子"],"answer":3,"explanation":"北条政子は北条氏の出身だよ。頼朝の一族と政子の一族は、どちらも鎌倉の歴史に登場するね。","sourceTitle":"鎌倉市「鎌倉市の歴史」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/jh/kjh211.html"},{"id":"easy-09","category":"地理","question":"鎌倉駅から江ノ電で江ノ島駅へ行きたい。鎌倉駅の時刻表では、どの行先を見る？","choices":["藤沢行き","横浜行き","大船行き","横須賀行き"],"answer":0,"explanation":"江ノ電は鎌倉駅と藤沢駅を結ぶ電車だよ。江ノ島駅はその途中にあるから、鎌倉駅では藤沢行きの時刻表を調べよう。","sourceTitle":"江ノ島電鉄「駅情報・時刻表」","sourceUrl":"https://www.enoden.co.jp/train/station/"},{"id":"easy-10","category":"自然","question":"報国寺の本堂の奥には、まっすぐな緑のくきが並ぶ庭があるよ。何が育っている？","choices":["梅","サクラ","松","竹"],"answer":3,"explanation":"竹の庭には、たくさんの竹が空に向かってのびているよ。くきにいくつもある節を目でたどってみよう。","sourceTitle":"報国寺「拝観案内」","sourceUrl":"https://houkokuji.or.jp/guide/"},{"id":"easy-11","category":"文化","question":"銭洗弁財天では、幸運を願って、わき水で何を洗う習わしがある？","choices":["茶わん","お金","草履","筆"],"answer":1,"explanation":"洞くつにわく水でお金を清める習わしがあるよ。洗ったお金が増えてもどるという言い伝えがあるんだ。","sourceTitle":"鎌倉市観光協会「銭洗水」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?id=208"},{"id":"easy-12","category":"歴史","question":"昔の鎌倉で、人や荷物が山を通りやすいように作った「切通し」は、どんな道？","choices":["海に石を積んでのばした道","木の板で湿地を渡る道","山の一部を切り下げた道","川にいかだを並べた道"],"answer":2,"explanation":"山をけずると、てっぺんまで登らずに向こう側へ行けるね。今も鎌倉には、道の両側に岩の壁が残る場所があるよ。","sourceTitle":"鎌倉市「史跡朝夷奈切通」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/asainakiritooshi.html"},{"id":"easy-13","category":"地理","question":"鎌倉駅の東口から鶴岡八幡宮のほうへ、おみやげの店が並ぶ通りを歩きたい。どこへ行く？","choices":["小町通り","大仏切通","由比ガ浜海岸","源氏山公園"],"answer":0,"explanation":"小町通りには、おみやげ屋さんや食べ物の店が並んでいるよ。地図では、若宮大路と並んでのびているのが目印だよ。","sourceTitle":"鎌倉市観光協会「小町通り」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?id=169"},{"id":"easy-14","category":"文化","question":"伝統工芸の「鎌倉彫」で、職人さんがもようをほる材料は？","choices":["ねん土","石","ガラス","木"],"answer":3,"explanation":"木に葉や花などのもようをほり、その上にうるしをぬって仕上げるよ。おぼんの表面をよく見ると、もようの起伏が見えるんだ。","sourceTitle":"鎌倉市「伝統的工芸品『鎌倉彫』」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/shoukou/kamakurabori.html"},{"id":"easy-15","category":"自然","question":"江の島の岩場で、潮が引いても岩のくぼみに海水が残っているよ。これを何と呼ぶ？","choices":["わき水","潮だまり","ため池","しずく"],"answer":1,"explanation":"潮だまりは、海の水が引いたあとにできる小さな水たまり。江の島では、こうした場所に小さな海の生き物がすんでいるよ。","sourceTitle":"新江ノ島水族館「おでかけえのすい あわたんのタイドプール広場」","sourceUrl":"https://www.enosui.com/diaryentry.php?eid=07629"},{"id":"easy-16","category":"歴史","question":"鎌倉の海辺に残る和賀江島は、昔の港のあとだよ。鎌倉時代、ここで見られたと考えられる仕事は？","choices":["お寺の屋根にかわらをのせる","山をけずって新しい道を通す","船が運んだ品物を陸におろす","馬が走る道に的を立てる"],"answer":2,"explanation":"和賀江島の港を通じて、中国とも品物をやり取りしたよ。海は、遠い土地と鎌倉をつなぐ道だったんだ。","sourceTitle":"鎌倉市「鎌倉市の歴史」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/jh/kjh211.html"},{"id":"easy-17","category":"地理","question":"砂浜に出て波を観察したい班があるよ。地図で選ぶなら、どこ？","choices":["北鎌倉駅","由比ガ浜","源氏山公園","鶴岡八幡宮"],"answer":1,"explanation":"由比ガ浜は、鎌倉の海岸にある砂浜だよ。となりには材木座の浜も続いているよ。","sourceTitle":"鎌倉市「海水浴場」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kankou/2025kaisuiyokujyo.html"},{"id":"easy-18","category":"自然","question":"源氏山公園で、満開のサクラと、赤く色づいた木々を見たい。それぞれ、いつ見に行くとよさそう？","choices":["花は春、紅葉は秋","花は秋、紅葉は春","花は夏、紅葉は冬","花は冬、紅葉は夏"],"answer":0,"explanation":"源氏山公園では春にサクラが咲き、秋には紅葉が楽しめるよ。同じ場所も、見学する季節で景色が変わるね。","sourceTitle":"鎌倉市「源氏山公園の紹介」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/koen/p_genjiyama.html"},{"id":"easy-19","category":"文化","question":"鎌倉市のマークをよく見ると、葉と花があるよ。もとになった植物は？","choices":["アジサイ","タンポポ","リンドウ","ハス"],"answer":2,"explanation":"鎌倉市のマークにはリンドウの葉と花を組み合わせた形が使われているよ。市の花もリンドウだよ。","sourceTitle":"鎌倉市「シンボル」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/sc/overview4.html"},{"id":"easy-20","category":"歴史","question":"明治時代に横須賀線が開通したころ、夏の鎌倉の海へ出かける人たちの楽しみとして広まったものは？","choices":["わかさぎ釣り","海水浴","スキー","ぶどうがり"],"answer":1,"explanation":"鉄道が通るようになると、鎌倉は海水浴や別荘のある場所として、さらに多くの人に知られるようになったよ。","sourceTitle":"鎌倉市「れきし」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/sc/overview2.html"}],"normal":[{"id":"normal-01","category":"地理","question":"小町通りを駅から鶴岡八幡宮の方へ歩きます。おおむね同じ向きにのびている道は？","choices":["朝夷奈切通","大仏切通","海岸ぞいの国道","若宮大路"],"answer":3,"explanation":"地図で小町通りと若宮大路を指でたどろう。二つの道はだいたい平行で、どちらからも八幡宮へ向かえます。","sourceTitle":"鎌倉市観光協会「小町通り」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?id=169"},{"id":"normal-02","category":"歴史","question":"今の場所に鶴岡八幡宮が移る前のお社をたどりたい。どこに行くとよい？","choices":["佐助稲荷神社","由比若宮","荏柄天神社","鎌倉宮"],"answer":1,"explanation":"由比若宮は「元八幡」とも呼ばれます。源頼朝が鎌倉に入ったとき、先祖がまつっていたお社を今の八幡宮の場所へ移しました。","sourceTitle":"鶴岡八幡宮「由比若宮例祭」","sourceUrl":"https://www.hachimangu.or.jp/matsuri/"},{"id":"normal-03","category":"文化","question":"鶴岡八幡宮の「ぼんぼり祭」。夕方、明かりを近くで見たら何を楽しめる？","choices":["絵や文字をかいた灯りが並ぶ","木の札に彫った町の地図が並ぶ","短歌をそめた大きなのぼりが並ぶ","花びらでかいた道しるべが並ぶ"],"answer":0,"explanation":"境内には、絵や文字をかいたぼんぼりが並びます。夜には明かりに作品が浮かび、同じ参道でも昼とはちがう表情を見せます。","sourceTitle":"鎌倉市観光協会「ぼんぼり祭」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?area=4&id=238"},{"id":"normal-04","category":"自然","question":"春、鎌倉市の木「ヤマザクラ」が咲くころ、枝を近くで観察しました。どのメモが花の付き方に合う？","choices":["葉が十分にしげった真夏に、花が出ていた","夏の実が熟してから、花が出ていた","若い葉と花が、いっしょに出ていた","葉がすべて落ちた直後に、花が出ていた"],"answer":2,"explanation":"ヤマザクラは若い葉が出るころに花をつけます。花の白やうすいピンクに、葉の色がまじって見えるのも見どころです。","sourceTitle":"鎌倉市「もっと知りたい！市の木 ヤマザクラ」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kids/jh/yamazakura.html"},{"id":"normal-05","category":"地理","question":"稲村ヶ崎駅から江ノ電で海ぞいを江ノ島駅の方へ進みます。次の駅はどこ？","choices":["極楽寺駅","鎌倉高校前駅","腰越駅","七里ヶ浜駅"],"answer":3,"explanation":"駅の並びは、稲村ヶ崎、七里ヶ浜、鎌倉高校前、腰越、江ノ島の順です。地図に指を置き、自分が乗る方向を確かめよう。","sourceTitle":"江ノ島電鉄「駅情報・時刻表」","sourceUrl":"https://www.enoden.co.jp/train/station/"},{"id":"normal-06","category":"歴史","question":"もし完成したころの鎌倉大仏を見上げたら、今とちがうどんな姿が見られた？","choices":["青いタイルを並べた姿","白いしっくいでおおった姿","全身に金箔をはった姿","朱色の漆で仕上げた姿"],"answer":2,"explanation":"高徳院によると、完成したころの大仏には金箔がはられていました。いま見える色から、できた当時の色も同じだったと決めつけられないね。","sourceTitle":"高徳院「鎌倉大仏の歴史」","sourceUrl":"https://www.kotoku-in.jp/history"},{"id":"normal-07","category":"文化","question":"鎌倉の畑を「七色畑」と呼ぶのは、どんな育て方にちなんでいる？","choices":["一つの畑で、いろいろな野菜を育てる","毎年七枚ずつ田んぼを畑に変える","畑一面に、一種類の花を育てる","七軒の農家が、同じ野菜だけを育てる"],"answer":0,"explanation":"一つの畑に多くの種類の野菜が並ぶ様子を表しています。鎌倉の直売所では、農家の人たちが色とりどりの野菜を売っています。","sourceTitle":"鎌倉市「鎌倉の農産物について」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/nousui/brand/brand.html"},{"id":"normal-08","category":"自然","question":"七里ヶ浜の砂に、黒いふちどりのようなしまが見えます。そこに多く集まったと考えられるのは？","choices":["細かい貝がら","塩の結晶","砂鉄","白い軽石"],"answer":2,"explanation":"七里ヶ浜では、砂鉄が集まったところが黒い模様に見えます。海を眺めたあとで足もとを見ると、別の景色が見つかるね。","sourceTitle":"鎌倉市「七里ケ浜の眺め」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keikan/100sen/sizen/04.html"},{"id":"normal-09","category":"地理","question":"片瀬海岸から江の島へ歩いて渡る班が、地図で選ぶ橋はどれ？","choices":["江の島大橋","江の島弁天橋","滑川橋","太鼓橋"],"answer":1,"explanation":"江の島弁天橋は歩行者用です。となりの江の島大橋は車が通る橋なので、計画には歩いて通る方の名前を書こう。","sourceTitle":"藤沢市観光協会「江の島周辺マップ」","sourceUrl":"https://www.fujisawa-kanko.jp/pamph/eno2018.pdf"},{"id":"normal-10","category":"歴史","question":"鎌倉文学館の建物が、まだ文学館になる前に使われていたのは、何のため？","choices":["品物を売る市場として","江ノ電の駅舎として","町の郵便局として","海を望む別荘として"],"answer":3,"explanation":"現在の建物は前田家の別荘として建てられました。その後、鎌倉市に引きつがれ、作家や作品を紹介する文学館になりました。","sourceTitle":"鎌倉市「鎌倉文学館」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keikan/ks01.html"},{"id":"normal-11","category":"文化","question":"腰越の海の幸「たたみいわし」。名前のもとになった、平たい形はどのように作る？","choices":["大きいイワシをゆで、棒でうすくのばす","しらすをすりつぶし、型に流して焼く","しらすをうすく並べて、日に干す","大きいイワシを開き、一匹ずつ干す"],"answer":2,"explanation":"小さなしらすを並べて日干しにすると、一枚の板のようになります。ゆでてほぐれたまま食べる「釜揚げしらす」と、形をくらべてみよう。","sourceTitle":"鎌倉市「鎌倉市の名産品」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/rekibun-meisan.html"},{"id":"normal-12","category":"自然","question":"新江ノ島水族館の大水槽では、マイワシの群れがいっせいに向きを変えます。ぶつからずに動く手がかりは？","choices":["群れの先頭が出す強い光","仲間の姿と、周りの水の動き","先頭の魚から届く特別なにおい","海の底にうつる群れの影だけ"],"answer":1,"explanation":"魚には、水の流れや圧力の変化を感じるしくみがあります。それと目で受け取った情報を使い、となりの魚と間を取りながら泳ぎます。","sourceTitle":"新江ノ島水族館「生き物の不思議」","sourceUrl":"https://www.enosui.com/diaryentry.php?eid=03675"},{"id":"normal-13","category":"地理","question":"稲村ヶ崎から七里ヶ浜の海岸線を眺めます。よく晴れて遠くまで見える日に、同じ景色におさまる組み合わせは？","choices":["江の島と富士山","猿島と筑波山","猿島と富士山","江の島と筑波山"],"answer":0,"explanation":"稲村ヶ崎の公園からは、七里ヶ浜の海岸線、江の島、その先の富士山を見渡せることがあります。遠くの山の見え方は天気でも変わります。","sourceTitle":"鎌倉市「七里ケ浜の眺め」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keikan/100sen/sizen/04.html"},{"id":"normal-14","category":"歴史","question":"鶴岡八幡宮の境内にある鎌倉国宝館。各地の寺や神社の宝物を集めて守るきっかけになった出来事は？","choices":["江ノ電が鎌倉まで開通した","鎌倉に文学館ができた","鎌倉の海に海水浴場ができた","関東大震災で多くの文化財が失われた"],"answer":3,"explanation":"大地震で貴重な品々が失われた経験から、災害に備えて宝物を守る場所が計画されました。守りながら、多くの人に見てもらうのも国宝館の仕事です。","sourceTitle":"鎌倉市「鎌倉国宝館について」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kokuhoukan/about-mus.html"},{"id":"normal-15","category":"文化","question":"鎌倉まつりで演じる「静の舞」。静御前が思いを寄せ、離れた場所にいる相手はだれ？","choices":["源義経","源実朝","北条時政","源頼朝"],"answer":0,"explanation":"「静の舞」は、静御前が義経をしのんで舞ったという話をもとにしています。登場人物の関係を知ると、動きや歌にこめた気持ちを想像できます。","sourceTitle":"鎌倉市観光協会「静の舞 あらすじ」","sourceUrl":"https://www.trip-kamakura.com/subsite/topics.php?id=66"},{"id":"normal-16","category":"自然","question":"鎌倉広町緑地では、ゲンジボタルとヘイケボタルの両方が確認されています。この場所に残る、二つのホタルの暮らしを支える環境は？","choices":["岩だけでおおわれた高い崖","小川や田んぼ、湿った土地","海水の池と広い砂浜","松林の中の乾いた砂地"],"answer":1,"explanation":"広町緑地には谷の水辺や田んぼが残っています。水のある場所とその周りをいっしょに守ることが、里山の生き物の暮らしにつながります。","sourceTitle":"環境省「重要里地里山 鎌倉広町緑地」","sourceUrl":"https://www.env.go.jp/nature/satoyama/14_kanagawa/no14-14.html"},{"id":"normal-17","category":"地理","question":"由比ヶ浜海岸に来た班が、地図で滑川の河口を見つけました。河口から東へ続く浜の名前は？","choices":["材木座海岸","坂ノ下海岸","七里ヶ浜","腰越海岸"],"answer":0,"explanation":"由比ヶ浜海岸と材木座海岸はひと続きに見えますが、滑川の河口を境に呼び名が変わります。河口の西側が由比ヶ浜、東側が材木座です。","sourceTitle":"鎌倉市観光協会「由比ヶ浜海岸」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?area=6&genre=%E8%A6%B3%E3%82%8B&id=84"},{"id":"normal-18","category":"歴史","question":"明治時代、江ノ電で最初に開通したのは、今の駅名でいうとどの区間？","choices":["江ノ島から七里ヶ浜まで","長谷から稲村ヶ崎まで","鎌倉から長谷まで","藤沢から江ノ島まで"],"answer":3,"explanation":"最初に走ったのは明治時代の1902年。区間は藤沢から、当時「片瀬」と呼ばれた今の江ノ島駅まででした。","sourceTitle":"江ノ島電鉄「沿革」","sourceUrl":"https://www.enoden.co.jp/corporate/company/history/"},{"id":"normal-19","category":"文化","question":"鎌倉花火大会で知られる「水中花火」を浜から見ています。どの景色が特徴？","choices":["海の底だけを照らす光","海面から半円に広がる光","沖の灯台のまわりを回る光","岩の形にそって流れ落ちる光"],"answer":1,"explanation":"水中花火は、海面で花が半分開いたような形に見えます。浜から見た人の絵をかくなら、海と空の境目をどこに引くか考えてみよう。","sourceTitle":"鎌倉市観光協会「水中花火の魅力」","sourceUrl":"https://www.trip-kamakura.com/subsite/topics.php?id=75"},{"id":"normal-20","category":"自然","question":"鎌倉の浜にも記録のあるハマヒルガオ。砂浜で見つけたとき、花から茎を目でたどると、どうのびている？","choices":["一本の太い幹から、枝が空へ広がる","地面をはなれて、水面にうかぶ","砂の上をはうように、横にのびる","砂からまっすぐ立って、太い竹になる"],"answer":2,"explanation":"ハマヒルガオは、茎を砂の上に広げます。うすいピンク色の花を見つけたら、花だけでなく、となりの葉へ続く茎も見てみよう。","sourceTitle":"国営ひたち海浜公園「ハマヒルガオ」","sourceUrl":"https://www.hitachikaihin.jp/flower-plant/flower/hamahirugao.html"}],"hard":[{"id":"hard-01","category":"地理","question":"材木座の沖に石を積み、和賀江嶋という港を築いた。ここで船を使う人を困らせていたのは？","choices":["浅い浜に風や波が当たり、着けた船が流されること","砂の岬が入り江を閉じ、海への出口がなくなること","河口にできた大きな滝が、船の行く手をふさぐこと","海が深すぎて、岸のすぐ近くまで船を寄せられないこと"],"answer":0,"explanation":"材木座は遠くまで浅い海が続く浜です。船が波に流されたため、石を積んだ港が築かれました。潮が引くと石が姿を現します。","sourceTitle":"鎌倉市「和賀江嶋」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keikan/100sen/rekisi/30.html"},{"id":"hard-02","category":"地理","question":"中世の商人が、港町の六浦から鎌倉へ塩を運ぶ。六浦と鎌倉を直接結んだ道は？","choices":["極楽寺切通","朝夷奈切通","仮粧坂切通","大仏切通"],"answer":1,"explanation":"今の横浜市金沢区にある六浦は、貿易の港で、塩を作る土地でもありました。海で集めた荷を朝夷奈切通から山の向こうへ運べました。","sourceTitle":"文化庁・日本遺産「朝夷奈切通」","sourceUrl":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/1884/"},{"id":"hard-03","category":"歴史","question":"名越切通の近くには、大切岸という高い崖がある。発掘調査で分かった、この崖の形ができた理由は？","choices":["池の水をためるため、土を高く盛り上げた","板のような形の石を次々と切り出した","城を囲むため、平らな石を上まで積んだ","川が大きく曲がり、水が岸を深く削った"],"answer":1,"explanation":"城の壁のように見えますが、調査で石切り場だったと分かりました。鎌倉のまちでは切った石が井戸のわくや水路のふちなどに使われました。","sourceTitle":"逗子市「国指定史跡 名越切通」","sourceUrl":"https://www.city.zushi.kanagawa.jp/shiminkatsudo/bunkazai/1004537/1004538.html"},{"id":"hard-04","category":"文化","question":"建長寺の境内模型を作ろう。山門・仏殿・法堂は地形に対してどう並べたらよい？","choices":["大きな池を囲むように、三角形に置く","谷を取り囲む尾根の上に、一つずつ置く","谷を横切る向きに、三つを横に並べる","細長い谷の中心に沿って、一列に並べる"],"answer":3,"explanation":"建長寺は南に開く谷を利用した禅寺です。山門から先を目でたどると、仏殿や法堂などが谷の奥へ並ぶ様子を確かめられます。","sourceTitle":"鎌倉市「歴史的風致維持向上計画」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/fuuchi/documents/kamakura_rekimachiplan_2-1.pdf"},{"id":"hard-05","category":"歴史","question":"永福寺跡で今見える池の底は、鎌倉時代の池底より約30センチ高い。復元するとき、なぜ底を高くした？","choices":["池をお堂の屋根と同じ高さにするため","昔より水を深くして舟を浮かべるため","当時の池の位置が分からなかったため","下に残る本物の池底を守るため"],"answer":3,"explanation":"本物の池底は土の下に守られ、その上に池が再現されています。建物の土台も元の場所に土を盛って復元しました。見えている景色の下にも遺跡があります。","sourceTitle":"鎌倉市「国指定史跡 永福寺跡」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/documents/hp-newpanphmap.pdf"},{"id":"hard-06","category":"文化","question":"旧華頂宮邸は、ヨーロッパの民家に見られる「ハーフティンバー」様式の洋館。外から見て確かめられる特徴は？","choices":["細い板をうろこのように重ねて外壁を覆う","三角形のれんがだけで、屋根と外壁を組む","柱や横に渡したはりが、外壁の表に見える","丸太を横に積み重ね、そのまま壁にする"],"answer":2,"explanation":"旧華頂宮邸の外壁には、柱やはりの線が表れています。窓や屋根だけでなく、壁に目を向けると、鎌倉に伝わった建築様式が見えてきます。","sourceTitle":"文化庁・日本遺産「旧華頂宮邸」","sourceUrl":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/1889/"},{"id":"hard-07","category":"文化","question":"鎌倉五山の一つ、浄智寺。石段の先に立つ山門は、通り道の上にもう一つ役割を持つ。その役割は？","choices":["茶をたてて客を迎える部屋","鐘をつるして鳴らす場所","お経を納める回転式の書棚","井戸からくんだ水をためる水槽"],"answer":1,"explanation":"山門の上の階が鐘楼になっていて、そこに鐘がつるされています。門をくぐる前に上を見てみると、建物の二つの役割に気づけます。","sourceTitle":"鎌倉市芸術文化振興財団「浄智寺」","sourceUrl":"https://www.kamakura-arts.or.jp/kamakuraart/event/te02/?a=course"},{"id":"hard-08","category":"歴史","question":"円覚寺には鎌倉時代からの歴史がある。今の国宝・舎利殿がここに立つまでに何があった？","choices":["海辺にあった米蔵を、材料にして建て直した","当初の石造りの舎利殿に、木の壁を重ねて覆った","先に今の舎利殿が建ち、後からその周囲に寺ができた","寺が火事にあい、別の寺の仏殿を移して使った"],"answer":3,"explanation":"現在の舎利殿には、太平寺という尼寺の仏殿が移されました。寺が開かれた時代と、目の前の建物の来歴を分けて考えると、景色が変わります。","sourceTitle":"文化庁・文化遺産オンライン「円覚寺舎利殿」","sourceUrl":"https://online.bunka.go.jp/heritages/detail/188443"},{"id":"hard-09","category":"文化","question":"長谷寺の経蔵には「輪蔵」という回る書棚がある。これを一周回すことには、どんな意味があると伝わる？","choices":["収められたすべてのお経を読んだのと同じ功徳を得る","一周した時間を測り、次の鐘を鳴らす時刻を決める","書棚の正面を、その日の夕日の方向に合わせる","毎日少しずつ回して、お経を読む順番を知らせる"],"answer":0,"explanation":"輪蔵にはたくさんのお経が収められています。その書棚を一回転させることに、お経をすべて読んだのと同じ信仰上の意味があると伝わります。","sourceTitle":"鎌倉長谷寺「長谷寺のご紹介」","sourceUrl":"https://www.hasedera.jp/about/"},{"id":"hard-10","category":"文化","question":"鎌倉大仏の体の内側には、段と段の継ぎ目がある。大きな仏像をどうやって作った跡？","choices":["型を少しずつ高くし、溶かした銅を段ごとに流した","銅の大きなかたまりを削り、最後に中をくりぬいた","薄い銅の板を木の骨組みにくぎで打ちつけた","一度に作った像を水平に切り分けて運び、組み直した"],"answer":0,"explanation":"職人は内側と外側の型のすき間に銅を流し、次の段へ進みました。体だけでも大きく七段階に分けて作り、つなぎ方も体の部分ごとに工夫しました。","sourceTitle":"高徳院「鋳造法」","sourceUrl":"https://www.kotoku-in.jp/casting.html"},{"id":"hard-11","category":"文化","question":"お盆や器に使われる鎌倉彫。その始まりをたどると、どんな人の道具づくりに行き着く？","choices":["船大工が舟の底に板を張る仕事","瓦職人が屋根の先の瓦を焼く仕事","鍛冶職人がよろいの金具を作る仕事","仏師が寺で使う仏具を作る仕事"],"answer":3,"explanation":"仏像などを作る仏師が、仏具に施した仕事にさかのぼります。木に模様を彫り、上から漆を塗る技は、今の暮らしの道具にも続いています。","sourceTitle":"鎌倉市「伝統的工芸品『鎌倉彫』」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/shoukou/kamakurabori.html"},{"id":"hard-12","category":"歴史","question":"若宮大路の近くで、割れた中国製の皿やわんがまとまって見つかった。使った傷がほとんどない。調査した人はどう考えた？","choices":["ごちそうの席で毎日使い、すり切れた器を捨てたらしい","井戸の底に並べ、飲み水をこすために使ったらしい","運ばれてきた器から破損品を分け、使う前に捨てたらしい","まちの窯で新しく焼き、出来具合を確かめたらしい"],"answer":2,"explanation":"手がかりは、欠けていることと、使い込んだ傷がないことの組み合わせです。鎌倉市の調査では、届いた品から壊れた器を選り分けた可能性が考えられています。","sourceTitle":"鎌倉市「若宮大路周辺遺跡群出土の貿易陶磁器」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/kisya/data/2025/documents/reiwa6nendoshinkishiteibunkazai.pdf"},{"id":"hard-13","category":"歴史","question":"御成小学校の近くの今小路西遺跡で、武士の屋敷の境目を地図に記す。境目を見つける手がかりはどれ？","choices":["井戸の底に落ちていた石の形","遠くに見える山頂の高さの違い","屋敷から出たおわん一つ一つの色","建物の集まりを区切る道路や溝、堀の跡"],"answer":3,"explanation":"発掘すると、道路や溝、堀に区切られた土地に大きな建物が並んでいました。建物や井戸の位置を図にすると、屋敷を上から見た姿が浮かびます。","sourceTitle":"鎌倉市「今小路西遺跡」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/documents/maibun12.pdf"},{"id":"hard-14","category":"地理","question":"七里ヶ浜の砂浜を地図で両端までたどる。東の端から西の端へ、どの岬の間に広がっている？","choices":["稲村ヶ崎から小動岬まで","江の島から小動岬まで","稲村ヶ崎から江の島まで","小動岬から稲村ヶ崎まで"],"answer":0,"explanation":"七里ヶ浜の東端が稲村ヶ崎、西端が小動岬です。このように二つの岬の間におさまる砂浜は「ポケットビーチ」と呼ばれます。","sourceTitle":"神奈川県「鎌倉海岸七里ガ浜地区」","sourceUrl":"https://www.pref.kanagawa.jp/documents/73315/07.pdf"},{"id":"hard-15","category":"自然","question":"七里ヶ浜で観察した黒い砂に磁石を近づけると、一部だけが強く引き寄せられた。砂の中身として最も合うのは？","choices":["砂鉄と、ほかの色の濃い鉱物が混じっている","黒い砂はすべて木炭で、粒の長さだけが違う","黒い砂はすべて砂鉄で、白い砂だけが残った","磁石についた粒だけが貝がらで、残ったのは砂鉄だ"],"answer":0,"explanation":"平塚市博物館の観察では、黒っぽく集まった粒のうち半分ほどが砂鉄で、残りも暗い緑色や黒色の鉱物でした。色に加えて磁石への反応も手がかりになります。","sourceTitle":"平塚市博物館「鎌倉の地層と砂鉄の起源」","sourceUrl":"https://www.hirahaku.jp/kyoushitsu_circle/yagaisemi/semikako/181118/181118.html"},{"id":"hard-16","category":"自然","question":"由比ガ浜地区では、砂が集まりやすい所から運び直して浜を守っている。県の資料が示す砂の動かし方は？","choices":["砂を沖へ運び、波が届かない深い所に沈める","中央の滑川河口にたまった砂を、浜の両端へ戻す","浜の両端の砂を、中央の滑川河口に集める","浜の表面の砂を、滑川の上流にすべて移す"],"answer":1,"explanation":"由比ガ浜地区の中央には滑川が流れこみ、その河口周辺に砂がたまります。そこから浜の両端に砂を戻し、同じ海岸の中で砂を生かしています。","sourceTitle":"神奈川県「鎌倉海岸 侵食対策事業」","sourceUrl":"https://www.pref.kanagawa.jp/documents/116184/fujidoleaf15_r804.pdf"},{"id":"hard-17","category":"自然","question":"江の島沖の片瀬海底谷を水中ドローンで調べた。水族館の調査で分かった、深い海の底の姿は？","choices":["丸い石だけが積み重なり、切れ目のない壁が続く","斜面がなく、水深の同じ平らな泥の底が続く","土砂の積もった平らな所と、岩が張り出す崖が交互に続く","水深が変わっても、同じなだらかな砂の斜面が続く"],"answer":2,"explanation":"水深約100メートルから700メートルにかけて、平らな面と崖のような面が続いています。浜からは見えない海の中にも、陸の地図のような地形の違いがあります。","sourceTitle":"新江ノ島水族館「江の島沖片瀬海底谷 水中ドローン潜航調査」","sourceUrl":"https://www.enosui.com/onboardentry.php?eid=00932"},{"id":"hard-18","category":"地理","question":"鎌倉で「鎌倉湖」とも呼ばれる散在ガ池。もともと何のために作った池？","choices":["塩田で使う海水をためておくため","田畑に水を送れるように水をためるため","禅寺の前に庭の景色を作るため","海から来た船の荷を降ろすため"],"answer":1,"explanation":"今は森の中にある池ですが、地域の農業に使う水をためるために作られました。水辺の景色には、人の暮らしが作ったものもあります。","sourceTitle":"鎌倉市「散在ガ池森林公園の紹介」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/koen/p_sazagaike.html"},{"id":"hard-19","category":"文化","question":"建長寺とゆかりの深い「けんちん汁」の名前を紹介する。由来を調べた班の説明として、資料に合うのは？","choices":["「けんちん」とは器の名前で、汁が入った木のわんを指した","鎌倉で採れる野菜「けんちん」が、そのまま料理名になった","建長寺の汁に結びつける説と、中国の料理名に結びつける説がある","建長寺の鐘が鳴る音を写した言葉だと、一つの説に決まっている"],"answer":2,"explanation":"農林水産省は、建長寺で作る汁から来たという説と、中国の精進料理の名に由来する説を紹介しています。由来を話すときには、複数の説があることも伝えられます。","sourceTitle":"農林水産省「うちの郷土料理・けんちん汁」","sourceUrl":"https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/35_1_kanagawa.html"},{"id":"hard-20","category":"歴史","question":"昭和20年、川端康成ら鎌倉の作家たちが開いた「鎌倉文庫」。開いたばかりのころ、どんな場所だった？","choices":["作家を目指す人が泊まりこみ、文章を習う学校","昔の原稿だけを集め、ガラスごしに見せる博物館","作家がそれぞれ本を持ち寄り、人に貸す店","活字を鋳造して全国の新聞社に送る工場"],"answer":2,"explanation":"作家たちは自分の蔵書を持ち寄って貸本屋を開き、店番もしました。「文庫」という名前には、人が本を手渡せる場所をまちに作った歴史があります。","sourceTitle":"関西大学「鎌倉文庫刊『ヨーロッパ』総目次」","sourceUrl":"https://kansai-u.repo.nii.ac.jp/record/22070/files/KU-1100-20220301-03.pdf"}],"expert":[{"id":"expert-01","category":"文化","question":"1186年、静御前が鶴岡八幡宮で舞ったとき、その歌を聞いた源頼朝が怒ったと伝わるのは、なぜ？","choices":["八幡宮をたたえるはずが、平泉の寺をたたえたから","義経と争った頼朝の武勇をほめる歌だったから","都で評判の歌を選び、鎌倉の景色を詠まなかったから","頼朝に追われていた義経への思いを歌ったから"],"answer":3,"explanation":"静御前は義経を慕う気持ちを、頼朝の前で歌にしたと伝わるよ。当時ここにあったのは、今の舞殿と同じ建物ではなく、若宮の回廊だったんだ。","sourceTitle":"国土交通省「舞殿（下拝殿）」","sourceUrl":"https://www.mlit.go.jp/tagengo-db/common/001557324.pdf"},{"id":"expert-02","category":"歴史","question":"永福寺跡で、源頼朝が弟の義経や平泉の武将のために建てたお堂を想像しよう。なぜ戦った相手までまつったの？","choices":["平泉へ出発する前に戦の勝利を祈るため","戦で亡くなった人びとのたましいをしずめるため","平泉をおさめる武将に領地を引き渡すため","義経を味方に迎える講和の儀式をするため"],"answer":1,"explanation":"頼朝は平泉で見たお堂にならって、鎌倉に永福寺を建てたんだ。戦が終わってから、相手を供養する場所もつくったんだね。","sourceTitle":"鎌倉市「史跡永福寺跡」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/yohukuji_cg.html"},{"id":"expert-03","category":"歴史","question":"1221年、京都の朝廷と鎌倉が対立した。君が御家人なら、『吾妻鏡』が記す北条政子の呼びかけを、どんな意味に受け取る？","choices":["頼朝から受けた恩を思い、力を合わせて幕府を守ろう","和歌の腕をみがき、京都の朝廷の役人になろう","海の向こうから来る船に備え、九州の浜に集まろう","京都から来る命令に従い、幕府に土地を返そう"],"answer":0,"explanation":"この争いを承久の乱というよ。『吾妻鏡』では、政子の言葉は安達景盛を通じて伝えられ、御家人たちは頼朝にもらった地位や収入を思い起こすんだ。","sourceTitle":"大正大学「日本史教材・北条政子の演説」","sourceUrl":"https://kokokara.tais.ac.jp/common/doc/feel/oc/Japanese_history_teaching_materials.pdf"},{"id":"expert-04","category":"文化","question":"歌人の阿仏尼は京都から鎌倉へ向かい、その旅を『十六夜日記』に書いた。幕府のある町を目指した一番の用事は？","choices":["夫の和歌の写本を将軍に届けて選んでもらうこと","夫の歌を石碑に刻む許しをお寺から得ること","息子が受け継ぐ土地をめぐる争いを訴えること","息子を将軍に仕える歌の先生にしてもらうこと"],"answer":2,"explanation":"家族の土地をめぐる裁きを求めて、阿仏尼は東海道を旅したよ。日記に残った旅の景色の向こうには、息子の将来を考えた母の用事があったんだ。","sourceTitle":"国文学研究資料館「十六夜日記」","sourceUrl":"https://www.nijl.ac.jp/etenji/bungakushi/contents/detail/detail03-01_008.html"},{"id":"expert-05","category":"地理","question":"江戸時代、藤沢宿から江の島に向かう道に、よく似た形の石柱が立てられた。杉山検校が寄進したと伝わるこれらの石柱は、だれの、どんな困りごとに応えた？","choices":["弁財天をお参りする人が、道を見失うこと","街道を歩く人が、隣の宿までの距離に迷うこと","荷物を運ぶ人が、馬の休む場所を見失うこと","村の人が、隣の村との土地の境に迷うこと"],"answer":0,"explanation":"旅人は今のような地図アプリを持っていなかったよ。江の島の弁財天を信仰していた杉山検校が、参詣の人を島へ導くために贈った道しるべと伝わるよ。","sourceTitle":"藤沢市ふじさわ宿交流館「江の島弁財天道標」","sourceUrl":"https://fujisawashuku-kouryukan.com/kyutoukaido/osusume/02-osusume.html"},{"id":"expert-06","category":"歴史","question":"妙本寺の近くに墓所がある竹御所は、二代将軍・源頼家の娘だった。この人を手掛かりに、源氏の将軍家と四代将軍・九条頼経のつながりをたどると？","choices":["頼経は、頼家の娘と結婚した","頼経は、頼家の娘に育てられた養子だった","頼経は、頼家の娘の兄だった","頼経は、頼家の娘から生まれた"],"answer":0,"explanation":"四代将軍は源氏と違う姓を名乗ったけれど、その妻の父は二代将軍だったよ。人物を結ぶ線に「親子」と「夫婦」を書き分けると、名前からは見えないつながりに気づけるね。","sourceTitle":"鎌倉市観光協会「大町・材木座のゆかりの地」","sourceUrl":"https://www.trip-kamakura.com/kaiteki_kamakura/topics.php?id=9"},{"id":"expert-07","category":"自然","question":"中世の鎌倉の遺跡から、動物の骨や角が出てきた。「町の職人が道具の材料として使った」という説を、いちばん強くする発見は？","choices":["生き物の種類や大きさが違う骨が、浜の砂から出る","形を整えた製品と、加工で残った切れはしの両方が出る","いろいろな魚の骨と、割れた貝殻が一緒に出る","同じ動物の骨と、食べ物を煮る鍋のかけらが出る"],"answer":1,"explanation":"鎌倉では、骨や角でできた製品と、それを加工したあとに残る部分が見つかっているよ。食べた跡だけを探すより、材料をどう使い切ったかまで想像できるね。","sourceTitle":"鎌倉歴史文化交流館「中世鎌倉出土の骨角製品」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/rekibun/documents/02_suzuki.pdf"},{"id":"expert-08","category":"文化","question":"鎌倉国宝館に保管される薬師如来の像は寿福寺のもの。では、なぜ説明には「鶴岡八幡宮伝来」とも書かれている？","choices":["八幡宮の仏像を手本に、寿福寺が別の像を新しく作ったから","寿福寺にあった仏像が、地震のときだけ八幡宮へ預けられたから","寿福寺にあった仏像が、祭りのときだけ八幡宮を回ったから","八幡宮にあった仏像が、明治初めに寺へ移されたから"],"answer":3,"explanation":"かつて八幡宮の境内には仏像もあったんだ。神社と寺を分ける明治の政策によって、この仏像は寿福寺に移されたよ。一つの像の来歴から、町の信仰の変化が見えるね。","sourceTitle":"文化庁「銅造薬師如来坐像（鶴岡八幡宮伝来）」","sourceUrl":"https://kunishitei.bunka.go.jp/heritage/detail/201/5125"},{"id":"expert-09","category":"歴史","question":"北条義時をまつった法華堂は現存しない。発掘で見つけた建物跡がそのお堂だと考える、最も強い手掛かりは？","choices":["八幡宮からの距離が、別の寺までの距離と等しい","頼朝の墓からの方角と地形が『吾妻鏡』の記述に合う","発掘した柱の太さが、鎌倉に残るほかの堂跡と似ている","頼朝の墓と似た形の石が、同じ山のふもとにある"],"answer":1,"explanation":"2005年、頼朝の墓の東側で建物跡が見つかったよ。地面に残る証拠と昔の記録を照らし合わせて、義時の法華堂跡だと推定されているんだ。","sourceTitle":"鎌倉市「史跡法華堂跡」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/hokkedo.html"},{"id":"expert-10","category":"文化","question":"坂ノ下に、和歌を刻んだ船の形の石碑がある。デザインに託された源実朝の夢はどれ？","choices":["大きな船をつくり、海を渡って宋へ行くこと","小さな舟を集め、京都まで川をさかのぼること","船から材木をおろし、由比ガ浜に橋を架けること","船の上にお堂を建て、江の島にまつること"],"answer":0,"explanation":"実朝は三代将軍で、歌人でもあったよ。海辺の歌碑は、歌を残した実朝と、中国の宋を目指した実朝の両方を表しているんだ。","sourceTitle":"鎌倉市観光協会「実朝歌碑・坂ノ下」","sourceUrl":"https://www.trip-kamakura.com/facility/detail.php?id=223"},{"id":"expert-11","category":"自然","question":"江の島の海岸には、波が削った平らな岩場が海面より高く残っている。1923年の関東地震とのつながりを説明できるのは？","choices":["波が削った面が沈み、その上に砂が積もった","川が谷底を削り、取り残された川岸が段になった","波が削った面が、地震で持ち上がった","波が運んだ小石が積もり、段になって岸に残った"],"answer":2,"explanation":"波には岩を削る働きがあるよ。江の島では、波がつくった平らな面が地震で隆起したので、波と大地の動きの両方を読み取れるんだ。","sourceTitle":"国土地理院「海の作用による地形」","sourceUrl":"https://www.gsi.go.jp/kikaku/tenkei_umi"},{"id":"expert-12","category":"歴史","question":"鎌倉駅近くの御成小学校で「天平五年」と読める木の札と大きな建物の跡が見つかった。展示の見出しにいちばん合うのは？","choices":["北条泰時が学校を開いた場所が見つかった","頼朝が幕府を開いた年を示す札が見つかった","江戸時代の宿場の倉庫の数が分かった","頼朝が来る何百年も前に、郡の役所があった"],"answer":3,"explanation":"天平五年は733年で、奈良時代だよ。建物や倉庫の跡も合わせて調べると、鎌倉は武士が政治を始める前から地域を治める拠点だったと分かるね。","sourceTitle":"鎌倉市「中央平野部の遺跡群」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/documents/maibun1.pdf"},{"id":"expert-13","category":"地理","question":"1251年の『吾妻鏡』には、仮粧坂の上の名がほかの六つの場所と並んで登場する。当時そこを通る旅人が出会えたと考えられるのは、どんな人？","choices":["旅人全員の名を記して通行札を発行する役人","許された場所で旅人や町の人に品物を売る商人","峠を通る人に都までの馬を貸す幕府の役人","切通を歩く人に一律に通行料を求める船頭"],"answer":1,"explanation":"仮粧坂は鎌倉と外の土地を結ぶ大切な道だったよ。いまの山道に、行商の人や買い物をする人の姿を重ねると、峠の見え方が変わるね。","sourceTitle":"文化庁 日本遺産「仮粧坂」","sourceUrl":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/1885/"},{"id":"expert-14","category":"歴史","question":"二度の元寇のあと、北条時宗が開いた円覚寺で供養を行う。だれのために祈ることが、この寺の由来に合っている？","choices":["鎌倉側と海の向こうの側の両方で亡くなった人","承久の乱で亡くなった、京都側と鎌倉側の人","源氏と平氏の海の戦いで亡くなった両方の軍の人","平泉での戦いで亡くなった、源氏と奥州藤原氏の人"],"answer":0,"explanation":"戦いの後、時宗は宋から来た僧の無学祖元を迎えたよ。鎌倉側だけでなく、相手の側で命を落とした人も供養したことが寺の由来に伝わっているんだ。","sourceTitle":"文化庁 日本遺産「円覚寺」","sourceUrl":"https://japan-heritage.bunka.go.jp/ja/culturalproperties/result/1860/"},{"id":"expert-15","category":"歴史","question":"僧の忍性がいたころの極楽寺に、薬を買えない人と身寄りのない子どもが助けを求めてきた。寺でできたことの組み合わせは？","choices":["身寄りのない人を助けることと、御家人に領地を与えること","薬を分けることと、身寄りのない人の暮らしを支えること","薬を分けることと、土地の相続を裁くこと","土地の相続を裁くことと、御家人に領地を与えること"],"answer":1,"explanation":"忍性は病気の人に薬を届ける施薬院や、身寄りのない人を支える悲田院を設けたよ。寺を頼った人の目で見ると、暮らしを支える場所でもあったんだ。","sourceTitle":"鎌倉市「極楽寺」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keikan/100sen/rekisi/45.html"},{"id":"expert-16","category":"文化","question":"瑞泉寺で、庭の背後の岩肌を見た。夢窓疎石の庭づくりの工夫を、地面に残った跡から説明すると？","choices":["平らな田に土を盛って山をつくり、水路を巡らせた","遠くから石を運び、地面の上に岩山と滝を積み上げた","白い砂を敷き、岩を置いて水のない池を表した","もともとそこにある岩盤を削り、山すそに池のある庭をつくった"],"answer":3,"explanation":"夢窓疎石は禅僧で、庭づくりにもたずさわった人だよ。ここでは凝灰岩という岩に直接手を加えた跡が、庭の成り立ちを教えてくれるんだ。","sourceTitle":"文化庁 国指定文化財等データベース「瑞泉寺庭園」","sourceUrl":"https://kunishitei.bunka.go.jp/heritage/detail/401/816"},{"id":"expert-17","category":"文化","question":"鎌倉時代の手紙を調べる人が、金沢文庫に伝わるお寺の書物の「紙の裏」に注目した。なぜ裏側に昔の手紙が残ったの？","choices":["幕府が、すべての手紙をお経と同じ内容にするよう命じたから","お経を書いた紙は、必ず寺から武士の家へ手紙として送られたから","先に使った手紙の裏を、僧が仏教の教えを書き写すのに使ったから","寺の書物を返す人が、返した日の天気を裏に書く決まりだったから"],"answer":2,"explanation":"当時の紙の再利用が、思いがけず手紙を後の時代まで残したんだ。表と裏のどちらを読むかで、一枚の紙から見えてくる人びとの姿も違うよ。","sourceTitle":"神奈川県立金沢文庫「金沢文庫文書の回」","sourceUrl":"https://www.pen-kanagawa.ed.jp/kanazawabunko/kenkyu/documents/201205japanesever.pdf"},{"id":"expert-18","category":"自然","question":"鶴岡八幡宮の裏山、御谷の緑が残った理由を調べる。1960年代、市民が実際に起こした行動はどれ？","choices":["山から移されたお堂を建て直すため、修理の費用を集めた","道路の工事で失った緑を取り戻すため、苗木を買い集めた","開発の計画が出た山を守るため、署名と募金を始めた","崩れた斜面を元どおりにするため、石垣を築く人を募った"],"answer":2,"explanation":"鎌倉の緑は、そこに暮らす人が守ってきた景色でもあるよ。御谷をめぐる運動は、歴史ある町の景観を守る古都保存法が生まれるきっかけの一つになったんだ。","sourceTitle":"鎌倉市「御谷騒動・古都保存法」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/keiki/shiminnkennsyouoyatu.html"},{"id":"expert-19","category":"歴史","question":"土地をめぐる争いが増えたころ、北条泰時たちが御成敗式目をまとめた。裁く人にとって、どんな助けになった？","choices":["争いのある土地を、まず将軍の直轄地に移せた","領地争いの判断を一律に京都の朝廷へ任せられた","武家の先例や道理をもとに、判断の基準を共有できた","争う土地を家族の人数に応じて分ける割合が決まった"],"answer":2,"explanation":"似た争いなのに裁く人ごとに結果が違ったら困るよね。御成敗式目は、頼朝以来の判断の例や、当時の武士が筋道にかなうと考えた決まりをまとめたんだ。","sourceTitle":"日本大学図書館法学部分館「御成敗式目デジタルアーカイブ」","sourceUrl":"https://www.law.nihon-u.ac.jp/library/htmls-201901/about_us.html"},{"id":"expert-20","category":"文化","question":"若宮大路の近くで、昔の屋敷の跡から中国産の磁器と下駄やくしが見つかった。この発見から言えることはどこまで？","choices":["この屋敷で、幕府が輸入した器の値段を決めていた","中国の商人が、この屋敷を借りて器を売っていた","この屋敷の住人が、中国へ出向いて直接器を買った","中国で作られた器が、鎌倉の屋敷の跡まで届いていた"],"answer":3,"explanation":"発掘で分かるのは、まず何がどこにあったかだよ。器の産地は交流の手掛かりになるけれど、だれがどの道で運んだかを確かめるには、ほかの証拠も必要だね。","sourceTitle":"鎌倉市「若宮大路周辺遺跡群」","sourceUrl":"https://www.city.kamakura.kanagawa.jp/treasury/documents/maibun23.pdf"}]};
// Quiz progress is independent of the travel journal and its visit stamps.
const quizLevels = [
  { id: 'easy', label: 'やさしい', description: '場所や名前をたしかめる', icon: 'leaf' },
  { id: 'normal', label: 'ふつう', description: '地図と見どころをつなぐ', icon: 'map' },
  { id: 'hard', label: '難しい', description: '地形や建物の理由を考える', icon: 'book' },
  { id: 'expert', label: '激ムズ', description: '昔の人の立場や資料から考える', icon: 'flag' }
];
const quizMemory = new Map();
const quizVersions = new Map();
let quizStorageWarning = false;

function quizKey(level) {
  if (!quizVersions.has(level.id)) {
    quizVersions.set(level.id, hash(JSON.stringify(QUIZ_BANK[level.id])));
  }
  return 'kq:quiz:1:' + lesson.id + ':' + level.id + ':' + quizVersions.get(level.id);
}

function quizProgress(level) {
  const key = quizKey(level);
  const bank = QUIZ_BANK[level.id];
  const empty = { index: 0, picks: [] };
  let record = quizMemory.get(key);
  if (!quizStorageWarning) {
    try {
      const stored = localStorage.getItem(key);
      record = stored === null ? record : JSON.parse(stored);
    } catch { /* The in-memory round also works with storage disabled. */ }
  }
  if (!record || !Number.isInteger(record.index) ||
      record.index < 0 || record.index > bank.length || !Array.isArray(record.picks) ||
      record.picks.length < record.index || record.picks.length > bank.length ||
      record.picks.length > record.index + 1 ||
      !record.picks.every((pick, i) =>
        Number.isInteger(pick) && pick >= 0 && pick < bank[i].choices.length)) return empty;
  return record;
}

function saveQuizProgress(level, record) {
  const key = quizKey(level);
  quizMemory.set(key, record);
  try {
    localStorage.setItem(key, JSON.stringify(record));
    quizStorageWarning = false;
  } catch {
    if (!quizStorageWarning) toast('この画面では続けられます。端末に保存できませんでした。');
    quizStorageWarning = true;
  }
}

function quizButton(action, label, data = '', primary = false) {
  return button(action, label, primary ? 'primary' : '', data);
}

function showQuizView(content, focusSelector = '[data-quiz-focus]') {
  let dialog = $('#modal-root dialog.quiz-dialog');
  if (dialog) {
    dialog.querySelector('.modal-body').innerHTML = content;
  } else {
    dialog = openModal('鎌倉クイズ', content);
    dialog.classList.add('quiz-dialog');
    dialog.querySelector('.modal-head h2').id = 'quiz-dialog-title';
    dialog.setAttribute('aria-labelledby', 'quiz-dialog-title');
  }
  const target = dialog.querySelector(focusSelector);
  if (focusSelector === '.quiz-feedback') {
    target?.focus({ preventScroll: true });
    target?.scrollIntoView({ block: 'nearest' });
  } else {
    dialog.scrollTop = 0;
    target?.focus({ preventScroll: true });
  }
}

function quizPicker() {
  const cards = quizLevels.map(level => {
    const record = quizProgress(level);
    const total = QUIZ_BANK[level.id].length;
    const complete = record.index === total;
    const status = complete ? '結果を見る' : record.picks.length ? 'つづきから' : 'はじめる';
    return `<button type="button" class="quiz-level quiz-tone-${level.id}"
        data-action="quizLevel" data-level="${level.id}">
      <span class="quiz-level-head"><span class="quiz-icon">${icon(level.icon)}</span>
        <strong>${level.label}</strong></span>
      <span class="quiz-level-desc">${level.description}</span>
      <span class="quiz-level-foot"><span>${record.picks.length} / ${total} 問</span>
        <span class="quiz-level-go">${status} ${icon('arrow')}</span></span>
    </button>`;
  }).join('');
  showQuizView(`<h3 class="quiz-heading" tabindex="-1" data-quiz-focus>レベルを選ぼう</h3>
    <div class="quiz-levels">${cards}</div>
    <div class="quiz-actions">${quizButton('quizMap', 'マップへ戻る')}</div>`);
}

function quizSource(question) {
  if (!/^https:\/\//.test(question.sourceUrl)) return '';
  return `<a class="quiz-source" href="${esc(question.sourceUrl)}" target="_blank"
    rel="noopener noreferrer">資料を読む · ${esc(question.sourceTitle)} ↗</a>`;
}

function quizQuestion(level, record, showFeedback = false) {
  const bank = QUIZ_BANK[level.id];
  if (record.index === bank.length) return quizResults(level, record);
  const question = bank[record.index];
  const pick = record.picks[record.index];
  const answered = pick !== undefined;
  const right = pick === question.answer;
  const data = `data-level="${level.id}" data-question="${esc(question.id)}"`;
  const choices = question.choices.map((choice, i) => {
    const correct = answered && i === question.answer;
    const wrong = answered && i === pick && !right;
    const status = correct ? '正解' : wrong ? 'えらんだ答え' : '';
    return `<button type="button" class="quiz-choice${correct ? ' is-correct' : ''}${wrong ? ' is-picked' : ''}"
        data-action="quizAnswer" ${data} data-choice="${i}" ${answered ? 'disabled' : ''}>
      <span class="quiz-letter" aria-hidden="true">${'ABCD'[i]}</span>
      <span class="quiz-choice-text">${esc(choice)}</span>
      ${status ? `<small class="quiz-choice-status">${status}</small>` : ''}
    </button>`;
  }).join('');
  const feedback = answered ? `<section class="quiz-feedback" tabindex="-1" aria-labelledby="quiz-verdict">
      <h4 id="quiz-verdict">${right ? '正解！' : '答えをたしかめよう'}</h4>
      ${right ? '' : `<p class="quiz-solution">正解は「${esc(question.choices[question.answer])}」</p>`}
      <p>${esc(question.explanation)}</p>${quizSource(question)}
    </section>` : '';
  const next = record.index + 1 === bank.length ? '結果を見る' : '次の問題へ';
  showQuizView(`<div class="quiz-round quiz-tone-${level.id}">
    <div class="quiz-meta"><b>${icon(level.icon)} ${level.label}</b><span>${esc(question.category)}</span>
      <span class="quiz-counter">${record.index + 1} / ${bank.length} 問</span></div>
    <progress class="quiz-progress" max="${bank.length}" value="${record.picks.length}"
      aria-label="答えた問題"></progress>
    <h3 class="quiz-question" data-quiz-focus tabindex="-1">${esc(question.question)}</h3>
    <div class="quiz-choices">${choices}</div>${feedback}
    <div class="quiz-actions">
      ${quizButton('quizOpen', 'レベル選択へ')}
      ${answered ? quizButton('quizNext', next + ' ' + icon('arrow'), data, true) : ''}
    </div></div>`, showFeedback ? '.quiz-feedback' : '[data-quiz-focus]');
}

function quizResults(level, record) {
  const bank = QUIZ_BANK[level.id];
  const score = bank.filter((q, i) => record.picks[i] === q.answer).length;
  const rows = bank.map((q, i) => {
    const pick = record.picks[i], correct = pick === q.answer;
    return `<details class="quiz-review-row">
      <summary><span class="quiz-review-mark${correct ? ' is-correct' : ''}">
          ${correct ? '正解' : '見直し'}</span>
        <span>${i + 1}. ${esc(q.question)}</span></summary>
      <div class="quiz-review-body">
        ${correct ? '' : `<p>えらんだ答え　${esc(q.choices[pick])}</p>`}
        <p><b>正解　${esc(q.choices[q.answer])}</b></p>
        <p>${esc(q.explanation)}</p>${quizSource(q)}
      </div></details>`;
  }).join('');
  showQuizView(`<div class="quiz-round quiz-tone-${level.id}">
    <h3 class="quiz-heading" tabindex="-1" data-quiz-focus>${level.label} の結果</h3>
    <div class="quiz-score">${icon('flag')}<span><strong>${score}</strong> / ${bank.length} 問正解</span></div>
    <div class="quiz-actions">
      ${quizButton('quizOpen', 'レベル選択へ')}
      ${quizButton('quizRetry', 'もう一度とく', `data-level="${level.id}"`)}
      ${quizButton('quizMap', 'マップへ戻る', '', true)}
    </div>
    <h4 class="quiz-review-title">答えをふり返る</h4>
    <div class="quiz-review">${rows}</div></div>`);
}

function handleQuizAction(action, control) {
  if (action === 'quizOpen') {
    quizPicker();
    return true;
  }
  if (action === 'quizMap') {
    closeModal();
    if (tab !== 'explore') {
      tab = 'explore';
      render();
      document.querySelector('[data-action="quizOpen"]')?.focus();
    }
    return true;
  }
  if (!['quizLevel', 'quizAnswer', 'quizNext', 'quizRetry'].includes(action)) return false;
  const level = quizLevels.find(item => item.id === control.dataset.level);
  if (!level) return true;
  let record = quizProgress(level);
  const bank = QUIZ_BANK[level.id];
  const question = bank[record.index];
  let focusFeedback = false;
  if (action === 'quizRetry' && record.index === bank.length) {
    record = { index: 0, picks: [] };
    saveQuizProgress(level, record);
  }
  if (question && question.id === control.dataset.question) {
    if (action === 'quizAnswer' && record.picks.length === record.index) {
      const pick = Number(control.dataset.choice);
      if (Number.isInteger(pick) && pick >= 0 && pick < question.choices.length) {
        record.picks.push(pick);
        saveQuizProgress(level, record);
        focusFeedback = true;
      }
    } else if (action === 'quizNext' && record.picks.length > record.index) {
      record.index++;
      saveQuizProgress(level, record);
    }
  }
  quizQuestion(level, record, focusFeedback);
  return true;
}

function normaliseLearning(){state.learning=state.learning||{};}
function validLearning(s){if(s.learning===undefined)return true;if(!s.learning||typeof s.learning!=='object'||Array.isArray(s.learning))return false;for(const [pid,entries]of Object.entries(s.learning)){const p=place(pid);if(!p||!entries||typeof entries!=='object'||Array.isArray(entries))return false;for(const [cid,v]of Object.entries(entries)){if(!(p.chapters||[]).some(c=>c.id===cid)||!v||typeof v.done!=='boolean'||typeof v.note!=='string'||v.note.length>3000)return false;}}return true;}
function learningOverview(p){if(!p.chapters?.length)return '';const progress=KQ.chapterProgress(lesson,state,p.id);return `<section class="learning-board" aria-label="境内探検の学習進捗"><div class="learning-head"><div><div class="eyebrow">ひとつずつ、発見しよう</div><h3>境内探検の見学ポイント</h3></div><strong id="learning-percent">${progress.percent}%</strong></div><div class="progress learning-progress" role="progressbar" aria-label="境内探検の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><span style="width:${progress.percent}%"></span></div><p class="helper">${progress.done} / ${progress.total} 項目を学習しました。見出しを開き、学習を終えたらチェックしよう。</p><ol class="learning-list">${p.chapters.map((c,i)=>{const done=!!state.learning?.[p.id]?.[c.id]?.done;return `<li><button type="button" class="chapter-link ${done?'learned':''}" data-action="chapterOpen" data-place="${p.id}" data-chapter="${c.id}"><span class="chapter-number">${done?icon('check'):i+1}</span><span class="chapter-label"><b>${esc(c.title)}</b><small>${esc(c.location)}</small></span><span class="chapter-status">${done?'学習ずみ':'開く'}</span></button></li>`;}).join('')}</ol><div class="learning-finish ${progress.complete?'ready':''}">${progress.complete?'<b>100％！ すべての項目を学習しました。</b>':'すべての項目を学習すると、見学終了スタンプを押せます。'}${state.position===p.id?button('visitForm',progress.complete?'見学終了スタンプへ進む':'見学記録の場所を確認','small','data-place="'+p.id+'"'):''}</div></section>`;}
function chapterModal(pid,cid){const p=place(pid),chapter=p?.chapters?.find(c=>c.id===cid);if(!chapter)return;normaliseLearning();const record=state.learning[pid]?.[cid];openModal(chapter.title,`<div class="chapter-context"><span class="tag">${esc(p.name)}</span><span class="tag orange">${esc(chapter.kind||'見学の手がかり')}</span></div><p class="chapter-location">${icon('pin')}${esc(chapter.location)}</p><h3>${esc(chapter.title)}</h3><div class="chapter-reading"><p>${esc(chapter.body)}</p>${chapter.detail?`<div class="tip"><b>史料を確かめよう</b><p>${esc(chapter.detail)}</p></div>`:''}</div><div class="question"><small>見て、考えてみよう</small><p>${esc(chapter.question)}</p></div><label class="form-label" for="chapter-note">発見したこと・考えたこと（任意）</label><textarea id="chapter-note" data-learning-note data-place="${pid}" data-chapter="${cid}" maxlength="3000" placeholder="地図や資料から気づいたことを残そう">${esc(record?.note||'')}</textarea><p class="source">資料：<a href="${esc(chapter.source)}" target="_blank" rel="noopener">公式の説明を確かめる ↗</a></p><div class="modal-actions">${button('chapterDone',icon('check')+(record?.done?'学習ずみ・見出しにもどる':'この項目を学習した'),'primary','data-place="'+pid+'" data-chapter="'+cid+'"')}${button('chapterBack','見出しにもどる','','data-place="'+pid+'"')}${record?.done?button('chapterUndo','チェックを外す','small','data-place="'+pid+'" data-chapter="'+cid+'"'):''}</div>`);}
