</style></head><body><div id="app"></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><noscript>このサイトをつかうには JavaScript をゆうこうにしてください。</noscript><script id="lesson-data" type="application/json">{"schema": "kamakura-quest/1", "id": "kamakura-demo-v1", "title": "鎌倉と江の島、発見の旅", "version": 2, "mission": {"start": "hachiman", "goal": "enosui", "checkpoints": ["daibutsu", "enoshima"], "startTime": "09:00", "endTime": "14:00", "budget": 500, "requireNote": false, "prompt": "歴史のひみつと海の自然を見つけよう。大仏と江ノ島駅を通って、水族館へ！", "ticketMinutes": 5, "allowanceMode": false, "allowance": 3000}, "places": [{"id": "hachiman", "name": "鶴岡八幡宮", "lat": 35.3261, "lng": 139.5565, "category": "history", "headline": "七つの発見で、境内探検を完成させよう", "story": "鶴岡八幡宮の境内には、池・橋・馬場・建物・木など、歴史を学ぶ手がかりがたくさんあります。見出しから一つずつ開き、読んだことや観察したことを確かめよう。七つすべてを学習すると進み具合が100％になり、見学終了スタンプを押せます。", "question": "頼朝がこの場所をまちづくりの中心に選んだ理由を、地図から考えよう。", "tip": "階段では横に広がらず、参拝している人の通り道を空けよう。", "source": "https://www.hachimangu.or.jp/matsuri/", "photos": [], "itemName": "まちづくりの巻物", "itemDescription": "武士の都の地形とまちづくりを考えた証。", "itemType": "scroll", "fee": null, "chapters": [{"id": "genji-pond", "title": "源氏池：三つの島にこめた願い", "location": "参道の東側・源氏池", "kind": "名前にこめられた意味", "body": "参道の東側にあるのが源氏池です。鶴岡八幡宮の案内では、三つの島の「三」を「産」に重ね、源氏の繁栄を願ったと説明されています。池や島の配置にも、当時の人々の思いが表れています。", "question": "池の島を数えてみよう。まちや庭の形に願いをこめるのは、どんな気持ちからだろう？", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}, {"id": "heike-pond", "title": "平家池：源氏池と比べてみよう", "location": "参道の西側・平家池", "kind": "伝えられている意味", "body": "参道の西側が平家池です。四つの島の「四」と「死」の音を重ね、平家の衰退を願ったという説明が伝わっています。源氏池と平家池を一緒に見て、源氏と平家が争った時代の人々の思いを考えてみよう。", "question": "二つの池は、参道をはさんでどのように向かい合っている？ 名前と島の数を比べてみよう。", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}, {"id": "taiko-bridge", "title": "太鼓橋：正面と横から形を見よう", "location": "三の鳥居の先・池の間", "kind": "形と位置の観察", "body": "太鼓橋は、池の間にかかる大きく反った橋です。正面から見ると、本宮へ続く参道とのつながりがわかります。横からは、橋がえがく曲線を観察できます。見学できる場所から、見る向きによる形の違いを比べよう。", "question": "太鼓橋とまっすぐな橋では、見え方や歩きやすさがどう違いそう？ 柵や通行の表示も確かめよう。", "source": "https://www.trip-kamakura.com/facility/detail.php?id=54"}, {"id": "yabusame", "title": "流鏑馬馬場：馬と弓の技を想像しよう", "location": "参道を横切る流鏑馬馬場", "kind": "武士の技と神事", "body": "流鏑馬は、走る馬に乗ったまま的に矢を射る神事です。境内には、その舞台となる長い馬場があります。馬の速さ、体のバランス、矢を射る動きを重ねて想像すると、武士に求められた技が見えてきます。", "question": "馬場の長さを地図で確かめよう。馬に乗った人や見物する人には、どんな場所が必要だろう？", "source": "https://www.hachimangu.or.jp/matsuri/"}, {"id": "pigeon-eight", "title": "本宮の楼門：「八」にかくれた鳩を探そう", "location": "大石段の上・本宮の楼門の額", "kind": "文字や飾りの観察", "body": "楼門の額にある「八幡宮」の「八」をよく見ると、二羽の鳩の形が見えてきます。鳩は、八幡さまのお使いとして大切にされてきました。文字や建物の飾りにも、神社と生き物のつながりが表れています。", "question": "二羽の鳩はどちらを向いている？ 文字として読むときと、絵として見るときの違いを話し合おう。", "source": "https://www.hachimangu.or.jp/pray/omamori.html"}, {"id": "sanetomo", "title": "大石段：実朝と公暁の事件を知ろう", "location": "本宮へ上がる大石段", "kind": "史料と伝承を分けて読む", "body": "1219年、鎌倉幕府の三代将軍・源実朝は、鶴岡八幡宮で公暁に襲われ、命を落としました。公暁は二代将軍・源頼家の子で、実朝のおいにあたります。鎌倉市の資料は、『吾妻鏡』に公暁が「石段の陰」から出てきたと記されていることを紹介しています。", "detail": "公暁が大イチョウに隠れていたという話も語られています。この話と、史料で確かめられる記述を分けて読み、どの資料に何が書かれているのかを比べよう。", "question": "実朝・頼家・公暁の関係を図にしてみよう。史料にあることと、後に伝えられた話をどう区別できる？", "source": "https://www.city.kamakura.kanagawa.jp/kouhou/kamakura/h30/t181215-7.html"}, {"id": "great-ginkgo", "title": "大イチョウ：倒れても続く命を見つけよう", "location": "大石段のそば・親銀杏と子銀杏", "kind": "今の姿と昔の写真を比べる", "body": "大イチョウは、2010年3月10日に強風で倒れました。今は、移された幹の「親銀杏」と、もとの根元から伸びたひこばえの「子銀杏」が育っています。昔の大きな木の写真と今の姿を比べ、木の命がどのようにつながっているか考えてみよう。", "question": "親銀杏と子銀杏を見分ける手がかりは？ 歴史を伝える場所を、これからどう守っていきたい？", "source": "https://www.hachimangu.or.jp/sightseeing/keidai/"}]}, {"id": "komachi", "name": "小町通り", "lat": 35.322, "lng": 139.5534, "category": "town", "headline": "観光のまちと暮らし", "story": "鎌倉駅から鶴岡八幡宮へ向かう通りの一つです。観光に来る人、お店で働く人、近くに住んでいる人。同じ道でも、使う目的はそれぞれ違います。旅を楽しむことと、まちの暮らしを大切にすることを両立させよう。", "question": "お店の人や住民の人も気持ちよく過ごせるように、班でできることは？", "tip": "食べるときはお店の案内に従い、立ち止まる場所を選ぼう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "まちの思いやりメダル", "itemDescription": "観光する人と暮らす人の気持ちを考えた証。", "itemType": "medal", "fee": null}, {"id": "kamakura", "name": "鎌倉駅", "lat": 35.319, "lng": 139.5504, "category": "station", "headline": "江ノ電の冒険はここから", "story": "江ノ電は鎌倉と藤沢を結ぶ電車です。鶴岡八幡宮のすぐ前から乗れるわけではありません。まず鎌倉駅まで歩き、乗り場や行き先を確かめて乗車します。地図の「江ノ電に乗る」から駅を選んでみよう。", "question": "乗り間違えないために、乗る前に何を確かめる？", "tip": "ホームでは白線・黄色い線の内側で待ち、降りる人を先に通そう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "はじまりのきっぷ", "itemDescription": "乗る前に駅と行き先を確かめた証。", "itemType": "train", "fee": null}, {"id": "kencho", "name": "建長寺", "lat": 35.3316, "lng": 139.5557, "category": "history", "headline": "山に囲まれたお寺", "story": "北鎌倉から鶴岡八幡宮へ向かう途中にある禅のお寺です。建物だけでなく、参道の向きや山との位置関係も観察しよう。静けさを感じながら、同じ鎌倉にある神社との違いを探してみよう。", "question": "神社とお寺の建物や入り口には、どんな違いがある？", "tip": "境内では声の大きさを考え、撮影禁止の表示を確かめよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "静けさのしおり", "itemDescription": "神社とお寺の違いを見つけた証。", "itemType": "scroll", "fee": null}, {"id": "kita", "name": "北鎌倉駅", "lat": 35.337, "lng": 139.5453, "category": "station", "headline": "山側からの入り口", "story": "北鎌倉駅の周辺にはお寺が集まっています。ここはJRの駅で、江ノ電の駅ではありません。鎌倉駅との位置関係を見て、歩いて巡るときの順番を考えよう。", "question": "北鎌倉から出発すると、どんな見学の順番にできそう？", "tip": "踏切では止まり、遮断機が下り始めたら絶対に入らない。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "山の入り口のきっぷ", "itemDescription": "北鎌倉と鎌倉の位置関係を考えた証。", "itemType": "train", "fee": null}, {"id": "meigetsu", "name": "明月院", "lat": 35.3343, "lng": 139.5514, "category": "history", "headline": "季節とお寺をつなぐ", "story": "北鎌倉のお寺を巡るコースに含まれる見学場所です。建物や庭、植物の姿は季節によって変わります。写真を見比べながら、自分たちの修学旅行の季節には何を確かめたいか考えてみよう。", "question": "季節が違う写真を比べると、何が変わり、何が変わらない？", "tip": "植物に触れたり、花を摘んだりせずに観察しよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "季節の葉っぱ", "itemDescription": "季節と見学場所の変化を考えた証。", "itemType": "leaf", "fee": null}, {"id": "hokoku", "name": "報国寺", "lat": 35.3207, "lng": 139.5693, "category": "history", "headline": "東のエリアにも発見が", "story": "鎌倉の見学先は駅の西側だけにあるのではありません。報国寺は鶴岡八幡宮から東側のエリアにあります。行きたい場所が離れているとき、見学時間と移動時間の両方から班の計画を考えよう。", "question": "東のエリアに寄るなら、他の見学先や時間をどう調整する？", "tip": "このゲームの道は学習用。実際の道順は先生の案内や公式地図で確認しよう。", "source": "https://www.kanagawa-kankou.or.jp/courses/14", "photos": [], "itemName": "寄り道の巻物", "itemDescription": "時間と見学先の選び方を考えた証。", "itemType": "scroll", "fee": null}, {"id": "yuiga", "name": "由比ガ浜", "lat": 35.3086, "lng": 139.5429, "category": "nature", "headline": "海から見る鎌倉", "story": "鎌倉は南を海に、ほかの三方を山に囲まれています。浜辺から山の方を振り返ると、地図で見た地形が想像しやすくなります。歴史を調べるときも、土地の形が大切な手がかりになります。", "question": "海と山に囲まれることには、どんな便利さや不便さがある？", "tip": "海には入らず、決められた範囲で観察。海沿いでは避難先も確認しよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "海辺の貝がら", "itemDescription": "海と山に囲まれた地形を考えた証。", "itemType": "shell", "fee": null}, {"id": "daibutsu", "name": "鎌倉大仏（高徳院）", "lat": 35.3167, "lng": 139.5357, "category": "history", "headline": "800年近く前からの問い", "story": "高徳院の大仏は青銅製で、『吾妻鏡』には1252年に造立が始まったと記されています。像の高さは約11.3メートル。作者など、まだ明らかになっていないこともあります。歴史には「わかっていること」と「調べ続けていること」があるのです。", "question": "大きな青銅の仏像をつくるには、どんな人の力や材料が必要だっただろう？", "tip": "像や文化財を守るため、現地の見学ルールに従おう。", "source": "https://www.kotoku-in.jp/about.html", "photos": [], "itemName": "青銅のメダル", "itemDescription": "大仏をつくった人々の力を想像した証。", "itemType": "medal", "fee": null}, {"id": "hasedera", "name": "長谷寺", "lat": 35.3125, "lng": 139.533, "category": "history", "headline": "お寺から海を見よう", "story": "長谷寺には十一面観音像があり、境内には相模湾や街並みを見渡せる場所があります。山の中腹にあるお寺と、海辺のまち。高い場所から地形を眺めると、歩いてきた道も違って見えるかもしれません。", "question": "高い場所から見える景色と地図を比べて、同じ場所を探そう。", "tip": "階段があるので、班の歩く速さをそろえよう。", "source": "https://www.hasedera.jp/about/", "photos": [], "itemName": "見晴らしのしおり", "itemDescription": "高い場所の景色と地図をつなげた証。", "itemType": "scroll", "fee": null}, {"id": "hase", "name": "長谷駅", "lat": 35.3113, "lng": 139.5365, "category": "station", "headline": "歴史の見学と電車をつなぐ", "story": "大仏や長谷寺を見学する際の江ノ電の最寄り駅です。見学先から駅へ戻る時間、切符を買う時間、ホームで待つ時間も、班の計画に入れておこう。時刻表を調べ、何時の電車なら乗れるか自分たちで確かめます。", "question": "出発時刻に間に合うために、見学を何時に終える？", "tip": "電車の時刻と混雑は当日に確認。この画面の時間は練習用だよ。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "長谷のきっぷ", "itemDescription": "見学と駅への移動を計画した証。", "itemType": "train", "fee": null}, {"id": "gokuraku", "name": "極楽寺駅", "lat": 35.3094, "lng": 139.5282, "category": "station", "headline": "山から海へ", "story": "江ノ電の車窓から、山側と海側で景色がどう変わるか想像してみよう。駅のまわりには生活の道があります。鉄道が、観光と地域の暮らしの両方を支えていることにも目を向けよう。", "question": "観光客と住民が同じ電車を使うとき、どんな気配りができる？", "tip": "線路や私有地に入らず、安全な場所から観察しよう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "山あいのきっぷ", "itemDescription": "地域の暮らしと鉄道を考えた証。", "itemType": "train", "fee": null}, {"id": "inamura", "name": "稲村ヶ崎駅", "lat": 35.3044, "lng": 139.5231, "category": "station", "headline": "海辺を走る電車", "story": "沿線には海が近くなる区間があります。地図で海岸の形と線路の向きを比べてみよう。道や鉄道は、平らな土地や山の位置とどんな関係があるのだろう。", "question": "線路は、海岸や山を避けるようにどこを通っている？", "tip": "海沿いの学習では、津波の避難先を先生と事前に確認しよう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "岬の貝がら", "itemDescription": "線路と海岸の関係を調べた証。", "itemType": "shell", "fee": null}, {"id": "shichiri", "name": "七里ヶ浜駅", "lat": 35.3068, "lng": 139.5102, "category": "station", "headline": "相模湾に沿って", "story": "地図で現在の場所から江の島を探してみよう。同じ海沿いでも、砂浜や岬のようすは少しずつ違います。窓から見えそうなものを予想して、実際の旅行の観察メモにつなげよう。", "question": "海岸の形が変わると、人の暮らしや道はどう変わりそう？", "tip": "車内では大声を出さず、景色は座席や通路をゆずり合って楽しもう。", "source": "https://www.enoden.co.jp/", "photos": [], "itemName": "波のしおり", "itemDescription": "海岸の形とまちを比べた証。", "itemType": "scroll", "fee": null}, {"id": "kokomae", "name": "鎌倉高校前駅", "lat": 35.3067, "lng": 139.5008, "category": "station", "headline": "写真より先に、安全を", "story": "人気の場所には多くの人が集まります。写真を撮りたい気持ちと、通る人の安全を両立させるにはどうすればよいでしょう。修学旅行は、まちの一員として行動する練習でもあります。", "question": "人が多くて通れないとき、班でどう判断する？", "tip": "車道や線路に出て写真を撮らない。通行の妨げにならないようにしよう。", "source": "https://education.trip-kamakura.com/", "photos": [], "itemName": "安全のおまもり", "itemDescription": "混雑している場所での行動を考えた証。", "itemType": "medal", "fee": null}, {"id": "koshigoe", "name": "腰越駅", "lat": 35.3085, "lng": 139.4933, "category": "station", "headline": "ま function journalHTML(){const m=lesson.mission;return `<main class="section-panel" id="journal"><div class="section-heading"><div><h2>${esc(state.team)}の旅のノート</h2><p>教材：${esc(lesson.title)} · 計算や予想は自分たちの記録です。</p></div><div class="modal-actions" style="margin-top:0">${button('journalExport',icon('download')+'記録を書き出す','small')}${button('print',icon('print')+'印刷・PDF','small')}<label class="btn small file-label">記録を読み込む<input type="file" accept=".json,application/json" id="journal-import"></label></div></div>${state.completed?'<div class="celebrate"><div class="big">✧</div><h3>見学ミッション、達成！</h3><p>集合時刻や予算にも合う計画かな？ 調べたことや、考えが変わったことを振り返ってみよう。</p></div>':''}<div class="modal-actions no-print" style="margin:0 0 15px">${button('schedule',icon('clock')+'班の予定表をつくる','small primary')}${button('collection','おみやげ図鑑','small')}${lesson.mission.allowanceMode?button('money','お金のノート','small'):''}</div><div class="journal-summary"><span>見学 <b>${Object.keys(state.visits).length}か所</b></span><span>移動の記録 <b>${state.legs.length}件</b></span><span>自分で合計した交通費 <b>${state.totalFare===''?'未計算':esc(state.totalFare)+'円'}</b></span><span>集合時刻 <b>${m.endTime}</b></span>${button('totals','計算を記録する','small subtle')}</div><h3 style="font-size:15px">移動の見通しと、学び直し</h3>${state.legs.length?state.legs.map((l,i)=>{const hints=reviewLeg(l,m.ticketMinutes);return `<article class="journal-entry"><span class="tag">${l.mode==='train'?'江ノ電':'徒歩'}</span> <small>${esc(l.depart)} → ${esc(l.arrive)} / 自分の計算 ${esc(l.duration)}分</small><h3>${esc(place(l.from).name)} → ${esc(place(l.to).name)}</h3>${l.mode==='train'?`<small>切符購入後 ${esc(l.ready)} / 選んだ電車 ${esc(l.board)}発 / 調べた運賃 ${esc(l.fare)}円</small>`:''}<p>${esc(l.evidence)}</p>${hints.length?`<div class="tip">見直すヒント：${hints.map(esc).join(' ／ ')}</div>`:''}${l.revisions.length?`<details><summary style="font-size:11px">前の考えを見る（${l.revisions.length}回見直し）</summary>${l.revisions.map(r=>`<p><small>${esc(r.depart)} → ${esc(r.arrive)} / ${esc(r.duration)}分</small><br>${esc(r.evidence)}</p>`).join('')}</details>`:''}${button('revise',icon('edit')+'調べ直して修正','small no-print','data-index="'+i+'"')}</article>`;}).join(''):'<div class="empty">まだ移動の記録がないよ。地図から行き先を選んでみよう。</div>'}<h3 style="font-size:15px;margin-top:28px">見学と発見のメモ</h3>${Object.entries(state.visits).map(([id,v])=>`<article class="journal-entry"><small>見学を終えた予定時刻 ${esc(v.time)}</small><h3>${esc(place(id).name)}</h3><p>${esc(state.notes[id]||'まだメモがありません。')}</p>${button('spot','メモを開く','small no-print','data-id="'+id+'"')}</article>`).join('')||'<p class="helper">見学を終えた場所がここに並びます。</p>'}<section class="reflection"><label for="reflection">はじめの予想と、調べてわかったことは、どう変わった？</label><textarea id="reflection" maxlength="10000" placeholder="時間の見積もり、時刻表、歴史の問い、班で相談したこと…">${esc(state.reflection)}</textarea><p class="print-only">${esc(state.reflection)}</p><p class="helper no-print">入力内容はこの端末に保存されます。提出するときは記録を書き出して先生に渡そう。</p></section><div class="no-print">${button('reset','この端末の旅をはじめ直す','small danger')}</div></main>`;}
function openModal(title,body,wide=false){closeModal();lastFocus=document.activeElement;const d=document.createElement('dialog');d.className=wide?'wide':'';d.innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button class="icon-btn" data-action="close" aria-label="閉じる">${icon('close')}</button></div><div class="modal-body">${body}</div>`;$('#modal-root').append(d);d.addEventListener('close',()=>{d.remove();lastFocus?.isConnected&&lastFocus.focus();});d.showModal();return d;}
function closeModal(){const d=$('#modal-root dialog');if(d){d.close();d.remove();}}
function spotModal(id){if(busy)return;const p=place(id),here=state.position===id,visited=!!state.visits[id];openModal(p.name,`<div class="modal-art ${p.category} ${p.chapters?.length&&!p.photos.length?'hidden':''}">${p.photos.length?`<img src="${p.photos[0]}" alt="${esc(p.name)}の見学写真">`:artSvg(p)}</div><span class="tag">${cat[p.category]}</span>${lesson.mission.checkpoints.includes(id)?' <span class="tag orange">必須チェックポイント</span>':''}<h3 style="margin-top:9px">${esc(p.headline||p.name)}</h3><p>${esc(p.story)}</p>${learningOverview(p)}${p.photos.length>1?`<div class="photo-grid">${p.photos.slice(1).map(photo=>`<img src="${photo}" alt="${esc(p.name)}の追加写真">`).join('')}</div>`:''}<div class="question"><small>考えてみよう</small><p>${esc(p.question)}</p></div><div class="tip">${esc(p.tip)}</div><p class="source">参考：<a href="${esc(p.source||'https://education.trip-kamakura.com/')}" target="_blank" rel="noopener">公式資料でくわしく調べる ↗</a></p>${here||visited?`<form data-form="visit" data-id="${id}"><label class="form-label" for="spot-note">見つけたこと・まだわからないこと${lesson.mission.requireNote?'（必須）':''}</label><textarea id="spot-note" name="note" maxlength="5000" ${lesson.mission.requireNote?'required':''} placeholder="地図や資料から考えたことを書こう">${esc(state.notes[id]||'')}</textarea>${here?`<label class="form-label" style="margin-top:13px">見学を終える予定時刻（自分たちで計算）<input name="finish" type="time" value="${esc(state.time)}" required></label>`:''}${here?paymentFields(p):''}<div class="modal-actions"><button class="btn primary" type="submit" ${!visited&&!KQ.chapterProgress(lesson,state,id).complete?'disabled aria-disabled="true"':''}>${icon('check')}${visited?'メモを保存する':'見学を終えてスタンプを押す'}</button>${here&&canTrain(id)?button('train',icon('train')+'江ノ電に乗る','small'):''}</div></form>`:`<div class="modal-actions">${button('move',icon('walk')+'ここへ歩いていく','primary','data-id="'+id+'"')}${button('addPlan',icon('plus')+'見学プランに追加','','data-id="'+id+'"')}</div><p class="helper">移動の前に、時間と根拠を自分たちで調べます。</p>`}<div class="modal-actions">${externalMapLinks(p)}</div>`);}
function externalMapLinks(p){return `<a class="btn small" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">${icon('map')}Googleマップ ↗</a><a class="btn small" href="https://earth.google.com/web/search/${encodeURIComponent(p.name)}" target="_blank" rel="noopener">${icon('globe')}Google Earth ↗</a>`;}
function inquiryForm(to,mode='walk',editIndex=null){const from=editIndex===null?state.position:state.legs[editIndex].from;const old=editIndex===null?null:state.legs[editIndex],target=place(to),train=mode==='train';if(from===to)return;const route=shortestPath(lesson,from,to,mode);if(!route){toast('この場所への道が見つかりませんでした。');return;}
openModal(editIndex===null?'調べて、移動の見通しを立てよう':'調べ直して、考えを更新しよう',`<span class="tag">${train?'江ノ電':'徒歩'}</span><h3 style="margin-top:10px;font-size:21px">${esc(place(from).name)} → ${esc(target.name)}</h3><p class="helper">答えを自動で出すことはしません。地図・資料${train?'・時刻表':''}を調べて、班で相談して入力しよう。</p>${train?`<div class="tip"><b>先生が決めた条件：切符を買うのに ${lesson.mission.ticketMinutes}分かかります。</b><br>駅に着く → 切符を買う → ホームで待つ → 乗車、の順に考えよう。</div>`:''}<form data-form="leg" data-to="${to}" data-from="${from}" data-mode="${mode}" ${editIndex===null?'':'data-index="'+editIndex+'"'}><div class="form-grid" style="margin-top:18px"><label>${train?'駅に着く予定時刻':'出発の予定時刻'}<input name="depart" type="time" value="${esc(old?.depart||state.time)}" required></label>${train?`<label>切符を買い終える時刻<input name="ready" type="time" value="${esc(old?.ready||'')}" required></label><label>調べて選んだ電車の発車時刻<input name="board" type="time" value="${esc(old?.board||'')}" required></label><label>調べた運賃（子ども1人分・円）<input name="fare" type="number" min="0" max="10000" value="${esc(old?.fare??'')}" required></label>`:''}<label>到着の予定時刻<input name="arrive" type="time" value="${esc(old?.arrive||'')}" required></label><label>${train?'切符購入・待ち時間も含む全体の':'自分たちで計算した'}移動時間（分）<input name="duration" type="number" min="0" max="1440" value="${esc(old?.duration??'')}" placeholder="自分たちで計算しよう" required></label><label class="span2">どう調べた？ どう計算した？<textarea name="evidence" maxlength="3000" required placeholder="見た資料の名前・日付・時刻表の曜日・計算や予想の根拠を書こう">${esc(old?.evidence||'')}</textarea></label></div><div class="modal-actions">${button('hint','ヒントを1つ見る','small','data-level="1" data-mode="'+mode+'"')}<a class="btn small" href="${train?'https://www.enoden.co.jp/train/':'https://www.trip-kamakura.com/img_data/pdf/annaizu2025_zentai.pdf'}" target="_blank" rel="noopener">${icon('book')}${train?'江ノ電の公式時刻表・駅情報':'公式の観光案内図'} ↗</a>${train?'<a class="btn small" href="https://www.enoden.co.jp/train/fare/" target="_blank" rel="noopener">運賃を調べる ↗</a>':''}</div><div id="inquiry-hints"></div><div id="leg-review" role="status"></div><div class="modal-actions"><button class="btn" type="button" data-action="reviewLeg">見直すポイントを確かめる</button><button class="btn primary" type="submit">${editIndex===null?'この見通しを記録して移動する':'修正して保存する'}${icon('arrow')}</button></div><p class="helper">見直しのヒントが出ても、自分たちの考えとして記録できます。調べ直した内容は、旅のノートから何度でも修正できます。</p></form>`,true);
}
function readLeg(form){const f=new FormData(form);const leg={from:form.dataset.from,to:form.dataset.to,mode:form.dataset.mode,depart:f.get('depart'),arrive:f.get('arrive'),duration:Number(f.get('duration')),evidence:String(f.get('evidence')).trim(),revisions:[]};if(leg.mode==='train'){leg.ready=f.get('ready');leg.board=f.get('board');leg.fare=Number(f.get('fare'));}return leg;}
function showReview(form){if(!form.reportValidity())return;const leg=readLeg(form),notes=reviewLeg(leg,lesson.mission.ticketMinutes);$('#leg-review').innerHTML=`<div class="${notes.length?'tip':'notice'}" style="margin-top:14px">${notes.length?notes.map(n=>'<div>・'+esc(n)+'</div>').join(''):'入力した時刻同士に大きな食い違いは見つかりませんでした。資料の読み方や道の条件も、班で確かめよう。'}</div>`;}
function trainModal(){if(busy)return;if(!canTrain(state.position)){toast('江ノ電の駅まで歩いて移動しよう。');return;}const stations=lesson.places.filter(p=>p.id!==state.position&&canTrain(p.id)&&shortestPath(lesson,state.position,p.id,'train'));openModal('江ノ電で、次のエリアへ',`<div class="modal-art">${artSvg({category:'station'})}</div><h3>${esc(place(state.position).name)}から乗車する</h3><p>降りる駅を選んだら、切符の購入時間と時刻表を確かめよう。</p><div class="tip">切符を買う時間：<b>${lesson.mission.ticketMinutes}分</b>（先生が設定した学習条件）</div><div class="train-grid">${stations.map(p=>`<button class="train-stop" data-action="railDestination" data-id="${p.id}"><span><b>${esc(p.name)}</b><small>発車・到着・運賃を自分で調べる</small></span>${icon('arrow')}</button>`).join('')}</div><p class="helper">地図では一部の途中駅を省略しています。公式時刻表では、途中駅と行き先も確かめてください。</p>`);}
async function travel(leg){const route=shortestPath(lesson,leg.from,leg.to,leg.mode);if(!route)return;busy=true;currentRoute=route.ids;closeModal();tab='explore';render();let cancelled=false;const startPosition=state.position;const player=$('#player');if(leg.mode==='train'&&player)player.innerHTML=avatarMarkup(true);const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
try{for(let i=1;i<route.ids.length;i++){const a=project(place(route.ids[i-1]).lat,place(route.ids[i-1]).lng),b=project(place(route.ids[i]).lat,place(route.ids[i]).lng);if(reduce){player?.setAttribute('transform',`translate(${b.x} ${b.y})`);continue;}await new Promise(resolve=>{const start=performance.now(),ms=leg.mode==='train'?450:600;function tick(now){const t=Math.min((now-start)/ms,1),q=t*t*(3-2*t);player?.setAttribute('transform',`translate(${a.x+(b.x-a.x)*q} ${a.y+(b.y-a.y)*q})`);if(t<1)requestAnimationFrame(tick);else resolve();}requestAnimationFrame(tick);});}
state.legs.push(leg);state.position=leg.to;state.time=leg.arrive;state.completed=false;persist();}catch{cancelled=true;state.position=startPosition;toast('移動をやり直してください。');}finally{busy=false;currentRoute=null;render();if(!cancelled)spotModal(leg.to);}}
function direction(dir){if(busy||tab!=='explore'||$('dialog'))return;const p=project(place(state.position).lat,place(state.position).lng),vector={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir];const choices=lesson.edges.filter(e=>e.mode==='walk'&&(e.a===state.position||e.b===state.position)).map(e=>{const id=e.a===state.position?e.b:e.a,v=project(place(id).lat,place(id).lng),dx=v.x-p.x,dy=v.y-p.y;return{id,score:(dx*vector[0]+dy*vector[1])/Math.hypot(dx,dy)};}).filter(c=>c.score>.25).sort((a,b)=>b.score-a.score);if(choices.length)inquiryForm(choices[0].id);else toast('その方向に道はありません。地図の地点を選んでみよう。');}
function plannerModal(){openModal('わたしたちの見学プラン',`<h3>寄り道にも、理由をつけよう。</h3><p>必須ポイントのほかに、班で調べたい場所を追加できます。並び順は相談して決めよう。</p><div class="route-list">${state.plan.map((id,i)=>`<div><b>${i+1}</b><span>${esc(place(id).name)}</span><button class="icon-btn" data-action="planUp" data-index="${i}" aria-label="${esc(place(id).name)}を一つ前へ" ${i===0?'disabled':''}>↑</button><button class="icon-btn" data-action="planRemove" data-index="${i}" aria-label="${esc(place(id).name)}をプランから外す">×</button></div>`).join('')||'<p class="helper">まだ寄り道がありません。下から見学先を追加しよう。</p>'}</div><form data-form="addPlan"><label class="form-label">行きたい場所<select name="place">${lesson.places.filter(p=>!state.plan.includes(p.id)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><div class="modal-actions"><button class="btn primary" type="submit">${icon('plus')}見学プランに追加</button></div></form><p class="notice">順番に行く義務はありません。移動の見通しを立て直しながら、何度でもプランを変えられます。</p>`);}
function totalsModal(){openModal('班で計算したことを記録しよう',`<form data-form="totals"><div class="form-grid"><label>いまの予定時刻<input name="time" type="time" value="${state.time}" required></label><label>自分たちで合計した交通費（1人分・円）<input name="totalFare" type="number" min="0" max="100000" value="${esc(state.totalFare)}" placeholder="合計を自分たちで計算"></label><label class="span2">合計や時間の考え方<textarea name="fareReason" maxlength="3000" placeholder="切符の代金をどう合計したか、残り時間をどう考えたか…">${esc(state.fareReason||'')}</textarea></label></div><p class="tip">先生の条件：交通費の予算は1人 <b>${lesson.mission.budget}円</b>。集合時刻は <b>${lesson.mission.endTime}</b>。入場料はこの予算に含みません。</p><div class="modal-actions"><button class="btn primary" type="submit">計算を記録する</button></div></form>`);}
function teacherModal(view='settings',id=lesson.places[0].id){const m=lesson.mission,p=place(id)||lesson.places[0];openModal('先生の準備室',`<p class="helper">出発地・ゴール・問い・写真を準備し、教材HTMLまたは教材JSONを配布できます。ここでの編集はこの端末に保存されます。</p><div class="teacher-tabs">${[['settings','旅の条件'],['content','場所・写真・問い'],['share','教材を配布']].map(([key,label])=>`<button class="${view===key?'active':''}" data-action="teacherTab" data-view="${key}">${label}</button>`).join('')}</div>${view==='settings'?`<form data-form="teacherSettings"><div class="form-grid"><label class="span2">ミッションの名前<input type="text" name="title" value="${esc(lesson.title)}" maxlength="100" required></label><label>出発地点<select name="start">${placeOptions(m.start)}</select></label><label>ゴール<select name="goal">${placeOptions(m.goal)}</select></label><label>出発時刻<input name="startTime" type="time" value="${m.startTime}" required></label><label>集合時刻<input name="endTime" type="time" value="${m.endTime}" required></label><label>切符購入に必要な時間（分）<input name="ticketMinutes" type="number" min="0" max="60" value="${m.ticketMinutes}" required></label><label>1人あたりの交通費予算（円）<input name="budget" type="number" min="0" max="100000" value="${m.budget}" required></label><label class="span2" style="display:flex;gap:8px;align-items:center"><input style="width:auto" name="allowanceMode" type="checkbox" ${m.allowanceMode?'checked':''}>おこづかいモードを使う（各場所の料金は場所の編集で設定）</label><label>最初の持ち金（1人分・円）<input name="allowance" type="number" min="0" max="100000" value="${m.allowance}" required></label><label class="span2">児童に渡すミッション<textarea name="prompt" maxlength="2000" required>${esc(m.prompt)}</textarea></label><div class="span2"><div class="form-label">必須チェックポイント（順不同）</div><div class="check-grid" style="margin-top:8px">${lesson.places.map(p=>`<label><input name="checkpoints" type="checkbox" value="${p.id}" ${m.checkpoints.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</div></div><label class="span2" style="display:flex;gap:8px"><input style="width:auto" type="checkbox" name="requireNote" ${m.requireNote?'checked':''}>スタンプを押す前に、発見メモを必須にする</label></div><p class="notice">時間・運賃の答えは表示しません。設定の保存後、この端末の旅は新しい条件で最初から始まります。必要な児童記録は先に書き出してください。</p><div class="modal-actions"><button class="btn primary" type="submit">旅の条件を保存して、はじめ直す</button></div></form>`:view==='content'?`<label class="form-label">編集する場所<select id="teacher-place">${placeOptions(p.id)}</select></label><form data-form="teacherContent" data-id="${p.id}"><div class="form-grid" style="margin-top:18px"><label>場所の名前<input type="text" name="name" value="${esc(p.name)}" maxlength="80" required></label><label>見出し<input type="text" name="headline" value="${esc(p.headline||'')}" maxlength="100"></label><label class="span2">歴史・自然のエピソード<textarea name="story" maxlength="5000" required>${esc(p.story)}</textarea></label><label class="span2">児童が考える問い<textarea name="question" maxlength="1000" required>${esc(p.question)}</textarea></label><label class="span2">マナー・安全のひとこと<textarea name="tip" maxlength="1000" required>${esc(p.tip)}</textarea></label><label>学習用の拝観料・入館料（1人分・円）<input type="number" name="fee" min="0" max="100000" value="${p.fee??''}" placeholder="未設定は空欄／無料は0"></label><label>デジタルおみやげの名前<input type="text" name="itemName" maxlength="80" value="${esc(itemFor(p.id).name)}" required></label><label class="span2">おみやげに添える学びの説明<input type="text" name="itemDescription" maxlength="300" value="${esc(itemFor(p.id).description)}" required></label><label class="span2">参考資料のURL<input type="url" name="source" value="${esc(p.source)}" required></label></div><div class="modal-actions"><button type="submit" class="btn primary">文章と問いを保存</button></div></form>${p.chapters?.length?`<div class="notice">${button('teacherChapters','境内探検の項目を編集','small','data-place="'+p.id+'"')}<p class="helper">ふりがなを指定するときは<code data-no-ruby>漢字《かんじ》</code>の形で入力できます。</p></div>`:''}<h4 style="font-size:13px;margin:25px 0 8px">見学場所の写真（4枚まで）</h4><div class="photo-grid">${p.photos.map((src,i)=>`<div class="teacher-img"><img src="${src}" alt="${esc(p.name)}の写真${i+1}"><button data-action="photoRemove" data-id="${p.id}" data-index="${i}" aria-label="写真${i+1}を削除">×</button></div>`).join('')}</div><label class="btn small file-label">${icon('plus')}写真を追加<input id="photo-upload" data-id="${p.id}" type="file" accept="image/jpeg,image/png,image/webp" multiple ${p.photos.length>=4?'disabled':''}></label><p class="helper">写真は端末内で縮小して教材に含めます。文章は先に保存してください。ネット上へのアップロードは行いません。</p><details class="import-zone"><summary>新しい見学場所を追加</summary><p class="helper">追加した場所は、選んだ地点への徒歩の道でつながります。道は学習用の模式図です。</p><form data-form="addPlace"><div class="form-grid"><label>場所の名前<input type="text" name="name" maxlength="80" required></label><label>種類<select name="category">${Object.entries(cat).filter(([k])=>k!=='station').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label>緯度<input type="number" name="lat" step="any" min="${KQ.bounds.south}" max="${KQ.bounds.north}" required></label><label>経度<input type="number" name="lng" step="any" min="${KQ.bounds.west}" max="${KQ.bounds.east}" required></label><label class="span2">徒歩でつなぐ場所<select name="connect">${placeOptions(p.id)}</select></label></div><div class="modal-actions"><button class="btn" type="submit">場所を追加する</button></div></form></details>`:`<h3>写真と問いを、班の冒険へ。</h3><p>教材HTMLを書き出すと、このアプリと先生の設定・写真が1つのファイルにまとまります。GitHub Pagesの <code>index.html</code> として公開できます。</p><div class="modal-actions">${button('lessonHTML',icon('download')+'配布用の教材HTML','primary')}${button('lessonJSON',icon('download')+'教材JSON','')}</div><div class="import-zone"><h4>別の教材を読み込む</h4><p class="helper">教材JSONを読み込むと条件が変わり、この端末の旅は新しく始まります。</p><label class="btn file-label">教材JSONを選ぶ<input id="lesson-import" type="file" accept=".json,application/json"></label></div><div class="notice">児童の回答や班名は教材に含めません。先生と児童の端末が自動で同期する機能はありません。児童は「旅のノート」から記録を書き出し、学校の提出方法で渡せます。</div><div class="teacher-foot">${button('journalExport','この端末の児童記録を書き出す','small')}${button('restoreLesson','標準教材に戻す','small danger')}</div>`}`,true);}
function placeOptions(selected){return lesson.places.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');}
function download(name,content,type='application/json'){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function exportHTML(){const data=JSON.stringify(lesson).replace(/</g,'\\u003c');let markup=SOURCE_TEMPLATE.replace(/<script id="lesson-data" type="application\/json">[\s\S]*?<\/script>/,()=>'<script id="lesson-data" type="application/json">'+data+'<'+ '/script>');markup=markup.replace(/<link\b[^>]*data-external-icon[^>]*>/g,'');download('kamakura-quest-lesson.html',markup,'text/html;charset=utf-8');toast('写真・先生の設定入りの教材HTMLを書き出しました。');}
function saveLesson(next,restart=false){lesson=validateLesson(next);persistLesson();stateKey='kq:journal:'+lesson.id+':'+hash(JSON.stringify(lesson));if(restart){state=newState();}else{state.lessonHash=hash(JSON.stringify(lesson));}normaliseExtras();normaliseLearning();persist();render();}
function helpModal(){openModal('探究の冒険の進め方',`<h3>調べる → 見通す → 動く → 学び直す</h3><p>① 地図の場所をタップして、エピソードと問いを読もう。<br>② 「ここへ歩いていく」で出発・到着予定時刻、移動時間と根拠を入力しよう。<br>③ 江ノ電の駅では「江ノ電」から降りる駅を選び、切符を買う時間と公式時刻表を調べよう。<br>④ 到着したら、問いへの考えや発見を記録してスタンプを押そう。<br>⑤ 旅のノートで最初の考えを調べ直し、修正してみよう。</p><div class="question"><small>答えを急がない</small><p>時間と交通費は自動で計算されません。段階的なヒントを使って、自分たちで確かめよう。</p></div><p>キャラクターは、場所を選ぶと道に沿って動きます。パソコンでは矢印キー、タブレットでは方向ボタンでも次の道を選べます。</p><p class="helper">「班の予定表」で、旅の記録から時刻入りのたたき台を作り、昼食・休憩も追加できます。Excelとスプレッドシート用CSVに書き出せます。見学するとデジタルおみやげが集まります。先生はおこづかいモードと各場所の学習用料金も設定できます。<br><br>地図と道は事前学習用です。実際の旅行では先生の指示・公式の道案内・運行情報に従ってください。実地図と外部資料には通信が必要です。端末の位置情報は使いません。</p><div class="modal-actions">${button('close','冒険マップにもどる','primary')}</div>`);}
function sourcesModal(){openModal('資料・出典',`<h3>本物の資料から、確かめよう。</h3><p>この教材のエピソードは、次の公式資料などをもとに児童向けに書き起こしています。写真は先生が追加したものを使用します。</p><ul style="font-size:12px;line-height:2.3"><li><a href="https://www.trip-kamakura.com/img_data/pdf/annaizu2025_zentai.pdf" target="_blank" rel="noopener">鎌倉市観光案内図（参考地図）</a></li><li><a href="https://education.trip-kamakura.com/" target="_blank" rel="noopener">鎌倉市観光協会「いざ、鎌倉」旅のしおり</a></li><li><a href="https://www.hachimangu.or.jp/matsuri/" target="_blank" rel="noopener">鶴岡八幡宮 公式</a></li><li><a href="https://www.kotoku-in.jp/about.html" target="_blank" rel="noopener">高徳院「鎌倉大仏と高徳院」</a></li><li><a href="https://www.hasedera.jp/about/" target="_blank" rel="noopener">長谷寺 公式</a></li><li><a href="https://www.enoden.co.jp/train/" target="_blank" rel="noopener">江ノ島電鉄 駅情報・時刻表</a></li><li><a href="https://www.enosui.com/" target="_blank" rel="noopener">新江ノ島水族館 公式</a></li><li><a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">実地図：国土地理院 地理院タイル</a></li></ul><p class="helper">デフォルメ地図は独自に作成した模式図です。参考PDFの画像は転載していません。Google Earthは外部サイトを別タブで開きます。3D地図の組み込み機能はありません。</p>`);}
function normaliseLearning(){state.learning=state.learning||{};}
function validLearning(s){if(s.learning===undefined)return true;if(!s.learning||typeof s.learning!=='object'||Array.isArray(s.learning))return false;for(const [pid,entries]of Object.entries(s.learning)){const p=place(pid);if(!p||!entries||typeof entries!=='object'||Array.isArray(entries))return false;for(const [cid,v]of Object.entries(entries)){if(!(p.chapters||[]).some(c=>c.id===cid)||!v||typeof v.done!=='boolean'||typeof v.note!=='string'||v.note.length>3000)return false;}}return true;}
function learningOverview(p){if(!p.chapters?.length)return '';const progress=KQ.chapterProgress(lesson,state,p.id);return `<section class="learning-board" aria-label="境内探検の学習進捗"><div class="learning-head"><div><div class="eyebrow">ひとつずつ、発見しよう</div><h3>境内探検の見学ポイント</h3></div><strong id="learning-percent">${progress.percent}%</strong></div><div class="progress learning-progress" role="progressbar" aria-label="境内探検の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress.percent}"><span style="width:${progress.percent}%"></span></div><p class="helper">${progress.done} / ${progress.total} 項目を学習しました。見出しを開き、学習を終えたらチェックしよう。</p><ol class="learning-list">${p.chapters.map((c,i)=>{const done=!!state.learning?.[p.id]?.[c.id]?.done;return `<li><button type="button" class="chapter-link ${done?'learned':''}" data-action="chapterOpen" data-place="${p.id}" data-chapter="${c.id}"><span class="chapter-number">${done?icon('check'):i+1}</span><span class="chapter-label"><b>${esc(c.title)}</b><small>${esc(c.location)}</small></span><span class="chapter-status">${done?'学習ずみ':'開く'}</span></button></li>`;}).join('')}</ol><div class="learning-finish ${progress.complete?'ready':''}">${progress.complete?'<b>100％！ すべての項目を学習しました。</b>':'すべての項目を学習すると、見学終了スタンプを押せます。'}${state.position===p.id?button('visitForm',progress.complete?'見学終了スタンプへ進む':'見学記録の場所を確認','small','data-place="'+p.id+'"'):''}</div></section>`;}
function chapterModal(pid,cid){const p=place(pid),chapter=p?.chapters?.find(c=>c.id===cid);if(!chapter)return;normaliseLearning();const record=state.learning[pid]?.[cid];openModal(chapter.title,`<div class="chapter-context"><span class="tag">${esc(p.name)}</span><span class="tag orange">${esc(chapter.kind||'見学の手がかり')}</span></div><p class="chapter-location">${icon('pin')}${esc(chapter.location)}</p><h3>${esc(chapter.title)}</h3><div class="chapter-reading"><p>${esc(chapter.body)}</p>${chapter.detail?`<div class="tip"><b>史料を確かめよう</b><p>${esc(chapter.detail)}</p></div>`:''}</div><div class="question"><small>見て、考えてみよう</small><p>${esc(chapter.question)}</p></div><label class="form-label" for="chapter-note">発見したこと・考えたこと（任意）</label><textarea id="chapter-note" data-learning-note data-place="${pid}" data-chapter="${cid}" maxlength="3000" placeholder="地図や資料から気づいたことを残そう">${esc(record?.note||'')}</textarea><p class="source">資料：<a href="${esc(chapter.source)}" target="_blank" rel="noopener">公式の説明を確かめる ↗</a></p><div class="modal-actions">${button('chapterDone',icon('check')+(record?.done?'学習ずみ・見出しにもどる':'この項目を学習した'),'primary','data-place="'+pid+'" data-chapter="'+cid+'"')}${button('chapterBack','見出しにもどる','','data-place="'+pid+'"')}${record?.done?button('chapterUndo','チェックを外す','small','data-place="'+pid+'" data-chapter="'+cid+'"'):''}</div>`);}
function chapterTeacherModal(pid,cid=null){const p=place(pid);if(!p?.chapters?.length)return;const c=p.chapters.find(c=>c.id===cid)||p.chapters[0];openModal('境内探検の教材を編集',`<p class="helper">学習項目の文章・問い・参照先を編集できます。漢字の読みを指定するときは<code data-no-ruby>漢字《かんじ》</code>と入力してください。</p><label class="form-label">編集する項目<select data-chapter-select data-place="${pid}">${p.chapters.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><form data-form="chapterTeacher" data-place="${pid}" data-chapter="${c.id}"><div class="form-grid" style="margin-top:16px"><label class="span2">見出し<input name="title" maxlength="160" value="${esc(c.title)}" required></label><label class="span2">境内の場所<input name="location" maxlength="200" value="${esc(c.location)}" required></label><label class="span2">学習する文章<textarea name="body" maxlength="5000" required>${esc(c.body)}</textarea></label><label class="span2">史料・伝承についての補足<textarea name="detail" maxlength="3000">${esc(c.detail||'')}</textarea></label><label class="span2">考える問い<textarea name="question" maxlength="1000" required>${esc(c.question)}</textarea></label><label class="span2">公式資料のURL<input name="source" type="url" value="${esc(c.source)}" required></label></div><div class="modal-actions"><button class="btn primary" type="submit">項目を保存</button>${button('teacherChapterBack','先生の準備室へ','','data-place="'+pid+'"')}</div></form>`,true);}
function routesModal(){const routes=lesson.routes||[];openModal('鎌倉駅から切通へ向かうルート',`<h3>昔の道と、今の道をつなごう。</h3><p>鎌倉駅の西側には、銭洗弁財天や源氏山公園、切通へ向かう道があります。山道と街の道の違いを調べ、自分たちで時間を見積もって比べよう。</p><div class="route-course-list">${routes.map(r=>`<article class="route-course"><span class="tag orange">${esc(r.terrain)}</span><h4>${esc(r.title)}</h4><p>${esc(r.intro)}</p><ol class="course-stops">${r.stops.map((id,i)=>`<li><span>${i+1}</span><button type="button" data-action="spot" data-id="${id}">${esc(place(id).name)}</button></li>`).join('')}</ol><div class="question"><small>計画を立てるときの問い</small><p>${esc(r.inquiry)}</p></div><p class="tip">${esc(r.notice)}</p><p class="source">参照：<a href="${esc(r.source)}" target="_blank" rel="noopener">公式の見学コース・地図を開く ↗</a></p>${button('routePlan',icon('map')+'この順番を見学プランにする','small primary','data-id="'+r.id+'"')}</article>`).join('')}</div><p class="helper">見学プランは、この順番に置き換わります。出発・到着時刻は児童が調べて入力します。実際の通行状況や分岐は、旅行前に先生と確かめよう。</p>`,true);}
function handleLearningAction(a,b){if(a==='chapterOpen')chapterModal(b.dataset.place,b.dataset.chapter);else if(a==='chapterBack')spotModal(b.dataset.place);else if(a==='chapterDone'||a==='chapterUndo'){const pid=b.dataset.place,cid=b.dataset.chapter,p=place(pid);if(!p?.chapters.some(c=>c.id===cid))return true;normaliseLearning();state.learning[pid]=state.learning[pid]||{};const note=$('#chapter-note')?.value||state.learning[pid][cid]?.note||'';state.learning[pid][cid]={done:a==='chapterDone',note};persist();spotModal(pid);const progress=KQ.chapterProgress(lesson,state,pid);toast(a==='chapterDone'?`学習を記録しました。${progress.done} / ${progress.total} 項目`:'チェックを外しました。');}else if(a==='visitForm'){$('dialog form[data-form="visit"]')?.scrollIntoView({behavior:'smooth',block:'center'});}else if(a==='routes')routesModal();else if(a==='routePlan'){const r=lesson.routes.find(r=>r.id===b.dataset.id);if(!r)return true;state.plan=r.stops.slice();persist();closeModal();plannerModal();toast('ルートを見学プランに入れました。時間は自分たちで調べよう。');}else if(a==='teacherChapters')chapterTeacherModal(b.dataset.place);else if(a==='teacherChapterBack')teacherModal('content',b.dataset.place);else return false;return true;}
function handleLearningSubmit(form,fd){if(form.dataset.form!=='chapterTeacher')return false;const next=JSON.parse(JSON.stringify(lesson)),p=next.places.find(p=>p.id===form.dataset.place),chapter=p?.chapters.find(c=>c.id===form.dataset.chapter);if(!chapter)throw Error('学習項目が見つかりません。');for(const key of ['title','location','body','detail','question','source'])chapter[key]=String(fd.get(key)||'').trim();saveLesson(next,false);chapterTeacherModal(p.id,chapter.id);toast('学習項目を保存しました。');return true;}
function handleLearningInput(e){const el=e.target;if(!el.hasAttribute('data-learning-note'))return false;normaliseLearning();const pid=el.dataset.place,cid=el.dataset.chapter;if(!place(pid)?.chapters.some(c=>c.id===cid))return true;state.learning[pid]=state.learning[pid]||{};state.learning[pid][cid]={done:state.learning[pid][cid]?.done||false,note:el.value};persist();return true;}
function handleLearningChange(el){if(!el.hasAttribute('data-chapter-select'))return false;chapterTeacherModal(el.dataset.place,el.value);return true;}

function validExtras(s){
 if(s.schedule!==undefined&&!KQS.validateRows(s.schedule))return false;
 for(const [key,max]of [['tripDate',10],['members',500],['scheduleNote',1000]])if(s[key]!==undefined&&(typeof s[key]!=='string'||s[key].length>max))return false;
 if(s.items!==undefined){if(!s.items||typeof s.items!=='object'||Array.isArray(s.items))return false;for(const [id,v]of Object.entries(s.items))if(!place(id)||!v||!validTime(v.time))return false;}

document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=new FormData(f);try{
if(handleLearningSubmit(f,fd)||handleExtraSubmit(f,fd))return;
if(f.dataset.form==='visit'){const id=f.dataset.id,note=String(fd.get('note')).trim();if(!state.visits[id]&&!KQ.chapterProgress(lesson,state,id).complete){toast('すべての学習項目を終えて100％にしてから、スタンプを押そう。');return;}if(lesson.mission.requireNote&&!note){toast('発見メモを書いてみよう。');return;}state.notes[id]=note;if(state.position===id){const finish=fd.get('finish');if(timeMinutes(finish)<timeMinutes(state.time)){toast('見学を終える時刻が、到着より前になっています。確かめよう。');return;}recordVisitPayment(place(id),fd);state.time=finish;state.visits[id]={time:state.time};awardItem(id);}persist();const all=lesson.mission.checkpoints.every(id=>state.visits[id]);if(id===lesson.mission.goal&&state.position===id){if(all){state.completed=true;persist();closeModal();tab='journal';render();toast('ミッション達成！自分たちの学びを振り返ろう。');}else{closeModal();render();toast('まだ見学していない必須ポイントがあるよ。地図で確かめよう。');}}else{closeModal();render();toast('発見を記録。'+itemFor(id).name+'をゲット！');}}
else if(f.dataset.form==='leg'){const leg=readLeg(f);if(!leg.evidence){toast('調べたことや計算の根拠を書こう。');return;}if(f.dataset.index!==undefined){const i=Number(f.dataset.index),old=state.legs[i];const {revisions,...snapshot}=old;leg.revisions=[...revisions,snapshot];if(leg.revisions.length>100)throw Error('この移動の修正回数が上限に達しました。');state.legs[i]=leg;persist();closeModal();tab='journal';render();toast('前の考えも残して、修正しました。');}else travel(leg);}
else if(f.dataset.form==='totals'){state.time=fd.get('time');state.totalFare=fd.get('totalFare')===''?'':Number(fd.get('totalFare'));state.fareReason=String(fd.get('fareReason'));persist();closeModal();render();toast('自分たちの計算を記録しました。');}
else if(f.dataset.form==='addPlan'){const id=fd.get('place');if(id&&!state.plan.includes(id))state.plan.push(id);persist();plannerModal();}
else if(f.dataset.form==='teacherSettings'){const next=JSON.parse(JSON.stringify(lesson));next.title=String(fd.get('title')).trim();next.version=Date.now();next.mission={start:fd.get('start'),goal:fd.get('goal'),checkpoints:fd.getAll('checkpoints'),startTime:fd.get('startTime'),endTime:fd.get('endTime'),ticketMinutes:Number(fd.get('ticketMinutes')),budget:Number(fd.get('budget')),allowanceMode:fd.has('allowanceMode'),allowance:Number(fd.get('allowance')),prompt:String(fd.get('prompt')).trim(),requireNote:fd.has('requireNote')};saveLesson(next,true);teacherModal();toast('新しい条件を保存しました。');}
else if(f.dataset.form==='teacherContent'){const next=JSON.parse(JSON.stringify(lesson)),p=next.places.find(p=>p.id===f.dataset.id);for(const key of ['name','headline','story','question','tip','source','itemName','itemDescription'])p[key]=String(fd.get(key)).trim();p.fee=fd.get('fee')===''?null:Number(fd.get('fee'));saveLesson(next,false);teacherModal('content',p.id);toast('文章と問いを保存しました。');}
else if(f.dataset.form==='addPlace'){const next=JSON.parse(JSON.stringify(lesson)),id='custom-'+Date.now().toString(36);next.places.push({id,name:String(fd.get('name')).trim(),category:fd.get('category'),lat:Number(fd.get('lat')),lng:Number(fd.get('lng')),headline:'自分たちの問いを見つけよう',story:'先生がこの場所のエピソードを入力してください。',question:'この場所で何を調べたい？',tip:'見学ルールを確かめよう。',source:'https://education.trip-kamakura.com/',photos:[],fee:null,itemName:String(fd.get('name')).trim()+'の思い出',itemDescription:'この場所で学んだ証。',itemType:'medal'});next.edges.push({a:id,b:fd.get('connect'),mode:'walk'});saveLesson(next,false);teacherModal('content',id);toast('新しい場所を追加しました。エピソードを編集できます。');}
}catch(error){toast(error.message||'保存できませんでした。入力を確かめてください。');}});
document.addEventListener('input',e=>{if(handleLearningInput(e)||handleExtraInput(e))return;if(e.target.id==='team-name'){state.team=e.target.value;persist();}else if(e.target.id==='reflection'){state.reflection=e.target.value;persist();}else if(e.target.id==='spot-search'){query=e.target.value;$('#spot-grid').innerHTML=spotCards(lesson.places.filter(p=>(filter==='all'||p.category===filter)&&(p.name+p.story).includes(query)));}});
document.addEventListener('change',async e=>{const input=e.target;try{if(handleLearningChange(input)||handleExtraChange(input))return;if(input.id==='teacher-place'){teacherModal('content',input.value);}else if(input.id==='lesson-import'){const file=input.files[0];if(!file)return;if(file.size>18000000)throw Error('教材ファイルが大きすぎます。');const next=validateLesson(JSON.parse(await file.text()));saveLesson(next,true);teacherModal('share');toast('教材を読み込みました。');}else if(input.id==='journal-import'){const file=input.files[0];if(!file)return;if(file.size>3000000)throw Error('記録ファイルが大きすぎます。');const next=JSON.parse(await file.text());if(!validJournal(next))throw Error('記録の形式が異なるか、別の教材の記録です。同じ教材を開いてください。');state=next;persist();render();toast('記録を読み込みました。');}else if(input.id==='photo-upload'){const p=place(input.dataset.id),files=[...input.files];if(p.photos.length+files.length>4)throw Error('写真は各場所4枚までです。');const results=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPEG・PNG・WebPの写真を選んでください。');if(file.size>20000000)throw Error('写真は1枚20MB以下で選んでください。');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);results.push(c.toDataURL('image/jpeg',.78));}finally{URL.revokeObjectURL(url);}}const next=JSON.parse(JSON.stringify(lesson));next.places.find(x=>x.id===p.id).photos.push(...results);saveLesson(next,false);teacherModal('content',p.id);toast('写真を追加しました。');}}catch(error){toast(error.message||'ファイルを読み込めませんでした。');input.value='';}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;if(e.target.matches('.map-point')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();spotModal(e.target.dataset.id);return;}const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d&&tab==='explore'&&!$('dialog')){e.preventDefault();direction(d);}});
let pointerStart=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#world-map')&&!e.target.closest('.map-point')&&zoom>1){pointerStart={x:e.clientX,y:e.clientY,c:{...center}};}});
document.addEventListener('pointermove',e=>{if(!pointerStart||!$('#world-map'))return;const box=$('#world-map').getBoundingClientRect(),scale=Math.min(box.width/(1200/zoom),box.height/(730/zoom));center={x:pointerStart.c.x-(e.clientX-pointerStart.x)/scale,y:pointerStart.c.y-(e.clientY-pointerStart.y)/scale};updateView();});
document.addEventListener('pointerup',()=>pointerStart=null);document.addEventListener('pointercancel',()=>pointerStart=null);
window.addEventListener('beforeunload',()=>persist());
render();
KR.install();
if(location.protocol==='file:'){document.querySelectorAll('link[data-external-icon]').forEach(link=>link.remove());}
})();
</script></body></html>
