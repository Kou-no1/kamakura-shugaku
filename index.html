function chapterTeacherModal(pid,cid=null){const p=place(pid);if(!p?.chapters?.length)return;const c=p.chapters.find(c=>c.id===cid)||p.chapters[0];openModal('境内探検の教材を編集',`<p class="helper">学習項目の文章・問い・参照先を編集できます。漢字の読みを指定するときは<code data-no-ruby>漢字《かんじ》</code>と入力してください。</p><label class="form-label">編集する項目<select data-chapter-select data-place="${pid}">${p.chapters.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label><form data-form="chapterTeacher" data-place="${pid}" data-chapter="${c.id}"><div class="form-grid" style="margin-top:16px"><label class="span2">見出し<input name="title" maxlength="160" value="${esc(c.title)}" required></label><label class="span2">境内の場所<input name="location" maxlength="200" value="${esc(c.location)}" required></label><label class="span2">学習する文章<textarea name="body" maxlength="5000" required>${esc(c.body)}</textarea></label><label class="span2">史料・伝承についての補足<textarea name="detail" maxlength="3000">${esc(c.detail||'')}</textarea></label><label class="span2">考える問い<textarea name="question" maxlength="1000" required>${esc(c.question)}</textarea></label><label class="span2">公式資料のURL<input name="source" type="url" value="${esc(c.source)}" required></label></div><div class="modal-actions"><button class="btn primary" type="submit">項目を保存</button>${button('teacherChapterBack','先生の準備室へ','','data-place="'+pid+'"')}</div></form>`,true);}
function routesModal(){const routes=lesson.routes||[];openModal('鎌倉駅から切通へ向かうルート',`<h3>昔の道と、今の道をつなごう。</h3><p>鎌倉駅の西側には、銭洗弁財天や源氏山公園、切通へ向かう道があります。山道と街の道の違いを調べ、自分たちで時間を見積もって比べよう。</p><div class="route-course-list">${routes.map(r=>`<article class="route-course"><span class="tag orange">${esc(r.terrain)}</span><h4>${esc(r.title)}</h4><p>${esc(r.intro)}</p><ol class="course-stops">${r.stops.map((id,i)=>`<li><span>${i+1}</span><button type="button" data-action="spot" data-id="${id}">${esc(place(id).name)}</button></li>`).join('')}</ol><div class="question"><small>計画を立てるときの問い</small><p>${esc(r.inquiry)}</p></div><p class="tip">${esc(r.notice)}</p><p class="source">参照：<a href="${esc(r.source)}" target="_blank" rel="noopener">公式の見学コース・地図を開く ↗</a></p>${button('routePlan',icon('map')+'この順番を見学プランにする','small primary','data-id="'+r.id+'"')}</article>`).join('')}</div><p class="helper">見学プランは、この順番に置き換わります。出発・到着時刻は児童が調べて入力します。実際の通行状況や分岐は、旅行前に先生と確かめよう。</p>`,true);}
function handleLearningAction(a,b){if(a==='chapterOpen')chapterModal(b.dataset.place,b.dataset.chapter);else if(a==='chapterBack')spotModal(b.dataset.place);else if(a==='chapterDone'||a==='chapterUndo'){const pid=b.dataset.place,cid=b.dataset.chapter,p=place(pid);if(!p?.chapters.some(c=>c.id===cid))return true;normaliseLearning();state.learning[pid]=state.learning[pid]||{};const note=$('#chapter-note')?.value||state.learning[pid][cid]?.note||'';state.learning[pid][cid]={done:a==='chapterDone',note};persist();spotModal(pid);const progress=KQ.chapterProgress(lesson,state,pid);toast(a==='chapterDone'?`学習を記録しました。${progress.done} / ${progress.total} 項目`:'チェックを外しました。');}else if(a==='visitForm'){$('dialog form[data-form="visit"]')?.scrollIntoView({behavior:'smooth',block:'center'});}else if(a==='routes')routesModal();else if(a==='routePlan'){const r=lesson.routes.find(r=>r.id===b.dataset.id);if(!r)return true;state.plan=r.stops.slice();persist();closeModal();plannerModal();toast('ルートを見学プランに入れました。時間は自分たちで調べよう。');}else if(a==='teacherChapters')chapterTeacherModal(b.dataset.place);else if(a==='teacherChapterBack')teacherModal('content',b.dataset.place);else return false;return true;}
function handleLearningSubmit(form,fd){if(form.dataset.form!=='chapterTeacher')return false;const next=JSON.parse(JSON.stringify(lesson)),p=next.places.find(p=>p.id===form.dataset.place),chapter=p?.chapters.find(c=>c.id===form.dataset.chapter);if(!chapter)throw Error('学習項目が見つかりません。');for(const key of ['title','location','body','detail','question','source'])chapter[key]=String(fd.get(key)||'').trim();saveLesson(next,false);chapterTeacherModal(p.id,chapter.id);toast('学習項目を保存しました。');return true;}
function handleLearningInput(e){const el=e.target;if(!el.hasAttribute('data-learning-note'))return false;normaliseLearning();const pid=el.dataset.place,cid=el.dataset.chapter;if(!place(pid)?.chapters.some(c=>c.id===cid))return true;state.learning[pid]=state.learning[pid]||{};state.learning[pid][cid]={done:state.learning[pid][cid]?.done||false,note:el.value};persist();return true;}
function handleLearningChange(el){if(!el.hasAttribute('data-chapter-select'))return false;chapterTeacherModal(el.dataset.place,el.value);return true;}

function validExtras(s){
 if(s.schedule!==undefined&&!KQS.validateRows(s.schedule))return false;
 for(const [key,max]of [['tripDate',10],['members',500],['scheduleNote',1000]])if(s[key]!==undefined&&(typeof s[key]!=='string'||s[key].length>max))return false;
 if(s.items!==undefined){if(!s.items||typeof s.items!=='object'||Array.isArray(s.items))return false;for(const [id,v]of Object.entries(s.items))if(!place(id)||!v||!validTime(v.time))return false;}
 if(s.expenses!==undefined){if(!Array.isArray(s.expenses)||s.expenses.length>200)return false;for(const e of s.expenses)if(!e||typeof e.place!=='string'||e.place.length>200||typeof e.kind!=='string'||typeof e.reason!=='string'||e.reason.length>3000||['before','amount','after'].some(k=>!Number.isFinite(e[k])||e[k]<0||e[k]>100000))return false;}
 if(s.cashRemaining!==undefined&&(!Number.isFinite(s.cashRemaining)||s.cashRemaining<0||s.cashRemaining>100000))return false;return true;
}
function normaliseExtras(){state.schedule=state.schedule||[];state.tripDate=state.tripDate||'';state.members=state.members||'';state.scheduleNote=state.scheduleNote||'';state.items=state.items||{};state.expenses=state.expenses||[];if(state.cashRemaining===undefined)state.cashRemaining=lesson.mission.allowance??3000;for(const id of Object.keys(state.visits))if(!state.items[id])state.items[id]={time:state.visits[id].time};}
function itemFor(id){const p=place(id);return {name:p.itemName||p.name+'の思い出',description:p.itemDescription||'この場所で問いを考えた、探検のしるし。',type:p.itemType||'medal'};}
function itemArt(type){const shapes={scroll:'<path d="M25 20h38v48H25Z" fill="#f0d797"/><path d="M25 20q-8-9-11 0v39q10-4 11 9m38-48q9-9 11 0v39q-10-4-11 9" fill="#bc8c4f"/><path d="M34 32h20m-20 9h20m-20 9h13" stroke="#b98a54" stroke-width="3"/>',medal:'<path d="m27 13 14 4-8 29-13-5Zm22 4 14-4 7 28-13 5Z" fill="#65866c"/><circle cx="45" cy="55" r="21" fill="#dfb763" stroke="#b88d43" stroke-width="3"/><path d="m45 39 4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1Z" fill="#fff0b7"/>',leaf:'<path d="M67 16C28 13 12 40 28 67c33 12 47-16 39-51Z" fill="#7eaa7d"/><path d="m22 75 35-44m-24 30-4-18m16 3 15-2" fill="none" stroke="#466f4a" stroke-width="3"/>',shell:'<path d="M17 55q-7-31 8-33 4-17 18-7 14-10 21 7 18 4 9 33L49 73H38Z" fill="#e6b49a" stroke="#be8d75" stroke-width="2"/><path d="m25 27 17 38m2-43 1 42m16-36L49 66M20 48l20 19m29-19L50 67" stroke="#fff1db" stroke-width="3"/>',fish:'<path d="M16 43q26-31 48 0l16-16v36L64 48Q41 76 16 43Z" fill="#729fac"/><circle cx="32" cy="40" r="4" fill="#fff5de"/><circle cx="33" cy="40" r="2" fill="#3c6670"/><path d="m45 28 10-9 4 18m-16 19 7 14 8-16" fill="#5c8c9c"/>',train:'<rect x="21" y="16" width="48" height="54" rx="10" fill="#547d59"/><path d="M22 52h46v9H22" fill="#eacb81"/><path d="M28 26h14v17H28Zm21 0h14v17H49Z" fill="#d9e8dd"/><path d="m30 70-7 10m37-10 7 10" stroke="#476247" stroke-width="4"/>'};return `<svg viewBox="0 0 90 90" aria-hidden="true">${shapes[type]||shapes.medal}</svg>`;}
function awardItem(id){if(state.items[id])return false;state.items[id]={time:state.time};return true;}
function collectionModal(){normaliseExtras();openModal('集めたデジタルおみやげ',`<h3>学んだ場所が、たからものに。</h3><p>見学してスタンプを押すと、その場所のおみやげが手に入ります。<b>${Object.keys(state.items).length} / ${lesson.places.length}</b> を発見！</p><div class="collection-grid">${lesson.places.map(p=>{const got=!!state.items[p.id],item=itemFor(p.id);return `<button type="button" class="collection-card ${got?'obtained':''}" data-action="spot" data-id="${p.id}"><div class="collection-art">${got?itemArt(item.type):'<span>?</span>'}</div><small>${esc(p.name)}</small><b>${got?esc(item.name):'まだ出会っていない'}</b><p>${got?esc(item.description):'この場所で学ぶと手に入るよ。'}</p></button>`;}).join('')}</div>`,true);}
function scheduleHTML(){normaliseExtras();return `<main class="section-panel" id="schedule"><div class="section-heading"><div><h2>班別行動の予定表</h2><p>学んだルートをたたき台にして、時刻・見学・昼食・休憩を班で調整しよう。</p></div><div class="modal-actions no-print" style="margin-top:0">${button('scheduleBuild',icon('book')+'旅からたたき台を作る','small')}${button('scheduleXlsx',icon('download')+'Excel','small primary',state.schedule.length?'':'disabled')}${button('scheduleCsv',icon('download')+'スプシ用CSV','small',state.schedule.length?'':'disabled')}${button('schedulePrint',icon('print')+'印刷','small')}</div></div><div class="schedule-meta no-print"><label>班名<input data-meta="team" type="text" value="${esc(state.team)}" maxlength="40"></label><label>修学旅行の日付<input data-meta="tripDate" type="date" value="${esc(state.tripDate)}"></label><label class="span2">メンバー・役割<input data-meta="members" type="text" maxlength="500" value="${esc(state.members)}" placeholder="名前や役割を入力（必要なときだけ）"></label><label class="span2">予定表のメモ<input data-meta="scheduleNote" type="text" maxlength="1000" value="${esc(state.scheduleNote)}" placeholder="集合場所、先生への質問など"></label></div><p class="print-only">${esc(state.team)}　${esc(state.tripDate)}　${esc(state.members)}</p><p class="notice">時刻・所要時間・運賃は、自分たちで調べて入力します。たたき台には入力済みの値だけをコピーし、計算は追加しません。</p><div class="schedule-table-wrap"><table class="schedule-table"><thead><tr><th>順</th><th>開始</th><th>終了</th><th>出発地</th><th>行き先・活動</th><th>種類・手段</th><th>班の計算（分）</th><th>運賃（円）</th><th>根拠・メモ</th><th>担当</th><th class="no-print">操作</th></tr></thead><tbody>${state.schedule.map((r,i)=>`<tr><td data-label="順">${i+1}</td>${[['start','開始','time'],['end','終了','time'],['from','出発地','text'],['activity','行き先・活動','text']].map(([field,label,type])=>`<td data-label="${label}"><input aria-label="${i+1}行目 ${label}" data-srow="${i}" data-sfield="${field}" type="${type}" ${type==='text'?'maxlength="200"':''} value="${esc(r[field])}"><span class="print-only">${esc(r[field])}</span></td>`).join('')}<td data-label="種類・手段"><select aria-label="${i+1}行目 種類" data-srow="${i}" data-sfield="kind">${['移動','見学','昼食','休憩','買い物','集合','その他'].map(s=>`<option ${r.kind===s?'selected':''}>${s}</option>`).join('')}</select><select aria-label="${i+1}行目 交通手段" data-srow="${i}" data-sfield="transport">${['','徒歩','江ノ電','バス','その他'].map(s=>`<option value="${s}" ${r.transport===s?'selected':''}>${s||'手段なし'}</option>`).join('')}</select><span class="print-only">${esc(r.kind)} ${esc(r.transport)}</span></td>${[['minutes','班の計算（分）'],['fare','運賃（円）']].map(([field,label])=>`<td data-label="${label}"><input aria-label="${i+1}行目 ${label}" data-srow="${i}" data-sfield="${field}" type="number" min="0" max="100000" value="${esc(r[field])}"><span class="print-only">${esc(r[field])}</span></td>`).join('')}<td data-label="根拠・メモ"><textarea aria-label="${i+1}行目 根拠・メモ" data-srow="${i}" data-sfield="evidence" maxlength="5000">${esc(r.evidence)}</textarea><span class="print-only">${esc(r.evidence)}</span></td><td data-label="担当"><input aria-label="${i+1}行目 担当" data-srow="${i}" data-sfield="owner" maxlength="200" value="${esc(r.owner)}"><span class="print-only">${esc(r.owner)}</span></td><td class="no-print schedule-row-tools">${button('scheduleUp','↑','small','data-index="'+i+'" aria-label="'+(i+1)+'行目を上へ" '+(i===0?'disabled':''))}${button('scheduleDown','↓','small','data-index="'+i+'" aria-label="'+(i+1)+'行目を下へ" '+(i===state.schedule.length-1?'disabled':''))}${button('scheduleRemove','×','small','data-index="'+i+'" aria-label="'+(i+1)+'行目を削除"')}</td></tr>`).join('')}</tbody></table></div>${state.schedule.length?'':'<div class="empty">「旅からたたき台を作る」または「行を追加」から始めよう。</div>'}<div class="modal-actions no-print">${button('scheduleAdd',icon('plus')+'行を追加','',state.schedule.length>=100?'disabled':'')}${button('scheduleCheck','時刻のつながりを確かめる')}${button('collection','おみやげ図鑑')}${lesson.mission.allowanceMode?button('money','お金のノート'):''}</div><div id="schedule-review" role="status"></div><p class="helper no-print">Excelには予定表とお金の記録を出力します。CSVはGoogleスプレッドシートの「ファイル → インポート → アップロード」から取り込めます。元の学習記録を残して、予定表だけを編集できます。</p></main>`;}
function paymentFields(p){if(!lesson.mission.allowanceMode||state.visits[p.id]||p.fee===null||p.fee===undefined)return '';return `<div class="question"><small>おこづかいモード</small><p>この場所の学習用料金：${p.fee}円 ／ いまの記録上の持ち金：${state.cashRemaining}円</p><label class="form-label">支払い後の残金を自分で計算しよう<input name="visitBalance" type="number" min="0" max="100000" required></label><label class="form-label" style="margin-top:9px">お金の計算のしかた<input name="visitReason" type="text" maxlength="1000" required placeholder="持ち金から、どのように計算した？"></label></div>`;}
function reviewPayment(before,amount,after){return before-amount===after?'':'支払う前のお金・支払額・残金のつながりを、もう一度引き算で確かめよう。';}
function recordVisitPayment(p,fd){if(!lesson.mission.allowanceMode||state.visits[p.id]||p.fee===null||p.fee===undefined)return;const after=Number(fd.get('visitBalance')),reason=String(fd.get('visitReason')||'').trim();if(fd.get('visitBalance')===null||!reason||after<0||!Number.isFinite(after))throw Error('支払い後の残金と計算の根拠を入力してください。');const hint=reviewPayment(state.cashRemaining,p.fee,after);state.expenses.push({place:p.name,kind:'拝観・入館',amount:p.fee,before:state.cashRemaining,after,reason,review:hint});state.cashRemaining=after;}
function moneyModal(editIndex=null){normaliseExtras();if(!lesson.mission.allowanceMode){openModal('おこづかいモード',`<p>先生の準備室の「旅の条件」で、おこづかいモードと最初の持ち金を設定できます。各場所の学習用料金は「場所・写真・問い」で設定します。</p>`);return;}const old=editIndex===null?null:state.expenses[editIndex];openModal('お金のノート',`<h3>持ち金を、どう使う？</h3><p>先生が設定した持ち金 <b>${lesson.mission.allowance}円</b> ／ 自分で計算した残金 <b>${state.cashRemaining}円</b></p><p class="helper">拝観・入館・交通・買い物などの支払いを記録しよう。引き算の答えは自動で出しません。</p><form data-form="money" ${editIndex===null?'':'data-index="'+editIndex+'"'}><div class="form-grid"><label>場所・使い道<input name="place" maxlength="200" value="${esc(old?.place||place(state.position).name)}" required></label><label>種類<select name="kind">${['拝観・入館','交通','食事','買い物','その他'].map(k=>`<option ${old?.kind===k?'selected':''}>${k}</option>`).join('')}</select></label><label>支払い前の持ち金（円）<input name="before" type="number" min="0" max="100000" value="${old?.before??state.cashRemaining}" required></label><label>調べた支払額（円）<input name="amount" type="number" min="0" max="100000" value="${old?.amount??''}" required></label><label>自分で計算した残金（円）<input name="after" type="number" min="0" max="100000" value="${old?.after??''}" required></label><label class="span2">どう計算した？<textarea name="reason" maxlength="3000" required>${esc(old?.reason||'')}</textarea></label></div><div class="modal-actions">${button('moneyCheck','引き算を見直すヒント','small')}<button class="btn primary" type="submit">${old?'修正して保存':'支払いを記録する'}</button></div><div id="money-review" role="status"></div></form><h4>支払いの記録</h4>${state.expenses.map((r,i)=>`<div class="journal-entry"><b>${esc(r.place)}</b> <span class="tag">${esc(r.kind)}</span><p>${r.before}円 → 支払い ${r.amount}円 → 計算した残金 ${r.after}円<br>${esc(r.reason)}</p>${r.review?`<p class="tip">${esc(r.review)}</p>`:''}${button('moneyEdit','この計算を修正','small','data-index="'+i+'"')}</div>`).join('')||'<p class="helper">まだ支払いの記録はありません。</p>'}<p class="notice">同じ支払いは1回だけ記録しよう。以前の記録を修正したら、その後の残金も自分で見直します。Excelにはこの記録も含まれます。</p>`,true);}
function handleExtraAction(a,b){if(a==='schedule'){tab='schedule';render();}else if(a==='collection')collectionModal();else if(a==='money')moneyModal();else if(a==='moneyEdit')moneyModal(Number(b.dataset.index));else if(a==='moneyCheck'){const f=b.closest('form');if(!f.reportValidity())return true;const fd=new FormData(f),hint=reviewPayment(Number(fd.get('before')),Number(fd.get('amount')),Number(fd.get('after')));$('#money-review').innerHTML='<p class="notice">'+esc(hint||'入力した金額同士に大きな食い違いは見つかりませんでした。支払額の資料も確かめよう。')+'</p>';}else if(a==='scheduleAdd'){if(state.schedule.length<100)state.schedule.push(KQS.createRow());persist();render();}else if(a==='scheduleRemove'){state.schedule.splice(Number(b.dataset.index),1);persist();render();}else if(a==='scheduleUp'||a==='scheduleDown'){const i=Number(b.dataset.index),j=i+(a==='scheduleUp'?-1:1);if(j>=0&&j<state.schedule.length)[state.schedule[i],state.schedule[j]]=[state.schedule[j],state.schedule[i]];persist();render();}else if(a==='scheduleCheck'){const notes=KQS.reviewRows(state.schedule);$('#schedule-review').innerHTML='<div class="notice">'+(notes.length?notes.map(esc).join('<br>'):'時刻同士の大きな重なりは見つかりませんでした。見学先・時刻表・集合条件も資料で確かめよう。')+'</div>';}else if(a==='scheduleBuild'){if(state.schedule.length)openModal('予定表のたたき台を作り直す',`<p>予定表の編集内容を、現在の旅の記録から作ったたたき台に置き換えます。必要な予定表は先にExcelで残してください。</p><div class="modal-actions">${button('scheduleXlsx','先にExcelで残す')}${button('scheduleBuildConfirmed','たたき台を作り直す','primary')}</div>`);else{state.schedule=KQS.fromJourney(lesson,state);persist();render();}}else if(a==='scheduleBuildConfirmed'){state.schedule=KQS.fromJourney(lesson,state);persist();closeModal();tab='schedule';render();}else if(a==='scheduleXlsx'){download('kamakura-schedule.xlsx',KQS.xlsx(lesson,state,KQTemplate),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');toast('班の予定表とお金の記録をExcelにまとめました。');}else if(a==='scheduleCsv'){download('kamakura-schedule.csv',KQS.csv(lesson,state),'text/csv;charset=utf-8');toast('Googleスプレッドシートに取り込めるCSVを書き出しました。');}else if(a==='schedulePrint'){closeModal();tab='schedule';render();window.print();}else return false;return true;}
function handleExtraSubmit(f,fd){if(f.dataset.form!=='money')return false;const record={place:String(fd.get('place')).trim(),kind:fd.get('kind'),before:Number(fd.get('before')),amount:Number(fd.get('amount')),after:Number(fd.get('after')),reason:String(fd.get('reason')).trim()};record.review=reviewPayment(record.before,record.amount,record.after);const index=f.dataset.index===undefined?null:Number(f.dataset.index);if(index===null){if(state.expenses.length>=200)throw Error('支払い記録は200件までです。');state.expenses.push(record);state.cashRemaining=record.after;}else{state.expenses[index]=record;if(index===state.expenses.length-1)state.cashRemaining=record.after;}persist();moneyModal();toast('自分たちのお金の計算を記録しました。');return true;}
function handleExtraInput(e){const el=e.target;if(el.dataset.meta){state[el.dataset.meta]=el.value;persist();return true;}if(el.dataset.sfield){const r=state.schedule[Number(el.dataset.srow)];if(r){r[el.dataset.sfield]=el.type==='number'&&el.value!==''?Number(el.value):el.value;persist();}return true;}return false;}
function handleExtraChange(el){if(el.dataset.sfield||el.dataset.meta){handleExtraInput({target:el});return true;}return false;}

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(busy&&!['close','zoom','center'].includes(a)){toast('キャラクターが移動しています。少し待ってね。');return;}
if(handleQuizAction(a,b)||handleLearningAction(a,b)||handleExtraAction(a,b))return;
if(a==='close')closeModal();else if(a==='tab'){tab=b.dataset.tab;render();}else if(a==='help')helpModal();else if(a==='sources')sourcesModal();else if(a==='spot')spotModal(b.dataset.id);else if(a==='mapmode'){mapMode=b.dataset.mode;tileFailed=false;render();}else if(a==='zoom'){zoom=Math.max(1,Math.min(3.5,zoom+Number(b.dataset.delta)*.5));if(zoom===1)center={x:600,y:365};updateView();}else if(a==='center'){const p=place(state.position);center=project(p.lat,p.lng);zoom=Math.max(zoom,1.75);updateView();}else if(a==='move')inquiryForm(b.dataset.id);else if(a==='train')trainModal();else if(a==='railDestination')inquiryForm(b.dataset.id,'train');else if(a==='direction')direction(b.dataset.dir);else if(a==='teacher')teacherModal();else if(a==='teacherTab')teacherModal(b.dataset.view);else if(a==='filter'){filter=b.dataset.value;render();}else if(a==='addPlan'){if(!state.plan.includes(b.dataset.id))state.plan.push(b.dataset.id);persist();toast('見学プランに追加しました。');}else if(a==='planner')plannerModal();else if(a==='planRemove'){state.plan.splice(Number(b.dataset.index),1);persist();plannerModal();}else if(a==='planUp'){const i=Number(b.dataset.index);[state.plan[i-1],state.plan[i]]=[state.plan[i],state.plan[i-1]];persist();plannerModal();}else if(a==='totals')totalsModal();else if(a==='revise'){const i=Number(b.dataset.index),l=state.legs[i];inquiryForm(l.to,l.mode,i);}else if(a==='reviewLeg')showReview(b.closest('form'));else if(a==='hint'){const level=Number(b.dataset.level),train=b.dataset.mode==='train';const hints=train?['平日と土休日、乗る方向、出発する駅を先に確かめよう。','駅に着く時刻に、切符購入の時間を足してみよう。その後に発車する電車を探そう。','同じ電車の発車と到着の欄を見よう。駅に着いてからの全体の時間には、購入・待ち時間も含まれているかな？']:['地図の縮尺や道の長さを手がかりにしよう。直線距離と歩く道の長さは同じかな？','歩く速さを班で仮定して、距離からかかる時間を考えてみよう。信号や混雑の時間も必要かな？','出発時刻から到着時刻までの差と、計算した移動時間を比べよう。資料を変えると予想は変わるかな？'];const div=document.createElement('div');div.className='question';div.innerHTML='<small>ヒント '+level+'</small><p>'+esc(hints[level-1])+'</p>';$('#inquiry-hints').append(div);b.dataset.level=String(level+1);if(level>=3){b.disabled=true;b.textContent='3つのヒントを見たよ';}else b.textContent='次のヒントを見る';}else if(a==='journalExport'){download('kamakura-journal-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2));toast('提出用の記録を書き出しました。');}else if(a==='lessonJSON'){download('kamakura-quest-lesson.json',JSON.stringify(lesson,null,2));}else if(a==='lessonHTML')exportHTML();else if(a==='photoRemove'){place(b.dataset.id).photos.splice(Number(b.dataset.index),1);persistLesson();teacherModal('content',b.dataset.id);}else if(a==='print'){tab='journal';render();window.print();}else if(a==='reset'){openModal('旅をはじめ直す',`<p>この端末の見学・移動・メモを消して、出発地点へ戻ります。必要な記録は先に書き出してください。</p><div class="modal-actions">${button('journalExport','先に記録を書き出す')}${button('resetConfirmed','記録を消してはじめ直す','danger')}</div>`);}else if(a==='resetConfirmed'){state=newState();persist();closeModal();tab='explore';zoom=1;render();toast('新しい旅がはじまりました。');}else if(a==='restoreLesson'){openModal('標準教材に戻す',`<p>この端末の先生の編集を標準教材に戻します。編集した教材を残すには、先に教材HTMLを書き出してください。</p><div class="modal-actions">${button('lessonHTML','先に教材HTMLを書き出す')}${button('restoreConfirmed','標準教材に戻す','danger')}</div>`);}else if(a==='restoreConfirmed'){saveLesson(JSON.parse(JSON.stringify(initial)),true);closeModal();toast('標準教材に戻しました。');}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=new FormData(f);try{
if(handleLearningSubmit(f,fd)||handleExtraSubmit(f,fd))return;
if(f.dataset.form==='visit'){const id=f.dataset.id,note=String(fd.get('note')).trim();if(!state.visits[id]&&!KQ.chapterProgress(lesson,state,id).complete){toast('すべての学習項目を終えて100％にしてから、スタンプを押そう。');return;}if(lesson.mission.requireNote&&!note){toast('発見メモを書いてみよう。');return;}state.notes[id]=note;if(state.position===id){const finish=fd.get('finish');if(timeMinutes(finish)<timeMinutes(state.time)){toast('見学を終える時刻が、到着より前になっています。確かめよう。');return;}recordVisitPayment(place(id),fd);state.time=finish;state.visits[id]={time:state.time};awardItem(id);}persist();const all=lesson.mission.checkpoints.every(id=>state.visits[id]);if(id===lesson.mission.goal&&state.position===id){if(all){state.completed=true;persist();closeModal();tab='journal';render();toast('ミッション達成！自分たちの学びを振り返ろう。');}else{closeModal();render();toast('まだ見学していない必須ポイントがあるよ。地図で確かめよう。');}}else{closeModal();render();toast('発見を記録。'+itemFor(id).name+'をゲット！');}}
else if(f.dataset.form==='leg'){const leg=readLeg(f);if(!leg.evidence){toast('調べたことや計算の根拠を書こう。');return;}if(f.dataset.index!==undefined){const i=Number(f.dataset.index),old=state.legs[i];const {revisions,...snapshot}=old;leg.revisions=[...revisions,snapshot];if(leg.revisions.length>100)throw Error('この移動の修正回数が上限に達しました。');state.legs[i]=leg;persist();closeModal();tab='journal';render();toast('前の考えも残して、修正しました。');}else travel(leg);}
else if(f.dataset.form==='totals'){state.time=fd.get('time');state.totalFare=fd.get('totalFare')===''?'':Number(fd.get('totalFare'));state.fareReason=String(fd.get('fareReason'));persist();closeModal();render();toast('自分たちの計算を記録しました。');}
else if(f.dataset.form==='addPlan'){const id=fd.get('place');if(id&&!state.plan.includes(id))state.plan.push(id);persist();plannerModal();}
else if(f.dataset.form==='teacherSettings'){const next=JSON.parse(JSON.stringify(lesson));next.title=String(fd.get('title')).trim();next.version=Date.now();next.mission={start:fd.get('start'),goal:fd.get('goal'),checkpoints:fd.getAll('checkpoints'),startTime:fd.get('startTime'),endTime:fd.get('endTime'),ticketMinutes:Number(fd.get('ticketMinutes')),budget:Number(fd.get('budget')),allowanceMode:fd.has('allowanceMode'),allowance:Number(fd.get('allowance')),prompt:String(fd.get('prompt')).trim(),requireNote:fd.has('requireNote')};saveLesson(next,true);teacherModal();toast('新しい条件を保存しました。');}
else if(f.dataset.form==='teacherContent'){const next=JSON.parse(JSON.stringify(lesson)),p=next.places.find(p=>p.id===f.dataset.id);for(const key of ['name','headline','story','question','tip','source','itemName','itemDescription'])p[key]=String(fd.get(key)).trim();p.fee=fd.get('fee')===''?null:Number(fd.get('fee'));saveLesson(next,false);teacherModal('content',p.id);toast('文章と問いを保存しました。');}
else if(f.dataset.form==='addPlace'){const next=JSON.parse(JSON.stringify(lesson)),id='custom-'+Date.now().toString(36);next.places.push({id,name:String(fd.get('name')).trim(),category:fd.get('category'),lat:Number(fd.get('lat')),lng:Number(fd.get('lng')),headline:'自分たちの問いを見つけよう',story:'先生がこの場所のエピソードを入力してください。',question:'この場所で何を調べたい？',tip:'見学ルールを確かめよう。',source:'https://education.trip-kamakura.com/',photos:[],fee:null,itemName:String(fd.get('name')).trim()+'の思い出',itemDescription:'この場所で学んだ証。',itemType:'medal'});next.edges.push({a:id,b:fd.get('connect'),mode:'walk'});saveLesson(next,false);teacherModal('content',id);toast('新しい場所を追加しました。エピソードを編集できます。');}
}catch(error){toast(error.message||'保存できませんでした。入力を確かめてください。');}});
document.addEventListener('input',e=>{if(handleLearningInput(e)||handleExtraInput(e))return;if(e.target.id==='team-name'){state.team=e.target.value;persist();}else if(e.target.id==='reflection'){state.reflection=e.target.value;persist();}else if(e.target.id==='spot-search'){query=e.target.value;$('#spot-grid').innerHTML=spotCards(lesson.places.filter(p=>(filter==='all'||p.category===filter)&&(p.name+p.story).includes(query)));}});
document.addEventListener('change',async e=>{const input=e.target;try{if(handleLearningChange(input)||handleExtraChange(input))return;if(input.id==='teacher-place'){teacherModal('content',input.value);}else if(input.id==='lesson-import'){const file=input.files[0];if(!file)return;if(file.size>18000000)throw Error('教材ファイルが大きすぎます。');const next=validateLesson(JSON.parse(await file.text()));saveLesson(next,true);teacherModal('share');toast('教材を読み込みました。');}else if(input.id==='journal-import'){const file=input.files[0];if(!file)return;if(file.size>3000000)throw Error('記録ファイルが大きすぎます。');const next=JSON.parse(await file.text());if(!validJournal(next))throw Error('記録の形式が異なるか、別の教材の記録です。同じ教材を開いてください。');state=next;persist();render();toast('記録を読み込みました。');}else if(input.id==='photo-upload'){const p=place(input.dataset.id),files=[...input.files];if(p.photos.length+files.length>4)throw Error('写真は各場所4枚までです。');const results=[];for(const file of files){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPEG・PNG・WebPの写真を選んでください。');if(file.size>20000000)throw Error('写真は1枚20MB以下で選んでください。');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);results.push(c.toDataURL('image/jpeg',.78));}finally{URL.revokeObjectURL(url);}}const next=JSON.parse(JSON.stringify(lesson));next.places.find(x=>x.id===p.id).photos.push(...results);saveLesson(next,false);teacherModal('content',p.id);toast('写真を追加しました。');}}catch(error){toast(error.message||'ファイルを読み込めませんでした。');input.value='';}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.target.isContentEditable)return;if(e.target.matches('.map-point')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();spotModal(e.target.dataset.id);return;}const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d&&tab==='explore'&&!$('dialog')){e.preventDefault();direction(d);}});
let pointerStart=null;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#world-map')&&!e.target.closest('.map-point')&&zoom>1){pointerStart={x:e.clientX,y:e.clientY,c:{...center}};}});
document.addEventListener('pointermove',e=>{if(!pointerStart||!$('#world-map'))return;const box=$('#world-map').getBoundingClientRect(),scale=Math.min(box.width/(1200/zoom),box.height/(730/zoom));center={x:pointerStart.c.x-(e.clientX-pointerStart.x)/scale,y:pointerStart.c.y-(e.clientY-pointerStart.y)/scale};updateView();});
document.addEventListener('pointerup',()=>pointerStart=null);document.addEventListener('pointercancel',()=>pointerStart=null);
window.addEventListener('beforeunload',()=>persist());
render();
KR.install();
if(location.protocol==='file:'){document.querySelectorAll('link[data-external-icon]').forEach(link=>link.remove());}
})();
</script></body></html>
